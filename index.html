 of the scenario:","A retailer's old, costly phone system cannot scale or support digital channels.","The company wants lower costs, easy scaling in busy seasons, and real-time customer information for reps.","Example: like moving from a heavy filing cabinet to cloud storage.","So the question is: which cloud solution should replace the old contact center?","Correct Answer: Deploy Salesforce Contact Center with Amazon Connect to unify voice, chat, and case management in the cloud with real-time insights.","Why This Is Correct","Salesforce Contact Center with Amazon Connect unifies voice, chat, and case management into a single cloud-native platform, replacing the costly and hard-to-scale on-premises infrastructure the company currently has.","Because it's cloud-based, it scales elastically during seasonal spikes without needing to provision or maintain any additional physical hardware, directly solving the scalability pain point.","It also surfaces real-time customer insights to reps as part of the unified platform, giving the company the visibility it wants alongside voice and chat, all through one connected solution rather than several separate systems.","Why the Other Options Are Incorrect","Option A is incorrect: Building a custom Experience Cloud solution integrated with external telephony providers requires significant custom development and ongoing maintenance instead of using a native, unified cloud contact center.","Option C is incorrect: Extending legacy on-premises systems keeps the very overhead and scaling problems the company is trying to eliminate.","Reference:","Salesforce Contact Center with Amazon Connect – Salesforce Help"]},{"id":"E1-35","exam":1,"n":35,"q":"Universal Containers (UC) has decided to use skills-based routing to ensure service reps are assigned the appropriate work item. UC requires that it can view the backlog of work grouped by skills, to reassign reps to the appropriate skill. What should the Service Cloud Consultant recommend?","o":["Configure custom logging and capacity alerts in Omni-Channel flow.","Use the capabilities within Omni Supervisor.","Create a custom report type with inline editing."],"a":1,"x":["Core ask of the scenario:","The company routes work to reps by skills and wants to see the pile of waiting work grouped by skill.","It also wants to move reps to where they are needed.","Example: like a manager looking at the queue at each counter and sending staff to the busiest one.","So the question is: which tool gives this live view?","Correct Answer: Use the capabilities within Omni Supervisor.","Why This Is Correct","Omni Supervisor gives managers a live view of the work backlog grouped by skill, so they can immediately see which skill areas have a growing queue of unassigned work.","From that same view, managers can reassign or update reps' skills directly, letting them respond to the backlog in real time instead of working through a separate admin process.","Because this capability is native to Omni Supervisor, it requires no custom development, and it keeps skills-based routing responsive to actual, current demand rather than a static configuration set once and forgotten.","Why the Other Options Are Incorrect","Option A is incorrect: Custom logging and capacity alerts don't provide a skills-grouped backlog view or a way to reassign rep skills.","Option C is incorrect: A custom report type with inline editing isn't a real-time operational tool for managing routing backlog by skill.","Reference:","Manage Support Reps, Queues, and Skills – Salesforce Help"]},{"id":"E1-36","exam":1,"n":36,"q":"Cloud Kicks is implementing a focused Messaging strategy to pass priority issues to the right reps. Which solution should a Service Cloud Consultant explore to track handle time and messaging session resolution on these specific interactions?","o":["Create a custom report type with AgentWork as the primary object and Messaging Session as the secondary object.","Create a custom report type with AgentWork as the primary object and Messaging User as the secondary object.","Create a custom report type with Messaging Session as the primary object and AgentWork as the secondary object."],"a":2,"x":["Core ask of the scenario:","The company routes important messaging issues to the right reps.","It wants to measure how long reps spend and whether each messaging session was resolved.","Example: like a report that connects each chat to the time the rep spent on it.","So the question is: how should the custom report type be built?","Correct Answer: Create a custom report type with Messaging Session as the primary object and AgentWork as the secondary object.","Why This Is Correct","Because a single messaging session can involve multiple agent work assignments, for example after a transfer between reps, using Messaging Session as the primary object keeps the full session as the central unit of analysis.","Making AgentWork the secondary (child) object lets the report roll up every rep's individual handle time within that session, so the total time and resolution status reflect the whole conversation, not just one segment of it.","This structure ensures accurate reporting even in edge cases like transfers or reassignments, since every AgentWork record tied to the session gets counted under that same session in the report.","Why the Other Options Are Incorrect","Option A is incorrect: Putting AgentWork as the primary object with Messaging Session as secondary would report on individual work assignments rather than the session as a whole, making it harder to track overall session resolution.","Option B is incorrect: Messaging User isn't the right secondary object for measuring rep handle time; AgentWork is the object that captures that.","Reference:","Report on Messaging Activity – Salesforce Help"]},{"id":"E1-37","exam":1,"n":37,"q":"Cloud Kicks is planning a Service Cloud implementation to reduce the time spent and improve the quality of service rep messaging sessions with customers. After discussions with leadership and the customer service team, the consultant determines that the biggest gains with the least amount of effort for configuring a standard Einstein for Service feature are from automating standard responses. Which feature meets this requirement most effectively?","o":["Einstein Reply Recommendations","Einstein Article Recommendations","Einstein Case Wrap-Up"],"a":0,"x":["Core ask of the scenario:","Reps spend a lot of time in messaging sessions typing common replies.","The company wants the biggest gain from the easiest standard Einstein feature.","Example: like predictive text that suggests a full reply sentence.","So the question is: which feature automates standard responses?","Correct Answer: Einstein Reply Recommendations","Why This Is Correct","Einstein Reply Recommendations is the standard, out-of-the-box Einstein for Service feature purpose-built to suggest and automate ready-to- send standard responses during messaging conversations.","Because it's a standard feature rather than a custom build, it delivers the \"biggest gains with the least amount of effort\" the consultant identified, requiring configuration rather than development.","It directly reduces both the time spent per conversation and improves consistency of responses, since reps are choosing from vetted, recommended replies instead of typing similar answers from scratch each time.","Why the Other Options Are Incorrect","Option B is incorrect: Einstein Article Recommendations surfaces knowledge articles, not ready-to-send standard reply text.","Option C is incorrect: Einstein Case Wrap-Up automates post-conversation summarization, not automating the standard responses sent during the conversation itself.","Reference:","Set Up Einstein Reply Recommendations – Salesforce Help"]},{"id":"E1-38","exam":1,"n":38,"q":"Universal Containers has three internal divisions that use Salesforce Knowledge. Compliance requirements mandate that each division should only have access to its own articles when performing a search. Which solution should a consultant recommend to meet this requirement?","o":["Create a single data category group for each division and provide access using the role hierarchy.","Create a sharing rule for each division to provide access based on the article category.","Create a sharing rule for each division to provide access using the role hierarchy."],"a":0,"x":["Core ask of the scenario:","Three divisions use Salesforce Knowledge and each may only search its own articles.","This is a rule from compliance, so access must be controlled carefully.","Example: like a library where each department can only borrow from its own shelves.","So the question is: how do you limit article access by division?","Correct Answer: Create a single data category group for each division and provide access using the role hierarchy.","Layman’s analogy:","Think of Knowledge as a big office library with three locked sections, one per division:","Data category group = the colored labels on each section (Finance = blue, HR = green, Legal = red) Role-based visibility = the ID badge each employee carries. A blue badge opens only the blue section.","Sharing rules = handing out spare keys one book at a time. That’s the wrong tool for a library organized by sections.","When a Finance employee searches the library, they only see books from the blue section. Compliance stays happy, and so does the librarian. Exam tip:","Knowledge + “who can see which articles” = Data Categories. When a Knowledge question asks about restricting article visibility by group, region, or division, look for data categories with visibility through roles, profiles, or permission sets. Options mentioning sharing rules for Knowledge are almost always distractors.","Why the Other Options Are Incorrect","Option B is incorrect: Sharing rules aren't used to control Knowledge article visibility by data category; visibility is governed through data category group access instead.","Option C is incorrect: The same limitation applies: sharing rules are not the mechanism used to restrict Knowledge search results by category.","Reference:","Data Category Visibility – Salesforce Help"]},{"id":"E1-39","exam":1,"n":39,"q":"Cloud Kicks (CK) provides customized support based on product line and plans to expand from voice-only support. Support reps are certified on one or more specific product lines. CK would like to provide support through multiple channels and wants to ensure a consistent customer experience. Which solution should the Service Cloud Consultant recommend to meet the requirements?","o":["Omni-Channel with Omni-Flow Routing and Skills","Omni-Channel with Capacity-Based Routing","Omni-Channel with Queue-Based Routing"],"a":0,"x":["Core ask of the scenario:","The company supports different product lines and reps are certified on specific ones.","It wants to add more channels beyond phone while keeping the customer experience the same.","Example: like a call center that sends each caller to the person trained on their product, whether they call, chat or text.","So the question is: which routing solution matches work to rep skills across channels?","Correct Answer: Omni-Channel with Omni-Flow Routing and Skills","Why This Is Correct","Omni-Channel with Omni-Flow Routing and Skills lets Cloud Kicks tag each rep with the specific product-line skills they're certified on, so work is only routed to someone qualified to handle it.","Because Omni-Flow Routing applies this skill-based logic consistently across every channel CK adds, from voice to chat to messaging, customers get the same certified-rep experience no matter how they choose to reach out.","This directly protects the consistent customer experience CK wants as it expands beyond voice-only support, since routing logic doesn't have to be rebuilt separately for each new channel added.","Why the Other Options Are Incorrect","Option B is incorrect: Capacity-Based Routing balances workload across reps, but it doesn't ensure the interaction goes to a rep certified on the right product line.","Option C is incorrect: Queue-Based Routing sends work to whichever available rep is monitoring a queue, without guaranteeing the rep has the right product certification.","Reference:","Advanced Routing with Omni-Channel Flows – Salesforce Help"]},{"id":"E1-40","exam":1,"n":40,"q":"Universal Containers (UC) has Service Cloud Voice, UC occasionally experiences surges in call volume. Leadership would like to see the impact of surges on internal metrics. Which key performance indicator (KPI) should the consultant report on to meet the requirement?","o":["First call resolution and cases per hour","After call work time and customer effort score","Abandon rate and average speed to answer"],"a":2,"x":["Core ask of the scenario:","Call volume sometimes spikes in Service Cloud Voice.","Leadership wants to see how these spikes affect the team.","Example: like checking how many people hang up and how long they wait during a rush hour at a store.","So the question is: which KPIs show the impact of surges?","Correct Answer: Abandon rate and average speed to answer","Why This Is Correct","Abandon rate rises sharply during a volume surge because more callers give up waiting than usual, making it a direct, immediate signal of how badly the surge is affecting customers.","Average speed to answer also climbs quickly whenever incoming volume outpaces available reps, so tracking it shows leadership exactly how much longer customers are waiting during and after a surge.","Both metrics are measured in real time and are specific to queue and staffing pressure, which makes them far more directly tied to the impact of a call-volume surge than after-the-fact productivity or satisfaction metrics.","Why the Other Options Are Incorrect","Option A is incorrect: First call resolution and cases-per-hour measure agent effectiveness and throughput, not the immediate impact of a volume surge on callers waiting to be answered.","Option B is incorrect: After-call work time and customer effort score measure post-call efficiency and customer experience, not the direct impact of a volume surge on wait times.","Reference:","Key Voice Performance Metrics – Salesforce Help"]},{"id":"E1-41","exam":1,"n":41,"q":"Universal Containers (UC) is considering replacing its traditional chatbot with Agentforce Service Agent to enhance customer engagement. Its current bot frequently struggles with understanding follow-up questions and maintaining context across a multi-turn conversation, leading to frustrated customers. What core capability of Agentforce Service Agent directly addresses UC's challenge?","o":["Trained natural language models (NLMs) to interpret the most recent user input.","A rigid, declarative dialog system that requires predefined conversation flows for every interaction.","Generative AI to understand human language and maintain context across entire conversations."],"a":2,"x":["Core ask of the scenario:","The old chatbot loses track of the conversation and cannot handle follow-up questions.","The company is considering Agentforce Service Agent to fix this.","Example: like a bot that forgets what you said a moment ago versus one that remembers the whole chat.","So the question is: which capability helps the AI keep context across a conversation?","Correct Answer: Generative AI to understand human language and maintain context across entire conversations.","Why This Is Correct","Generative AI gives Agentforce Service Agent the ability to understand natural language in context, rather than parsing each message in isolation, which is exactly what's needed to handle follow-up questions correctly.","It can maintain context across an entire multi-turn conversation, remembering what was discussed earlier, so the agent doesn't lose track of the customer's original issue as the conversation continues.","This directly solves UC's stated problem: its current bot frustrates customers because it can't follow a conversation naturally, and generative AI's contextual understanding is the core capability that fixes that gap.","Why the Other Options Are Incorrect","Option A is incorrect: Focusing only on \"the most recent user input\" is exactly the limited, context-losing behavior UC's current bot has and wants to move away from.","Option B is incorrect: A rigid, declarative dialog system requiring predefined flows for every interaction describes the old-style chatbot limitation, not the capability that solves it.","Reference:","Get to Know Agentforce Service Agent – Salesforce Help"]},{"id":"E1-42","exam":1,"n":42,"q":"The call center manager at Universal Containers wants to generate daily reports to monitor service rep productivity trends. Which primary object should a consultant select to create a new Omni-Channel report type?","o":["Agent Detail","Agent Work","Assigned Work"],"a":1,"x":["Core ask of the scenario:","A call center manager wants daily reports on how productive reps are.","Omni-Channel reports need a main object that records each piece of routed work.","Example: like a timesheet where every task a rep completes is one row.","So the question is: which object should be the primary object for the report type?","Correct Answer: Agent Work","Why This Is Correct","Agent Work is the object that records every individual unit of work routed to a rep through Omni-Channel, making it the natural foundation for a report type built around rep productivity.","Because each Agent Work record captures details like accept time, decline time, and completion, a report type built on this object can surface daily trends in how much work each rep is handling and how quickly.","Using the correct primary object here also ensures the report can be extended later with related objects (like the case or messaging session it's tied to) without needing to rebuild the report type from scratch.","Why the Other Options Are Incorrect","Option A is incorrect: \"Agent Detail\" is not the standard Omni-Channel object used as the primary object for productivity reporting.","Option C is incorrect: \"Assigned Work\" describes work items generally, but the specific object used for Omni-Channel productivity report types is Agent Work.","Reference:","Create Reports for Agent Work with Pre-Configured Report Types – Salesforce Help"]},{"id":"E1-43","exam":1,"n":43,"q":"). Additional requirements are listed below: Support attachments up to 25 MB per inquiry. Under 2,500 inquiries per day. Which configuration solution should a consultant recommend to meet these requirements?","o":["Einstein Activity Capture","On-Demand Email-to-Case","Custom email service"],"a":1,"x":["Core ask of the scenario:","The company wants to create cases from customer emails automatically.","Emails may carry attachments up to 25 MB and there are fewer than 2,500 inquiries per day.","Example: like a shared support inbox that turns every email into a ticket.","So the question is: which email-to-case option fits these limits?","Correct Answer: On-Demand Email-to-Case","Why This Is Correct","On-Demand Email-to-Case is a cloud-based configuration that requires no on-premises email agent, and it's built to reliably handle free-form inbound email from any provider like Outlook, Gmail, or Yahoo.","It supports attachments up to 25 MB per inquiry, which exactly matches the stated requirement, so customers can send supporting files without hitting a size limit that would cause the request to fail.","It also comfortably handles volumes in the low thousands per day, covering the under-2,500-inquiries requirement, without the added complexity of routing infrastructure that a custom email service would need.","Why the Other Options Are Incorrect","Option A is incorrect: Einstein Activity Capture is a Sales Cloud email/calendar sync feature, not a way to create Cases from inbound support emails.","Option C is incorrect: A custom email service would require significant custom development to replicate functionality On-Demand Email-to-Case already provides natively.","Reference:","Set Up Email-to-Case – Salesforce Help"]},{"id":"E1-44","exam":1,"n":44,"q":"A consultant is advising Cloud Kicks on developing call center metrics to measure service rep productivity based on a combination of quality and practical metrics. Which key performance indicator (KPI) usually points to high customer satisfaction?","o":["Knowledge article creation rate","First Contact Resolution","Self help case deflection"],"a":1,"x":["Core ask of the scenario:","The company wants to measure rep productivity using quality and practical metrics.","One metric usually signals happy customers.","Example: if a customer's problem is fixed on the first contact, they do not have to call back.","So the question is: which KPI usually points to high customer satisfaction?","Correct Answer: First Contact Resolution","Why This Is Correct","First Contact Resolution measures how often a customer's issue is fully resolved during their very first interaction, without needing to follow up again or repeat their problem to someone else.","Because customers strongly dislike having to re-explain their issue or wait for a callback, resolving things on the first contact is one of the clearest drivers of a positive service experience.","It's also a practical, quality-oriented metric that balances speed with correctness, since a case only counts as first-contact-resolved if the fix actually holds, not just if it was closed quickly.","Why the Other Options Are Incorrect","Option A is incorrect: How many articles reps create says nothing about whether customers are satisfied with their support experience.","Option C is incorrect: Self-help deflection measures how many customers avoid contacting support entirely; it's a volume/efficiency metric, not a direct customer satisfaction indicator for interactions that do occur.","Reference:","Track Service Metrics – Salesforce Help"]},{"id":"E1-45","exam":1,"n":45,"q":"Cloud Kicks is thinking about implementing Swarming in Slack to allow multiple experts to collaborate on cases. What should they consider before implementation?","o":["Swarming can only be initiated from Slack.","Messages from a swarm can be shared to the case feed.","Swarms can be closed from Slack or Salesforce."],"a":2,"x":["Core ask of the scenario:","Swarming in Slack lets many experts help on a case together.","Before turning it on, the company should know how it behaves.","Example: like starting a group chat to solve a customer problem, then closing the chat when done.","So the question is: what should be considered about how Swarming works?","Correct Answer: Swarms can be closed from Slack or Salesforce.","Why This Is Correct","Before rolling out Swarming, Cloud Kicks should understand that a swarm can be closed from either Slack or Salesforce, giving both the collaborating experts and the case owner flexibility in how they wrap things up.","This dual-platform closure matters operationally: experts working primarily in Slack can resolve and close the swarm without switching tools, while the case owner can also close it from Salesforce if that's their normal workspace.","Planning around this behavior up front helps CK set clear expectations with teams about who is responsible for closing a swarm and from where, avoiding confusion once the feature is live.","Why the Other Options Are Incorrect","Option A is incorrect: Swarming can actually be initiated from Salesforce as well as Slack, not only from Slack.","Option B is incorrect: Messages posted in a swarm channel aren't automatically shared to the case feed by default.","Reference:","Close a Swarm in Slack – Salesforce Help"]},{"id":"E1-46","exam":1,"n":46,"q":"Cloud Kicks would like to add a WhatsApp channel to its available support channels. What should the Service Cloud Consultant consider?","o":["Group WhatsApp chats are not supported.","Emojis, polls, and quick text are not supported.","Queue-based routing is not supported."],"a":0,"x":["Core ask of the scenario:","The company wants to add WhatsApp as a support channel.","Some WhatsApp features are not supported in Salesforce.","Example: like checking what a new phone app can and cannot do before you rely on it.","So the question is: what limitation should the consultant keep in mind?","Correct Answer: Group WhatsApp chats are not supported.","Why This Is Correct","A key consideration before adding WhatsApp as a channel is that group WhatsApp chats are not supported by Salesforce Messaging for WhatsApp, which is built only for one-to-one conversations.","This means CK needs to plan its support model around individual customer conversations rather than assuming it can bring multiple participants into a single WhatsApp thread with a rep.","Understanding this limitation ahead of time avoids surprises during rollout, since any use case that assumed group messaging (like a shared family or business account conversation) would need a different approach.","Why the Other Options Are Incorrect","Option B is incorrect: Emojis and quick text are generally supported in WhatsApp messaging conversations.","Option C is incorrect: Queue-based routing works with WhatsApp messaging the same way it does with other messaging channels.","Reference:","Considerations for WhatsApp in Service Cloud – Salesforce Help"]},{"id":"E1-47","exam":1,"n":47,"q":"Cloud Kicks wants to offer its customers a more personalized, flexible service experience beyond emails, phone calls, and chatbots. What should the consultant recommend to meet this requirement?","o":["Salesforce Knowledge","Social media","Messaging apps"],"a":2,"x":["Core ask of the scenario:","Customers want more personal and flexible service than email, phone or chatbots.","They would like to chat when it suits them, the way they chat with friends.","Example: like sending a quick text to a company instead of waiting on hold.","So the question is: which channel should be recommended?","Correct Answer: Messaging apps","Why This Is Correct","Messaging apps like SMS, WhatsApp, and Facebook Messenger let customers reach support asynchronously, on their own schedule, which is more flexible than a live phone call or a scripted chatbot session.","They also allow for a more personalized, conversational tone, since messages are typically threaded and can include rich content like images, closer to how customers already talk to friends and family.","Because customers can pause and resume the conversation whenever convenient, messaging apps give CK a genuinely more flexible service experience than the channels it already offers.","Why the Other Options Are Incorrect","Option A is incorrect: Salesforce Knowledge is a self-service content repository, not a new customer-facing interaction channel.","Option B is incorrect: Social media is already implied as covered by existing digital channels in this scenario and is less personalized/direct than a messaging app conversation.","Reference:","Considerations for WhatsApp in Service Cloud – Salesforce Help"]},{"id":"E1-48","exam":1,"n":48,"q":"The VP of service at Universal Containers wants to make it easier and faster for support reps to send Knowledge articles to the customer. What should a consultant configure to send the article to the customer?","o":["Create a Macro to send an email with Knowledge articles.","Create an auto-response rule that links to Knowledge articles.","Set up the Case Deflection component to share Knowledge articles."],"a":0,"x":["Core ask of the scenario:","The VP wants reps to send Knowledge articles to customers quickly.","Doing it by hand takes too long.","Example: like a saved email draft that you can send with one click.","So the question is: which feature lets reps send an article to a customer in one step?","Correct Answer: Create a Macro to send an email with Knowledge articles.","Why This Is Correct","Creating a Macro that sends an email containing the relevant Knowledge article lets a rep trigger the entire action, finding and formatting the article included, with a single click.","Because macros are reusable, once built they can be shared across the whole team, so every rep benefits from the time savings instead of each person having to manually assemble the same kind of response.","This directly meets the VP's request to make sending articles \"easier and faster,\" since it replaces multiple manual steps (find article, copy link, compose email) with one repeatable action.","Why the Other Options Are Incorrect","Option B is incorrect: An auto-response rule fires automatically on case creation; it isn't something a rep manually triggers when they want to send a specific article to a customer.","Option C is incorrect: The Case Deflection component is meant for self-service before a case is created, not for a rep actively sending an article during a conversation.","Reference:","Automatically Attach a Salesforce Knowledge Article via Macro – Salesforce Help"]},{"id":"E1-49","exam":1,"n":49,"q":"Cloud Kicks (CK) supports customers through Salesforce Messaging. Service reps have reported multiple instances where customers have used abusive language because they are upset with the company. However, CK still needs to service these customers. Which solution should the Service Cloud Consultant recommend?","o":["Create a Service Agent for intake and use the Raise Supervisor Flag action.","Use Slack Case collaboration to get the customer solution quickly.","Create a Service Agent for intake and use the Escalate to Supervisor action."],"a":0,"x":["Core ask of the scenario:","Some customers become abusive in messaging, but the company still needs to help them.","The solution should alert supervisors or support the rep without ending the service.","Example: like a staff member quietly pressing a help button when a customer gets rude.","So the question is: which setup handles abuse and still serves the customer?","Correct Answer: Create a Service Agent for intake and use the Raise Supervisor Flag action.","Why This Is Correct","Creating a Service Agent for intake with the Raise Supervisor Flag action lets the AI agent flag the conversation for a human supervisor's awareness the moment abusive language is detected.","Because the flag alerts a supervisor without automatically cutting off the conversation, the customer can continue to be serviced, matching CK's requirement to keep helping these customers rather than refusing service.","This also creates a record and visibility trail for supervisors, so patterns of abusive behavior can be monitored and addressed through proper channels rather than left unnoticed.","Why the Other Options Are Incorrect","Option B is incorrect: Slack Case collaboration is meant for internal expert collaboration on a case, not for handling abusive customer behavior in real time.","Option C is incorrect: Escalate to Supervisor is meant to hand off the conversation entirely, which isn't necessary here since CK still wants to service these customers, just with supervisor awareness of the behavior.","Reference:","Flag Supervisors to Help with Agentforce Service Agent – Salesforce Help"]},{"id":"E1-50","exam":1,"n":50,"q":"Cloud Kicks has hired a Service Cloud Consultant to build out its reports. The consultant is having trouble locating the \"Accounts with Entitlements with Contacts\" and \"Service Contracts with Contract Line Items\" custom report types. What should the consultant do to troubleshoot?","o":["Verify that Salesforce Knowledge is enabled.","Verify that entitlement management is enabled.","Verify that Historical Trend Reporting is enabled."],"a":1,"x":["Core ask of the scenario:","The consultant cannot find two custom report types for entitlements and service contracts.","Some features must be turned on before these report types appear.","Example: like a menu option that only shows after you switch a feature on in Settings.","So the question is: what should the consultant check to troubleshoot?","Correct Answer: Verify that entitlement management is enabled.","Why This Is Correct","Those two report types, \"Accounts with Entitlements with Contacts\" and \"Service Contracts with Contract Line Items,\" are built around the Entitlement and Contract Line Item objects, which only exist as reportable objects once Entitlement Management is enabled.","If entitlement management hasn't been turned on in Setup, those underlying objects and their standard report types simply won't be available for the consultant to select from.","Checking this setting first is the fastest way to troubleshoot the missing report types, since enabling entitlement management will make both standard report types appear without any additional configuration.","Why the Other Options Are Incorrect","Option A is incorrect: Salesforce Knowledge being enabled has no bearing on entitlement-related report types.","Option C is incorrect: Historical Trend Reporting is unrelated to whether entitlement-based report types are available.","Reference:","What's Entitlement Management? – Salesforce Help"]},{"id":"E1-51","exam":1,"n":51,"q":"Cloud Kicks wants to ensure security for its contact center customers when they use the Agentforce Service Agent to access and modify their cases. What should a Service Cloud Consultant recommend to implement this security option on the AI agent?","o":["Implementing the Case Management topic with a custom action to verify customers.","Implementing the Case Management topic with exact Instructions and Custom Actions.","Implementing the Service Customer Verification topic with a filter on the Case Management topic."],"a":2,"x":["Core ask of the scenario:","Customers will use an AI agent to view and change their cases.","The company wants to make sure only the right person can access their data.","Example: like a bank asking you to verify your identity before sharing account details.","So the question is: how should the AI agent be set up for secure customer access?","Correct Answer: Implementing the Service Customer Verification topic with a filter on the Case Management topic.","Why This Is Correct","Implementing the Service Customer Verification topic gives the AI agent a dedicated, purpose-built step to confirm the customer's identity before allowing anything sensitive to happen.","Adding a filter on the Case Management topic ensures that verification must succeed first before the agent will let the customer view or modify case details, closing off the sensitive actions until identity is confirmed.","Because this pattern is the standard, supported Agentforce Service Agent approach, it's more reliable and easier to maintain than trying to bolt custom identity checks onto the Case Management topic directly.","Why the Other Options Are Incorrect","Option A is incorrect: Adding a custom verification action to the Case Management topic is a manual workaround instead of using the standard, purpose-built verification topic.","Option B is incorrect: Tightening instructions and custom actions within Case Management alone doesn't provide the same dedicated identity- verification gate as the Service Customer Verification topic.","Reference:","Verify Customers with Standard Subagents – Salesforce Help"]},{"id":"E1-52","exam":1,"n":52,"q":"Cloud Kicks provides support to customers across the world and uses Lightning Experience. Service reps have a set of common responses. Managers would like to consolidate the responses as quick text, translate them to multiple languages, and share them with the correct groups of service reps. What should a consultant recommend to meet the requirements?","o":["Share a folder with quick text for each translation.","Share each quick text individually to Public Groups.","Use custom labels to manage quick text translations."],"a":0,"x":["Core ask of the scenario:","Reps use common replies, and managers want them as quick text in several languages.","The managers also want to share them with the right groups of reps.","Example: like sharing translated reply templates with each regional team.","So the question is: what is the best way to manage and share translated quick text?","The correct answer is to Share a folder with quick text for each translation.","Why this is the correct choice:","Efficient Folder Sharing: Salesforce allows administrators and managers to group Quick Text records into distinct folders, which can then be shared with specific users, roles, or public groups.","Scalability for Managers: Instead of managing access on a record-by-record basis, managers can simply place a newly translated Quick Text into the appropriate folder, and the correct group of reps will instantly gain access to it.","Targeted Visibility: By organizing translated quick text into respective language or regional folders, agents are only exposed to the responses they actually need. This approach prevents their Quick Text picker from being cluttered with languages they do not speak.","Why the other options are incorrect:","Share each quick text individually to Public Groups: While technically possible, this approach is highly inefficient and creates a massive administrative burden. Every time a single quick text is created or updated, a manager would have to manually adjust its sharing settings. This does not scale well for a global support team with hundreds of common responses.","Use custom labels to manage quick text translations: Custom labels are a metadata feature designed primarily for developers to translate user interface elements (like button names or error messages) within custom code (Apex, Lightning Web Components, etc.). They are not intended for—nor are they accessible to—managers wanting to draft, store, and share long-form customer service responses."]},{"id":"E1-53","exam":1,"n":53,"q":"Using the Lightning Service Console, how can a contact center manager see which service reps are currently available to accept new cases?","o":["Omni-Channel Utility component","Omni-Channel Analytics","Omni-Channel Supervisor tab"],"a":2,"x":["Core ask of the scenario:","A manager in the Service Console wants to know which reps are free to take new cases.","This needs a live team view, not a personal tool.","Example: like a manager checking the staff board to see who is available.","So the question is: where does the manager see rep availability?","Correct Answer: Omni-Channel Supervisor tab","Why This Is Correct","The Omni-Channel Supervisor tab gives a manager a real-time, team-wide view of every rep's current presence status, including who is actively available to take on new work right now.","Because it's designed for management oversight rather than individual rep use, it consolidates availability across the whole team in one screen instead of requiring the manager to check each rep individually.","From this same view, managers can often take direct action, like reassigning work or checking capacity, making it the practical, real-time tool for exactly this kind of monitoring.","Why the Other Options Are Incorrect","Option A is incorrect: The Omni-Channel Utility component is what an individual rep uses to manage their own status and work, not a manager-facing view of the whole team.","Option B is incorrect: \"Omni-Channel Analytics\" is not the real-time, per-rep availability view a manager needs; that's provided by the Supervisor tab.","Reference:","Get to Know the Omni Supervisor Tabs – Salesforce Help"]},{"id":"E1-54","exam":1,"n":54,"q":"Universal Containers (UC) is implementing an Agentforce Service Agent for its customer portal. UC needs the AI agent to answer complex customer questions by drawing information from their existing Salesforce Knowledge base, which contains articles with specific, well-defined fields for product dimensions and material specifications. Which feature is needed to connect the AI agent to the Salesforce Knowledge base?","o":["Agentforce Data Library","Einstein Search for Knowledge","Knowledge component in Experience Builder"],"a":0,"x":["Core ask of the scenario:","An AI agent in a customer portal must answer complex questions using the company's Knowledge articles.","Those articles have specific fields such as product size and materials.","Example: like connecting a chatbot to a well-organized product manual.","So the question is: which feature connects the AI agent to Knowledge?","Correct Answer: Agentforce Data Library","Why This Is Correct","Agentforce Data Library is the feature built to connect an Agentforce agent directly to Salesforce Knowledge content, including articles that have specific, well-defined structured fields like product dimensions.","By grounding the agent in this structured Knowledge content, the agent can pull precise, specific details (like exact material specifications) rather than generating vague or approximate answers.","This connection is maintained natively, so as UC's Knowledge base grows or articles are updated, the AI agent's answers stay grounded in the current, correct version of that content automatically.","Why the Other Options Are Incorrect","Option B is incorrect: \"Einstein Search for Knowledge\" is not the mechanism used to connect an Agentforce agent to a Knowledge base for grounding.","Option C is incorrect: The Knowledge component in Experience Builder displays articles to human users browsing a site; it doesn't connect an AI agent's reasoning to the Knowledge base.","Reference:","Agentforce Data Library – Salesforce Help"]},{"id":"E1-55","exam":1,"n":55,"q":"Universal Containers is considering a Knowledge-Centered Support (KCS) implementation. Which benefit can be expected from KCS adoption?","o":["Reduced administrative overhead","Reduced need for self-service","Reduced issue resolution time"],"a":2,"x":["Core ask of the scenario:","The company is thinking about adopting Knowledge-Centered Support (KCS).","KCS is a method where reps create and improve articles while solving cases.","Example: like writing down a recipe the first time you cook it so the next cook is faster.","So the question is: what benefit can the company expect?","Correct Answer: Reduced issue resolution time","Why This Is Correct","Knowledge-Centered Support builds a continuous cycle where reps capture and refine solutions as they work cases, so accurate answers become available faster the next time a similar issue comes up.","Because reps can search and reuse existing, vetted solutions instead of solving each issue from scratch, cases get resolved more quickly on average across the whole team.","This directly leads to reduced issue resolution time, which is the headline benefit organizations typically see once a KCS program matures and article coverage grows.","Why the Other Options Are Incorrect","Option A is incorrect: KCS actually increases some administrative involvement in article creation and maintenance as part of the workflow, rather than reducing overhead.","Option B is incorrect: KCS is meant to grow self-service capability, not reduce the need for it.","Reference:","Create a Knowledge Base with Salesforce Knowledge – Salesforce Help"]},{"id":"E1-56","exam":1,"n":56,"q":"Cloud Kicks has implemented a review process for all new Knowledge articles. Each article must be reviewed and approved by a subject matter expert before becoming available to users. Which step is necessary to make articles visible in all the selected channels?","o":["Click Publish after the Approval Process.","Set the status to Published from the Knowledge approval page.","Set the final approval action to 'Lock the record for editing'."],"a":0,"x":["Core ask of the scenario:","Every new Knowledge article must be reviewed and approved by an expert first.","After approval, the article must become visible to customers or reps.","Example: like a news story that is edited and approved, then actually published.","So the question is: which step is needed to make articles visible?","Correct Answer: Click Publish after the Approval Process.","Why This Is Correct","After an article passes through its Approval Process, the reviewer still needs to explicitly click Publish, since approval and publishing are two separate steps in the Knowledge workflow.","Publishing is what actually makes the article live and visible in every channel it's configured for, whether that's the internal console, a customer portal, or a public help site.","Skipping this step means an article can sit in an \"approved but not published\" state indefinitely, invisible to end users even though the review process has already finished.","Why the Other Options Are Incorrect","Option B is incorrect: There's no separate \"Set the status to Published from the Knowledge approval page\" step distinct from the Publish action itself; Publish is the actual action that makes the article live.","Option C is incorrect: \"Lock the record for editing\" prevents further edits, but it doesn't make the article visible to users across channels; Publish does that.","Reference:","Publish Articles and Translations – Salesforce Help"]},{"id":"E1-57","exam":1,"n":57,"q":"The service center managers and IT team at Cloud Kicks have asked the consultant for a cost benefit analysis after a new Service Cloud implementation. What measurement will reflect cost savings after the implementation?","o":["KPIs for CSAT.","Reduced license count.","Reduced service rep backlog."],"a":2,"x":["Core ask of the scenario:","Managers want a cost-benefit view after the new Service Cloud launch.","They need a measure that reflects real cost savings.","Example: like checking whether a faster process means fewer open tickets and less overtime.","So the question is: which measurement shows cost savings?","Correct Answer: Reduced service rep backlog.","Why This Is Correct","A reduced service rep backlog shows that cases are moving through the system faster with the same or fewer resources, which is a direct, measurable efficiency gain from the new implementation.","Because a smaller backlog often means less need for overtime, temporary staffing, or overflow outsourcing to keep up with demand, it translates fairly directly into real, quantifiable cost savings.","It's also something the IT team and service center managers can track consistently over time using data already inside Salesforce, making it a practical metric for an ongoing cost-benefit analysis.","Why the Other Options Are Incorrect","Option A is incorrect: CSAT reflects customer happiness, not a direct measurement of cost savings.","Option B is incorrect: A Service Cloud implementation typically doesn't reduce license count; if anything it may require more licenses as adoption grows.","Reference:","Track Service Metrics – Salesforce Help"]},{"id":"E1-58","exam":1,"n":58,"q":"Universal Containers is implementing Service Cloud to make the workflow more efficient and improve customer support. When setting up Service Cloud, how can a consultant ensure that service reps have access to the right customer information when viewing a case?","o":["Use a formula to pull fields from a contact record to the case.","Use a flow to copy a value from a contact record to the case.","Expose cross object fields on the case record Lightning page."],"a":2,"x":["Core ask of the scenario:","Reps need to see the right customer information while looking at a case.","The data already exists on related records, such as the contact.","Example: like seeing a customer's name and phone on their order without retyping them.","So the question is: how can the case page show related customer information?","Correct Answer: Expose cross object fields on the case record Lightning page.","Why This Is Correct","Exposing cross-object fields directly on the case record Lightning page lets reps see relevant contact or account details right alongside the case, without creating any duplicate copy of that data.","Because the fields are pulled live from the related record, reps are always looking at current information, with no risk of the case showing an outdated snapshot that fell out of sync with the source record.","This is also the lowest-maintenance option of the three, since there's no formula, flow, or automation to build and keep working; it's a declarative page-layout configuration.","Why the Other Options Are Incorrect","Option A is incorrect: Using a formula field to copy contact data onto the case creates unnecessary duplicate data that has to be kept in sync.","Option B is incorrect: Using a flow to copy the value also creates duplicate data on the case record instead of simply displaying the related information.","Reference:","Related Record Component Considerations – Salesforce Help"]},{"id":"E1-59","exam":1,"n":59,"q":"Cloud Kicks (CK) wants to increase the number of articles in its knowledge base while maintaining article quality. CK plans to allow all service reps to create articles. What should the consultant recommend to create a vetting workflow to reduce the number of low-quality articles?","o":["Flow with notifications","Reports and dashboards","Approval process"],"a":2,"x":["Core ask of the scenario:","The company wants more articles from all reps without lowering the quality.","So it needs a review step before articles go live.","Example: like an editor approving a news article before publishing.","So the question is: which feature creates that vetting workflow?","Correct Answer: Approval process","Why This Is Correct","An approval process inserts a required review step before a newly submitted article can go live, giving a subject matter expert the chance to catch quality issues before the wider team ever sees the article.","Because the process is enforced by the system rather than relying on reps to remember to ask for a review, it consistently filters out low-quality submissions even as article volume grows with more reps contributing.","This gives CK a scalable way to open up article creation to the whole team while still protecting overall knowledge base quality, which is exactly the balance the requirement calls for.","Why the Other Options Are Incorrect","Option A is incorrect: A flow with notifications can alert someone that an article was created, but it doesn't provide a structured, enforceable review/approval gate.","Option B is incorrect: Reports and dashboards can show article activity after the fact, but they don't prevent low-quality articles from being published in the first place.","Reference:","Workflow and Approvals for Articles – Salesforce Help"]},{"id":"E1-60","exam":1,"n":60,"q":"A Service Cloud Consultant has deployed a new Agentforce Service Agent. The AI agent is not receiving messages. Which steps did the consultant most likely miss in the configuration process?","o":["Editing the Omni-Channel Flow to route the conversation to the new AI agent.","Configuring the standard Escalation Topic and actions in Agent Builder.","Assigning the new AI agent in Embedded Messaging chat component in Experience Cloud site."],"a":2,"x":["Core ask of the scenario:","A new AI agent is deployed but is receiving no messages.","Something was missed that connects the agent to the channel customers use.","Example: like opening a new phone line but forgetting to plug it in.","So the question is: which configuration step was most likely missed?","Correct Answer: Assigning the new AI agent in Embedded Messaging chat component in Experience Cloud site.","Why This Is Correct","If the new AI agent was never assigned in the Embedded Messaging chat component on the Experience Cloud site, that messaging channel simply has no agent configured to receive any incoming conversations.","Without this binding, customer messages sent through the embedded chat widget have nowhere to route to, so the new AI agent never sees them even if everything else about the agent is correctly built and deployed.","This is a common and easy-to-miss deployment step, since it happens on the Experience Cloud/embedded messaging side rather than within Agent Builder itself, where the rest of the agent configuration takes place.","Why the Other Options Are Incorrect","Option A is incorrect: Editing the Omni-Channel Flow controls routing to human reps or existing queues; it isn't the step that connects a new AI agent to an embedded messaging channel.","Option B is incorrect: The standard Escalation Topic controls handoff behavior once a conversation is already happening with the agent; it isn't why the agent would receive no messages at all.","Reference:","Connect a Service Agent to Other Messaging Channels – Salesforce Help"]},{"id":"E1-61","exam":1,"n":61,"q":"A Service Cloud consultant has recently implemented a public Knowledge base. Which metric should the consultant use to measure the success of the implementation?","o":["Monthly case volume","First call resolution","Average case resolution time"],"a":0,"x":["Core ask of the scenario:","The company has launched a public Knowledge base for customers.","It needs to prove it is working.","Example: if customers find answers themselves, fewer of them need to open cases.","So the question is: which metric shows the success of the Knowledge base?","Correct Answer: Monthly case volume","Why This Is Correct","Monthly case volume going down over time is the clearest, most direct evidence that customers are successfully self-serving answers instead of opening a case, which is the entire point of a public Knowledge base.","Because a public Knowledge base is meant to intercept questions before they ever become a case, its success is best measured by how much it reduces the number of cases created in the first place.","Tracking this metric monthly also lets the consultant correlate it with article publishing activity, showing leadership a clear before-and-after picture of the knowledge base's impact.","Why the Other Options Are Incorrect","Option B is incorrect: First call resolution measures how well live interactions are resolved, not whether customers are avoiding creating cases through self-service.","Option C is incorrect: Average case resolution time measures efficiency of cases that are still created, not the deflection effect of the knowledge base itself.","Reference:","Site Case Deflection from Discussions and Articles – Salesforce Help"]},{"id":"E1-62","exam":1,"n":62,"q":"Cloud Kicks (CK) has created hundreds of Knowledge articles about its products. The articles have been attached to closed cases. A new product release will require changes to dozens of articles. After revising the articles, CK wants to ensure that a prior article version stays associated with the closed cases. What is the recommended method to meet the requirements?","o":["Use Smart Link to Article to select the prior version.","Add \"updated\" to the name of the new article.","Select the \"Flag as new version\" checkbox when publishing."],"a":2,"x":["Core ask of the scenario:","Hundreds of articles are linked to closed cases, and dozens must be updated for a new product.","Closed cases should still point to the older version.","Example: like keeping the old edition of a book on the shelf when a new edition arrives.","So the question is: how do you keep the prior version linked?","Correct Answer: Select the \"Flag as new version\" checkbox when publishing.","Why This Is Correct","Selecting \"Flag as new version\" when publishing an update creates a distinct new version of the article that becomes the current one going forward, while the previous version remains preserved as its own record.","Because closed cases already reference the specific version of the article that was attached at the time, that link stays intact and unaffected by the new version being published separately.","This lets CK safely revise dozens of articles for the new product release without disturbing the historical accuracy of records tied to closed cases, satisfying both the update and the preservation requirement.","Why the Other Options Are Incorrect","Option A is incorrect: \"Smart Link to Article\" is meant to always point readers to the current published version, which is the opposite of preserving a specific prior version on closed cases.","Option B is incorrect: Renaming the article with \"updated\" doesn't create or preserve distinct versions; it's just a cosmetic label change.","Reference:","Salesforce Knowledge Article Versions – Salesforce Help"]},{"id":"E1-63","exam":1,"n":63,"q":"Ursa Major Solar provides support with service-level agreements (SLAs) for high-priority cases. Lower-priority cases have different response times. The service center uses Omni-Channel to manage work items. However, many recently created, high-priority cases exceed the service deadline. Which setting should a consultant configure to meet the requirements?","o":["Skills-Based Routing","Secondary Routing Priority","Capacity Model"],"a":1,"x":["Core ask of the scenario:","Some high-priority cases are missing their service deadlines in Omni-Channel.","The company needs high-priority work to be picked first even when queues are mixed.","Example: like an emergency room seeing urgent patients before routine ones.","So the question is: which setting makes Omni-Channel handle urgent cases first?","Correct Answer: Secondary Routing Priority","Why This Is Correct","Configuring Secondary Routing Priority lets the routing configuration automatically increase the priority of a work item as it ages and gets closer to breaching its SLA deadline.","This means high-priority cases that have been sitting in the queue too long get pushed ahead of newer items automatically, so they're picked up before the deadline rather than after it's already been missed.","Because this happens without manual intervention, it directly addresses the pattern described, where recently created high-priority cases are exceeding the deadline simply due to queue timing rather than a lack of skilled reps.","Why the Other Options Are Incorrect","Option A is incorrect: Skills-Based Routing ensures the right rep handles the work, but it doesn't specifically prevent SLA breaches on aging high-priority items.","Option C is incorrect: A Capacity Model controls how much work a rep can take on, not how urgently near-deadline items get prioritized for pickup.","Reference:","Set Up Secondary Routing Priority – Salesforce Help"]},{"id":"E1-64","exam":1,"n":64,"q":"Cloud Kicks (CK) wants to adopt artificial intelligence (AI) for improving case closure key performance indicators (KPIs) and product support planning within its Service organization. CK has at least 1,000 closed cases from which it can predict accurate values for fields that are empty. CK has yet to implement any Einstein AI products. Which approach should the consultant recommend to start AI efforts at CK?","o":["Confirm there are enough closed cases and turn on Einstein Service AI Grounding with Cases.","Review and address Case data issues and set up Einstein Classification Apps.","Review and address Case data issues and set up Einstein Article Recommendations."],"a":1,"x":["Core ask of the scenario:","The company wants to start using AI to improve case closure and plan product support.","It has about 1,000 closed cases and no Einstein AI products yet.","Example: like using past homework answers to predict missing ones.","So the question is: what is the best first step to start with AI?","Correct Answer: Review and address Case data issues and set up Einstein Classification Apps.","Why This Is Correct","The consultant should first review and address Case data quality issues, since any AI model, including Einstein Classification Apps, will only produce reliable predictions if the historical case data it learns from is clean and consistent.","Once the data is in good shape, setting up Einstein Classification Apps is the right next step because Case Classification is specifically designed to predict values for empty fields based on patterns learned from historical closed cases.","Because CK already has over 1,000 closed cases, meeting the minimum data volume Einstein Classification typically needs, this approach lets CK start its very first AI initiative on a solid, well-suited foundation.","Why the Other Options Are Incorrect","Option A is incorrect: \"Einstein Service AI Grounding with Cases\" isn't the standard starting product for predicting empty field values from historical case data.","Option C is incorrect: Einstein Article Recommendations solves a different problem (surfacing articles), not predicting empty field values for case KPIs and product planning.","Reference:","Autofill Case Fields with Einstein Case Classification Apps – Salesforce Help"]},{"id":"E1-65","exam":1,"n":65,"q":"Universal Container's support department wants to ensure its AI agents' responses consistently reflect the company's brand voice and preferred communication style, while also being explicitly instructed on what types of responses to avoid. This level of control is crucial for maintaining brand consistency in customer interactions. What would be the most appropriate use of AI agents to address this requirement?","o":["Agentforce Service Agent with standard topics and instructions.","Einstein Bot to have a well-defined conversation structure.","Agentforce Service Agent with custom topic instructions."],"a":2,"x":["Core ask of the scenario:","The company wants AI agent responses to follow its brand voice and avoid certain content.","It wants explicit control over tone and style.","Example: like giving a new employee a style guide and a list of things never to say.","So the question is: which AI agent setup lets the company set these rules?","Correct Answer: Agentforce Service Agent with custom topic instructions.","Why This Is Correct","Agentforce Service Agent with custom topic instructions lets Cloud Kicks define, at the topic level, exactly what tone, brand voice, and phrasing style the AI agent should use in its responses.","These custom instructions can also explicitly call out what types of responses to avoid, giving fine-grained, generative control over both what the agent should say and what it should steer clear of.","Because this control is built into the generative model's instructions rather than a rigid script, the agent can apply the brand voice consistently across many different customer questions, not just a handful of predefined scenarios.","Why the Other Options Are Incorrect","Option A is incorrect: Standard topics and instructions provide general guardrails but not the explicit, tailored brand-voice and avoidance rules the requirement calls for.","Option B is incorrect: An Einstein Bot with a rigid, predefined conversation structure doesn't offer the same generative, instructable control over tone and phrasing that custom topic instructions in Agentforce do.","Reference:","Best Practices for Writing Topic Instructions – Salesforce Help"]},{"id":"E2-1","exam":2,"n":1,"q":"A company is planning for the migration of an existing knowledge base into Salesforce Knowledge. Which set of factors should be considered in selecting which articles to migrate to?","o":["Last modified date and terms searched frequently in the last year","Last modified date and total number of article views in the last year.","Original creation date and total number of article views in the last year"],"a":1,"x":["Core ask of the scenario:","A company has old knowledge articles and wants to move only the useful ones into Salesforce Knowledge.","The question asks: which two things should you check to decide which articles are worth moving?","Example: it is like cleaning out old files before moving house — you keep the files you still use often and the ones that are up to date, not just the oldest ones.","The correct answer is Last modified date and total number of article views in the last year.","Why This Is Correct","The last modified date tells the team whether an article reflects current, accurate information. Articles that haven't been touched in a long time are far more likely to be outdated, even if the underlying product or process has since changed.","The total number of views in the last year tells the team whether customers are actually relying on that content. High-traffic articles are worth prioritizing for migration, while rarely viewed ones may not be worth the migration effort.","Together, these two factors let the company focus migration work on content that is both accurate and actively valuable, rather than wasting time recreating stale or unused articles in the new system.","Why the Other Options Are Incorrect","Original creation date and total number of article views in the last year: incorrect because the original creation date says nothing about whether an article is still accurate, since an old article can still be actively maintained.","Last modified date and terms searched frequently in the last year: incorrect because search terms are useful for spotting content gaps, but they don't tell you whether an existing article itself is worth migrating.","Reference:","Lightning Knowledge Migration Tool Features and Considerations – Salesforce Help"]},{"id":"E2-2","exam":2,"n":2,"q":"A manager has noticed an increase in the average case age. This is negatively impacting customer satisfaction. The manager wants to compare the amount of time that cases have spent within each status during their lifecycle. Which report type should the consultant recommend when creating a report?","o":["Use the Case Lifecycle report type.","Use the Case Historical Trending report type.","Use the Case with Milestones report type."],"a":0,"x":["Core ask of the scenario:","A manager notices cases are taking longer to close and wants to find out why.","The question asks: which report shows how long a case stays in each stage, such as \"New,\" \"In Progress,\" or \"Closed\"?","Example: if a case sits in \"Awaiting Customer Response\" for 5 days, this report shows exactly where that delay happened.","The correct answer is Use the Case Lifecycle report type.","Why This Is Correct","The Case Lifecycle report type is built around the Case History object's Range field, which tracks how long a case stayed in each status before it changed. This is exactly the \"time spent in each status\" comparison the manager is asking for.","Every time a case's status or owner changes, the Range counter resets to zero and starts tracking the next stage. Reporting on this field lets the manager see, stage by stage, where cases are accumulating age the fastest, such as sitting too long in \"Awaiting Customer Response\" or \"In Progress.\" Because this is a native, purpose-built report type, the consultant can build the report directly from Setup without any custom object or field history tracking configuration, making it the fastest path to the insight the manager needs.","Why the Other Options Are Incorrect","Use the Case Historical Trending report type: incorrect because Historical Trending shows how field values changed over time across snapshots (for example, how many cases were \"Open\" each day), not how long an individual case dwelled in each status.","Use the Case with Milestones report type: incorrect because Milestones track SLA-style deadlines (like First Response Time), not the general time- in-status breakdown across the full case lifecycle.","Reference:","Report on Case Lifecycle and Status Changes – Salesforce Help"]},{"id":"E2-3","exam":2,"n":3,"q":"Using the Lightning Service Console, how can a contact center manager see which service reps are currently available to accept new cases?","o":["Omni-Channel Utility component","Omni-Channel Analytics","Omni-Channel Supervisor tab."],"a":2,"x":["Core ask of the scenario:","A call center manager wants to know, right now, which agents are free to take a new case.","The question asks: which screen in the Service Console shows live agent availability?","Example: think of a ride-hailing app showing which drivers nearby are \"available\" — this screen does the same thing for support agents.","The correct answer is Omni-Channel Supervisor tab.","Why This Is Correct","The Omni-Channel Supervisor tab gives managers a live, real-time view of every agent's current presence status (Available, Busy, Offline), so they can immediately see who has open capacity to accept new work.","It also shows each agent's current workload, including how many cases, chats, or other work items are assigned to them right now, which helps the manager decide where to route the next incoming case.","Because this view updates in real time as agents change their status or complete work, it is purpose-built for the \"who is available right now\" question the manager is asking, unlike a static report that only shows historical data.","Why the Other Options Are Incorrect","Omni-Channel Utility component: incorrect because this component shows an individual agent their own assigned work items in their own console; it does not give a manager visibility into the availability of the whole team.","Omni-Channel Analytics: incorrect because this is a historical and trend-reporting tool (queue wait times, handle times, etc.), not a real-time view of which specific agents are available right now.","Reference:","Omni-Channel Supervisor – Salesforce Help"]},{"id":"E2-4","exam":2,"n":4,"q":"Service agents have reported that the Lightning Service Console is too crowded which makes it difficult to find the information they need. After reviewing the agents' console use, a consultant has determined that all configured features are required. Given this scenario, which solution should a Consultant suggest to improve the efficiency of console users?","o":["Train on Keyboard shortcuts.","Prepare Macros.","Create multiple Console layouts."],"a":0,"x":["Core ask of the scenario:","Agents say the Service Console screen feels too crowded and hard to work with.","But all the features on the screen are actually needed, so nothing can be removed.","The question asks: how can agents work faster on this same crowded screen without taking anything away?","Example: like a busy kitchen where every tool is needed — the fix is training the cook to move faster, not throwing out tools.","The correct answer is Train agents on keyboard shortcuts.","Why This Is Correct","Keyboard shortcuts let agents jump between fields, save records, and switch tabs without reaching for the mouse, which speeds up work on a screen that is already full of needed features.","Since nothing on the console can be removed (all features are required), the fix has to make using the existing layout faster, not simpler — shortcuts do exactly that.","This is a low-cost, no-configuration-change solution: it is purely about training agents to navigate the current console more efficiently.","Why the Other Options Are Incorrect","Prepare Macros: macros automate repetitive multi-step actions (like sending a template email), but they don't solve the problem of a visually crowded screen being hard to navigate.","Create multiple Console layouts: creating more layouts adds more screens to manage and switch between, which makes things more complicated, not less, especially when every feature is already required.","Reference:","Keyboard Shortcuts for the Lightning Service Console – Salesforce Help"]},{"id":"E2-5","exam":2,"n":5,"q":"Sunrays Limited (SL) customers prefer speaking to a live support agent for complex product issues. This results in a high volume of phone calls and customer dissatisfaction about long hold times. What functionality should the consultant recommend to address the problem?","o":["Web-to-Case","Contact Requests.","Embedded Chat Window."],"a":1,"x":["Core ask of the scenario:","Customers like talking to a real person for tricky issues, so a lot of them call in — and that creates long hold times.","The company still wants to keep that voice conversation, just without the long wait on the phone.","The question asks: what feature lets customers get a call back from an agent instead of waiting on hold?","Example: it's like a restaurant giving you a buzzer instead of making you stand in line — you get called when it's your turn.","The correct answer is Contact Requests.","Why This Is Correct","Contact Requests (specifically \"Contact Request Flows\") let customers ask for a support agent to call them back instead of waiting live on the phone.","Instead of sitting in a live phone queue, the customer submits a request through the website or Experience Cloud site, and an agent calls them when free — this removes the hold-time frustration.","It still respects the customer's preference for a voice conversation, and agents can review the issue details before calling back, making the call more efficient.","Why the Other Options Are Incorrect","Web-to-Case: this deflects phone calls, but it is an email-based, asynchronous channel. Customers who prefer speaking to someone for complex issues don't get that with a text-based case form.","Embedded Chat Window: this is live, but it is text-based. It still doesn't give customers the voice conversation they specifically prefer, especially for complex issues that are easier to explain by talking.","Reference:","Contact Request Flows – Salesforce Help"]},{"id":"E2-6","exam":2,"n":6,"q":"Support Managers have requested the ability to provide real-time feedback to agents during customer chat sessions. What features should a consultant configure to meet this requirement?","o":["Flow Orchestrator","Chatter","Omni-Channel Supervisor."],"a":2,"x":["Core ask of the scenario:","Support managers want to coach agents while a live chat with a customer is still happening, not after it ends.","The question asks: which feature lets a manager watch a chat live and send tips only the agent can see?","Example: it's like a coach whispering instructions to a player through an earpiece during the game, without the audience hearing.","The correct answer is Omni-Channel Supervisor.","Why This Is Correct","Omni-Channel Supervisor lets managers monitor live chat conversations and Service Cloud Voice calls between agents and customers as they happen.","From that same screen, a manager can send a \"whisper message\" that only the agent sees, giving real-time coaching without the customer knowing.","It also shows agent workload and status, so a manager can quickly spot which chat sessions may need guidance.","Why the Other Options Are Incorrect","Flow Orchestrator: this is used to build and sequence multi-step business processes across users and systems; it has no feature for live- monitoring a chat conversation.","Chatter: this is a collaboration feed for posts and comments between colleagues; it doesn't give a manager a live view into an ongoing chat session with a customer.","Reference:","Omni-Channel Supervisor – Salesforce Help"]},{"id":"E2-7","exam":2,"n":7,"q":"The Sunrays Limited (SL) Contact Center has Customer Support Agents who speak Spanish and wants all cases where Spanish is the preferred language to be handled by these agents in real-time. Sunrays Limited (SL) allows customers to contact agents through phone and chat. Which solution should be implemented to support this?","o":["Case Auto-Response Rules.","Omni -Channel.","Case Assignment Rules."],"a":1,"x":["Core ask of the scenario:","The company gets phone calls and chats from Spanish-speaking customers, and wants those to always reach Spanish-speaking agents, in real time.","Both channels (phone and chat) need this same smart routing, not just one of them.","The question asks: what single feature can route live phone calls and chats to the right agent based on language, as they come in?","Example: it's like a call center's switchboard automatically sending Spanish calls to the Spanish-speaking desk, instead of a person manually transferring them.","The correct answer is Omni-Channel.","Why This Is Correct","Omni-Channel routes incoming work (phone, chat, cases, and more) to agents in real time based on configured rules, including agent skills such as language.","By setting up a \"Spanish\" skill and routing configuration, Omni-Channel can automatically send Spanish-preferred phone and chat interactions straight to agents who have that skill.","This works across both channels mentioned in the scenario (phone and chat) because Omni-Channel is channel-agnostic — it is built to unify routing across all these interaction types.","Why the Other Options Are Incorrect","Case Auto-Response Rules: these only send an automatic acknowledgment email after a case is created; they don't route live phone calls or chats to a specific agent.","Case Assignment Rules: these assign Cases (not live phone or chat interactions) to an owner or queue when the case record is created, which doesn't cover the real-time phone and chat routing this scenario needs.","Reference:","Omni-Channel Overview – Salesforce Help"]},{"id":"E2-8","exam":2,"n":8,"q":"SQS Global Services (SGS) customers use a proprietary e-commerce site to order customized shoes. While the shoes are being made, customers want to check their order status frequently. Which method should the consultant recommend to provide automated self-service on an e-commerce site?","o":["Configure a \"Visual Remote Assistant\"","Create an Einstein Bot.","Build a Screen Flow."],"a":1,"x":["Core ask of the scenario:","Customers order custom-made shoes and keep checking \"is my order ready yet?\" over and over.","The company wants this status-checking to happen automatically, without a human agent answering every time.","The question asks: which tool lets customers get instant, automated order-status answers on the e-commerce site?","Example: it's like a food delivery app showing live order status in a chat window, instead of calling the restaurant to ask.","The correct answer is Create an Einstein Bot.","Why This Is Correct","Einstein Bots are built for exactly this kind of high-volume, repetitive question — \"Where is my order?\" — and can be embedded directly into an external e-commerce site.","The bot can securely query Salesforce data (like an Order or Case record) using a flow or Apex, so it gives the customer a real, up-to-date answer instantly, any time of day.","By handling these frequent status checks automatically, the bot frees up human agents to focus on real issues with the order instead of repeating the same status update.","Why the Other Options Are Incorrect","Configure a \"Visual Remote Assistant\": this is a video-based tool where an agent sees what the customer sees through their camera, used for things like troubleshooting a physical product — not for checking an order status in a database.","Build a Screen Flow: a screen flow can show information through a guided form, but it lacks the natural back-and-forth chat feel and the ability to escalate to a live agent that an Einstein Bot provides.","Reference:","Einstein Bots for Order Status – Salesforce Help"]},{"id":"E2-9","exam":2,"n":9,"q":"SQS Global Services (SGS) implemented Case Management to support business-to-consumer (B2C) customers. One custom field includes the Customer's Personal Identifiable Information (PII) data. When a case is submitted, an account manager requires Read-Only access and needs to view the customer's PII data. A support engineer requires Read and Write access but no visibility into the customer's PII data. Which solution should a consultant recommend to meet the requirements?","o":["Configure View All for the Case object and field-level security.","Configure Case Team with Read Write and field-level security.","Configure OWD for the Case object and implement Salesforce Shield."],"a":1,"x":["Core ask of the scenario:","A case has a sensitive PII field, and two different people need two different levels of access to it.","The account manager should see the PII field but only read it (no edits to the case).","The support engineer should edit the case but should never see the PII field at all
