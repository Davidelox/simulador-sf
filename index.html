.","Example: it's like a shared report where one person can read everything but not touch it, and another person can edit the report but a sensitive column stays hidden from them.","The correct answer is Configure Case Team with Read/Write and field-level security.","Why This Is Correct","This combines record-level access (who can see or edit the Case record) with field-level access (who can see one specific field) to match two different needs at once.","For the account manager: add them to the Case Team with a \"Read Only\" role, and give their profile or permission set \"Visible\" on the PII field. For the support engineer: add them to the Case Team with a \"Read/Write\" role, but leave the PII field's \"Visible\" checkbox unchecked for them — they can edit the case but never see that one field.","Why the Other Options Are Incorrect","Configure View All for the Case object and field-level security: \"View All\" is a very broad, org-wide permission that shows every Case record to that user, which is far more access than an account manager who should likely only see their own accounts' cases.","Configure OWD for the Case object and implement Salesforce Shield: Salesforce Shield (Platform Encryption) protects data at rest, but it isn't the standard tool for simply hiding a field from one internal user while showing it to another — field-level security already does that natively and more simply.","Reference:","Set Up Case Teams – Salesforce Help"]},{"id":"E2-10","exam":2,"n":10,"q":"SQS Global Services (SGS) has Excel files of customer data maintained by its service reps. All or the service reps have worked with the same customer contacts. SGS wants to ensure that its Salesforce Instance has clean data. Which best practice should a consultant recommend?","o":["Deduplicate the data before importing into Salesforce.","Import the records and create a Flow to change the data type.","Import the records and use Duplicate Management."],"a":0,"x":["Core ask of the scenario:","Many service reps have Excel files, and they've all been dealing with the same customers — so the same contact shows up many times across files.","If all these files are imported as-is, Salesforce ends up with a lot of duplicate contact records.","The question asks: what's the best practice to keep the data clean when importing?","Example: it's like merging five people's contact lists on their phones before combining them into one shared address book, instead of combining first and sorting out duplicates later.","The correct answer is Deduplicate the data before importing into Salesforce.","Why This Is Correct","Cleaning the data at the source (in Excel, before import) prevents duplicate contact records from ever reaching Salesforce in the first place. This keeps the org clean from day one, avoids wasting storage on redundant records, and keeps reps from being confused by multiple records for the same person.","It is far easier to remove duplicates in Excel using tools like \"Remove Duplicates\" than to clean up thousands of duplicate records after they already exist in Salesforce.","Why the Other Options Are Incorrect","Import the records and create a Flow to change the data type: this doesn't address duplicates at all — a Flow is for automation logic, not for changing a field's data type or removing duplicate records.","Import the records and use Duplicate Management: Duplicate Management is great for stopping new duplicates from being created going forward, but it is not the most efficient way to clean up data you already know is full of duplicates before it's even imported.","Reference:","Best Practices for Importing Clean Data – Salesforce Help"]},{"id":"E2-11","exam":2,"n":11,"q":"SQS Global Services (SGS) has a service-level agreement (SLA) with customers that requires an agent to take ownership of and respond to incoming cases within 2 hours of case creation. Which best practice will help SGS meet its SLA?","o":["Assign cases to queues and use Escalation Rules to escalate cases that remain unassigned to an agent within 1 hour.","Use Flow Builder to assign a task to all members of a queue if a case remains unassigned to any agent within 1 hour.","Use case auto-response rules to send an email to support managers within 1 hour of case creation."],"a":0,"x":["Core ask of the scenario:","The company promised customers that an agent will take ownership of and respond to every case within 2 hours.","The question asks: what setup helps make sure that promise is kept, and flags cases before they breach that 2-hour window?","Example: it's like setting an alarm 1 hour before a flight's boarding time, not right when boarding starts — so there's still time to act.","The correct answer is Assign cases to queues and use Escalation Rules to escalate cases that remain unassigned within 1 hour.","Why This Is Correct","Escalation Rules are built specifically to monitor time-based requirements and take action if a case \"stalls\" without getting picked up. Setting the escalation trigger at the 1-hour mark (half of the 2-hour SLA) creates a safety buffer, giving a manager or backup team time to react before the SLA is actually breached.","Escalation rules can also automatically reassign the case (for example, to a priority queue or supervisor) and send alert emails, so the right people know immediately.","Why the Other Options Are Incorrect","Use Flow Builder to assign a task to all members of a queue: creating a separate task for every queue member is noisy and inefficient — it clutters the system with manual tasks instead of directly solving who owns the case.","Use case auto-response rules to send an email to support managers: auto-response rules are meant to send an acknowledgment email to the customer right when a case is created, not a delayed internal alert to managers after a time delay.","Reference:","Escalation Rules – Salesforce Help"]},{"id":"E2-12","exam":2,"n":12,"q":"Managers at Sunrays Limited (SL) often need to update the Case Type field for up to 75 cases at one time using list views. Which Service Console productivity tool should a consultant recommend?","o":["Run a macro on each case.","Use a mass Quick Action.","Use a keyboard shortcut."],"a":1,"x":["Core ask of the scenario:","Managers pick up to 75 cases in a list view and need to change the Case Type field on all of them at once.","The question asks: which productivity tool updates one field across many selected records in one go?","Example: it's like selecting 75 emails and moving them all to one folder in a single click, instead of opening each email one by one.","The correct answer is Use a mass Quick Action.","Why This Is Correct","Mass Quick Actions (also called Bulk Quick Actions) let a user select up to 200 records in a list view and update a field on all of them at once, which fits the \"75 cases\" scenario perfectly.","The manager selects the checkboxes at the top of the list, clicks one button, picks the new Case Type, and saves — one simple pop-up handles the entire batch.","This is the standard, native way to make bulk edits from a list view without opening each case individually.","Why the Other Options Are Incorrect","Run a macro on each case: macros are powerful, but running one \"on each case\" still means opening or stepping through all 75 cases individually, which is slower than one mass update.","Use a keyboard shortcut: shortcuts speed up single-record actions like edit or save; they don't have a built-in way to bulk-update one field across 75 different records at once.","Reference:","Mass Quick Actions – Salesforce Help"]},{"id":"E2-13","exam":2,"n":13,"q":"Sunrays Limited (SL) wants to implement Service Cloud using Agile methodology. How should the consultant recommend delivering a successful implementation?","o":["Finish all of the project requirements at once and deliver a complete solution.","Generate continuous feedback from the project team, and adjust the requirements and deliverables accordingly.","Generate all of the requirements with SL executives and then develop the project schedule."],"a":1,"x":["Core ask of the scenario:","The company wants to roll out Service Cloud using Agile, which is about small steps and flexibility, not one big-bang launch.","The question asks: what should the consultant actually do to deliver the project the \"Agile way\"?","Example: it's like building a house room by room and checking in with the owner after each room, instead of building the whole house blindly and showing it only at the very end.","The correct answer is Generate continuous feedback from the project team, and adjust the requirements and deliverables accordingly.","Why This Is Correct","Agile is built around short, repeated cycles (sprints) where small pieces of working functionality are delivered every few weeks instead of all at once.","Getting continuous feedback from the actual project team, including the support agents who will use the system, ensures the solution really solves their day-to-day problems.","If business needs change partway through the project, Agile lets the team adjust requirements and deliverables without restarting the whole project from scratch.","Why the Other Options Are Incorrect","Finish all of the project requirements at once and deliver a complete solution: this describes the Waterfall approach, which is the opposite of Agile — it risks delivering something that no longer matches the business's needs by the time it's \"done.\" Generate all of the requirements with SL executives and then develop the project schedule: relying only on executives misses the day-to-day details that front-line agents actually deal with, creating a disconnect between the plan and real needs.","Reference:","Agile Basics – Trailhead"]},{"id":"E2-14","exam":2,"n":14,"q":"The call center manager at Sunrays Limited (SL) wants to generate daily reports to monitor agent productivity trends. Which primary object should a consultant select to create a new Omni-Channel report type?","o":["Assigned Work","Agent Work","Agent Detail"],"a":1,"x":["Core ask of the scenario:","A manager wants a daily report on how productive agents are through Omni-Channel.","To build a custom report type, you first have to pick the main object that holds this productivity data.","The question asks: which object should be the primary object for this new Omni-Channel report type?","Example: it's like choosing the right spreadsheet tab to build a chart from — pick the one that actually has the handle-time and workload numbers.","The correct answer is Agent Work.","Why This Is Correct","The Agent Work object tracks every individual piece of work (a case, chat, lead, etc.) that Omni-Channel routes to an agent.","It holds the exact fields needed for productivity reporting, such as Handle Time, Speed to Answer, Accepted Date, and Decline Reason. Using Agent Work as the primary object lets the manager build a report showing which agents close work the fastest and how many items each one handles per shift.","Why the Other Options Are Incorrect","Assigned Work: there is no standard Salesforce object by this name — it's a distractor that sounds plausible but doesn't exist as an Omni-Channel reporting object.","Agent Detail: this relates to presence status (how long an agent was Available vs. On Break), not to the specific work items an agent completed, so it can't show productivity trends tied to actual case handling.","Reference:","Create Reports for Omni-Channel – Salesforce Help"]},{"id":"E2-15","exam":2,"n":15,"q":"Sunrays Limited (SL) is initiating a program to improve customer satisfaction. As part of the program, customers must be surveyed after the case is closed to ensure the customer is satisfied and the issue has been resolved. Which solution should a consultant recommend to meet this requirement?","o":["Use auto-response rules to send an email to the customer.","Use Escalation Rules to assign the case to a case queue.","Use Flow Builder to send an email to the customer."],"a":2,"x":["Core ask of the scenario:","The company wants to send a satisfaction survey to the customer, but only after the case is officially closed.","The question asks: which tool can trigger that survey email automatically at the right moment (case closed)?","Example: it's like a store sending you a feedback text right after your order is marked \"delivered,\" not before.","The correct answer is Use Flow Builder to send an email to the customer.","Why This Is Correct","Flow Builder can be set up as a Record-Triggered Flow that fires specifically when a Case's Status changes to \"Closed.\" Salesforce has a native \"Send Survey Invitation\" action inside Flow Builder, which can automatically generate a survey link and email it to the Case's Contact.","This also lets the consultant add logic to avoid \"survey fatigue,\" such as only sending a survey once every few months per customer.","Why the Other Options Are Incorrect","Use auto-response rules to send an email to the customer: these only trigger when a case is first created, to send an acknowledgment email — they can't fire later when a case closes.","Use Escalation Rules to assign the case to a case queue: Escalation Rules are for reassigning or alerting someone when a case stays open too long (SLA risk), not for sending a survey after closure.","Reference:","Send a Survey Invitation from Flow Builder – Salesforce Help"]},{"id":"E2-16","exam":2,"n":16,"q":"Service agents need to send emails with attachments to customers based on the case details. Which Lightning Service Console feature should a consultant use to meet the requirement?","o":["Quick text template","Lightning Knowledge","Custom case actions"],"a":1,"x":["Core ask of the scenario:","Agents need to email customers helpful content (like a how-to guide) that includes file attachments, based on what the case is about.","The question asks: which console feature helps agents find and send that relevant content with attachments?","Example: it's like a customer support chat suggesting the right help article (with a downloadable PDF) based on the keywords in your question.","The correct answer is Lightning Knowledge.","Why This Is Correct","Lightning Knowledge surfaces \"Suggested Articles\" based on the case's subject or description, helping agents quickly find the right content for the issue.","If a Knowledge article has a file attached to it, agents can use the \"Insert Article to Email\" action to send that file as an email attachment to the customer.","This is the standard, out-of-the-box feature for matching case details to relevant documentation and attachments, without needing custom development.","Why the Other Options Are Incorrect","Quick text template: Quick Text inserts predefined snippets of text (like greetings) into emails and chats, but it does not support file attachments. Custom case actions: while a custom action could theoretically be built for this, consultants always recommend the standard, out-of-the-box Knowledge feature before building something custom.","Reference:","Set Up Lightning Knowledge – Salesforce Help"]},{"id":"E2-17","exam":2,"n":17,"q":"Sunrays Limited (SL) wants to let its customers interact in real time with support agents from their computers and mobile devices. Which feature should a consultant recommend to meet this requirement?","o":["Knowledge articles","Einstein Chat Bot","Web-to-case"],"a":1,"x":["Core ask of the scenario:","Customers should be able to start a live, back-and-forth conversation from a computer or a phone, any time.","The question asks: which feature gives this instant, conversational support across devices?","Example: it's like a chat bubble that pops up on a website or app and replies right away, instead of making you fill out a form and wait for an email.","The correct answer is Einstein Chat Bot.","Why This Is Correct","Einstein Bots respond in seconds, handling initial troubleshooting and FAQs, and can hand off to a live human agent if the issue is too complex — that's the \"real time\" interaction being asked for.","Bots are device-agnostic: the same bot can be embedded in a desktop website, a mobile-responsive site, or inside a mobile app, covering both computers and mobile devices.","They're available 24/7, so customers get real-time interaction even outside normal agent working hours.","Why the Other Options Are Incorrect","Knowledge articles: these are static content a customer reads on their own; there's no live, back-and-forth interaction happening. Web-to-case: this is an asynchronous, \"offline\" form submission — the customer sends a request and waits for an agent to respond later by email, which isn't real time.","Reference:","Einstein Bots Basics – Trailhead"]},{"id":"E2-18","exam":2,"n":18,"q":"Sunrays Limited (SL) is ramping up its Knowledge program. SL has a robust analytics team that would like to report on trends in Knowledge Searching, User Activity, and Data Category Usage. Which reporting solution should a consultant recommend?","o":["Custom Report Types with Reports and Dashboards","Knowledge Base Reports and Dashboard Package Installation","Knowledge Dashboard Pack for CRM Analytics Installation"],"a":2,"x":["Core ask of the scenario:","A strong analytics team wants deep insights on three things: what people search for, how users are active, and how data categories are used.","The question asks: what's the best reporting tool for this kind of deep, trend-based analysis?","Example: it's like using a dedicated analytics dashboard (like Google Analytics) instead of a basic spreadsheet, when you need to spot patterns in a lot of search data.","The correct answer is Knowledge Dashboard Pack for CRM Analytics Installation.","Why This Is Correct","CRM Analytics (formerly Tableau CRM) is built for deep trend analysis and handling high volumes of data, which fits a \"robust analytics team\" doing serious reporting.","This dashboard pack provides specific views for Knowledge Search trends, helping the team see which search terms are used most and where searches fail to find results.","It also gives a more advanced way to analyze Data Category usage than standard reports can offer, and it scales well as search and activity logs grow.","Why the Other Options Are Incorrect","Custom Report Types with Reports and Dashboards: standard custom report types can show basic object data (like article views), but they can't capture detailed search activity or search term logs needed for real trend analysis.","Knowledge Base Reports and Dashboard Package Installation: this free package is good for basic monitoring, like \"Top 10 Most Viewed Articles,\" but it lacks the advanced search and category trending capabilities a serious analytics team needs.","Reference:","Knowledge Dashboard Pack for CRM Analytics – AppExchange"]},{"id":"E2-19","exam":2,"n":19,"q":"SQS Global Services (SGS) provides phone support to customers using the Service Cloud Voice Dialer. Once a call completes, support agents often need to send a follow-up email or finalize case notes. SGS wants to get insight about agent efficiency. Which metric should a consultant recommend to track the efficiency of individual agents?","o":["Total Emails Sent","Call Abandonment","After Conversation Work Time"],"a":2,"x":["Core ask of the scenario:","After a phone call ends, agents still need time to wrap up — send a follow-up email or finish case notes.","The company wants a metric that captures how efficient agents are with that specific wrap-up time.","The question asks: which metric tracks that post-call \"finishing up\" time per agent?","Example: it's like measuring how long a cashier takes to close out a receipt after the customer has already paid and left.","The correct answer is After Conversation Work Time.","Why This Is Correct","After Conversation Work (ACW), often called \"Wrap-up Time,\" measures how long an agent stays occupied with a case after the call has ended. During ACW, Omni-Channel still counts the call against the agent's capacity, which stops a new call from interrupting them while they finish notes or emails.","Tracking ACW lets a consultant see which agents spend too long on post-call tasks, which can point to a need for better Quick Text templates, Macros, or training.","Why the Other Options Are Incorrect","Total Emails Sent: this measures volume, not efficiency — an agent could send many short, irrelevant emails or one long useful one, so it doesn't capture wasted time between calls.","Call Abandonment: this tracks how many customers hung up while waiting in a queue, which is a customer-experience and staffing metric, not a measure of how efficient an individual agent is once they're on the job.","Reference:","After Conversation Work Time – Salesforce Help"]},{"id":"E2-20","exam":2,"n":20,"q":"Sunrays Limited (SL) uses Omni-Channel to route calls, chats, and cases to agents. The contact center manager wants to improve the team's ability to prioritize time-sensitive work. Which feature should a consultant recommend?","o":["Enable Secondary Routing priority.","Define Interruptible capacity.","Set a High Priority skill."],"a":1,"x":["Core ask of the scenario:","Agents handle calls, chats, and cases together through Omni-Channel, but some work (like a live chat) is more urgent than others (like an email case).","The manager wants urgent work to jump ahead and reach an agent even if they're already busy with less urgent work.","The question asks: which feature lets time-sensitive work interrupt an agent's current, less-urgent workload?","Example: it's like a doctor pausing routine paperwork to see a walk-in emergency patient right away.","The correct answer is Define Interruptible Capacity.","Why This Is Correct","Interruptible Capacity gives an agent two separate capacity \"buckets\" instead of one: a primary bucket and an interruptible bucket. Channels like Email can be marked \"Interruptible,\" so when an agent is working at full capacity on those items, Salesforce can still push through a primary, time-sensitive item like a Chat.","This ensures urgent, real-time work is never stuck waiting in a queue just because agents are busy with slower, less urgent tasks.","Why the Other Options Are Incorrect","Enable Secondary Routing priority: this moves a work item forward within its own queue (for example, before an SLA breach), but it doesn't let urgent work override an agent's existing full workload.","Set a High Priority skill: skill-based routing matches the right agent to a job based on expertise, and priority skills decide which skills get \"dropped\" during high volume — it's not about overriding an agent's current capacity.","Reference:","Interruptible Capacity – Salesforce Help"]},{"id":"E2-21","exam":2,"n":21,"q":"Sunrays Limited (SL) wants to provide a more consistent service experience to its customers and is evaluating using macros. Which prerequisite should the consultant consider?","o":["The Lightning page contains the Run Macros action.","All users have permission to create macros.","Publisher actions are on the page layout."],"a":2,"x":["Core ask of the scenario:","Macros work by clicking buttons for the agent automatically, like \"Email\" or \"Log a Call.\" If those buttons aren't on the screen, a macro has nothing to click.","The question asks: what must already be in place before macros can actually run?","Example: it's like a robot arm trying to press a light switch that was removed from the wall — it needs the switch to be there first.","The correct answer is Publisher actions are on the page layout.","Why This Is Correct","Macros work by mimicking human clicks on the screen, so they depend on Publisher Actions (Quick Actions) actually being present and visible on the page layout.","If an agent wants a macro to send an email or log a call, the \"Email\" or \"Log a Call\" action must exist in the Lightning Experience Actions section of the layout — otherwise the macro has nothing to interact with and will fail.","The record page also needs a publisher component (like Chatter or Activities) that actually displays these actions for the macro to use.","Why the Other Options Are Incorrect","The Lightning page contains the Run Macros action: this isn't quite accurate — macros are run from the Macros utility added to the Utility Bar, not from an action added directly on the Lightning page.","All users have permission to create macros: this is an access choice, not a technical prerequisite — many orgs only let a few power users create macros while everyone else just runs them, and the program can still work fine that way.","Reference:","Publisher Actions – Salesforce Help"]},{"id":"E2-22","exam":2,"n":22,"q":"A manager would like information on which Knowledge articles are used most often by call center agents. Which report should a consultant use to identify the Knowledge articles that are used most often?","o":["Knowledge articles with the highest ratings","Number of Knowledge articles attached to Cases","Knowledge articles with the most revisions"],"a":1,"x":["Core ask of the scenario:","A manager wants to know which Knowledge articles agents actually use the most to help customers.","The question asks: which report best shows this real usage, not just views or ratings?","Example: it's like judging a recipe book by how many times people actually cooked a recipe, not by how many times they just flipped past the page.","The correct answer is Number of Knowledge articles attached to Cases.","Why This Is Correct","When an agent clicks \"Attach to Case\" on an article, Salesforce logs that connection — this is a direct signal that the article actually helped solve that case.","If an article is attached to hundreds of cases, it's clearly a go-to solution for a common issue, which is a much stronger usefulness signal than a simple view count.","Reporting on the Case Article relationship (or a custom report type for \"Cases with Articles\") lets the manager see exactly which article titles are resolving the most tickets.","Why the Other Options Are Incorrect","Knowledge articles with the highest ratings: ratings reflect quality, not volume of use — an article could have a perfect rating but have only been used once, and many agents simply forget to rate articles.","Knowledge articles with the most revisions: revisions track how often an article has been edited, which measures maintenance effort, not how often agents actually use it to help customers.","Reference:","Reports on Knowledge Articles – Salesforce Help"]},{"id":"E2-23","exam":2,"n":23,"q":"Sunrays Limited (SL) has decided to implement a Web-to-Case form on its website so customers can submit requests instead of calling the customer service center. The product owner has asked the consultant to create the implementation plan and research solutions. What should the consultant do before creating an implementation plan?","o":["Review Einstein Conversation Mining for Web-to-Case.","Review guidelines and limits for Web-to-Case.","Review Service Setup Assistant for Web-to-Case."],"a":1,"x":["Core ask of the scenario:","Before building any implementation plan, a consultant needs to know the rules and limits of the tool being planned around.","The question asks: what should the consultant check first, before writing the Web-to-Case implementation plan?","Example: it's like checking a car's fuel tank size before planning a road trip route — you need to know the limits before you plan around them.","The correct answer is Review guidelines and limits for Web-to-Case.","Why This Is Correct","Web-to-Case has real technical boundaries, such as a daily limit of 5,000 cases created per 24 hours — if Sunrays Limited expects more, the plan needs a different approach or a limit increase.","Reviewing the guidelines also highlights the need for reCAPTCHA, since without it the form can quickly get flooded with spam, bot-generated cases.","Knowing these limits upfront (like the fact that Web-to-Case doesn't support rich text or attachments out of the box) keeps the implementation plan realistic and compliant from the start.","Why the Other Options Are Incorrect","Review Einstein Conversation Mining for Web-to-Case: this AI tool analyzes existing chat or email conversation data to find trends and build bot intents — it has nothing to do with setting up a basic Web-to-Case form.","Review Service Setup Assistant for Web-to-Case: the Setup Assistant is a quick configuration shortcut for a trial or basic environment, not a research step — a consultant should understand the actual limits first before relying on a shortcut tool.","Reference:","Web-to-Case Guidelines and Limits – Salesforce Help"]},{"id":"E2-24","exam":2,"n":24,"q":"Sunrays Limited (SL) wants to implement a solution that would hold service agents accountable for keeping customer service-level agreements (SLAs). Which feature should a consultant use to meet this request?","o":["Salesforce Survey","Service Contracts","Entitlement process"],"a":2,"x":["Core ask of the scenario:","The company wants agents to actually be held accountable for meeting SLAs, not just have an SLA written down somewhere.","The question asks: which feature enforces time-based steps and alerts people if those steps are missed?","Example: it's like a countdown timer on a food delivery order, with a warning the moment it's running late — it keeps things on track, not just promises them.","The correct answer is Entitlement process.","Why This Is Correct","While a Service Contract defines what a customer is eligible for, the Entitlement Process is the engine that actually enforces time-bound steps, called Milestones, such as \"First Response Time\" or \"Resolution Time.\" Agents see a real-time countdown clock (Milestone Tracker) right on the case, which creates visible, ongoing pressure to act on time. Milestone Actions can trigger automatically if a deadline is close or missed — for example, emailing a manager or reassigning the case — which holds agents accountable in a measurable, automated way.","Why the Other Options Are Incorrect","Salesforce Survey: surveys collect customer feedback after the fact; they don't track or enforce SLA deadlines during a case's lifecycle. Service Contracts: these define the terms of what support a customer is entitled to, but they don't enforce the moment-to-moment, time-bound milestones that hold an individual agent accountable.","Reference:","Entitlement Management Overview – Salesforce Help"]},{"id":"E2-25","exam":2,"n":25,"q":"Sunrays Limited (SL) is training a new set of service agents. Part of the training includes handling messaging from customers. However, it is important that contact center managers monitor the messaging sessions to ensure the service agents' responses are professional and accurate and that the managers are able to assist when needed. Which Lightning Console feature should a consultant configure to support this need?","o":["Chat Supervisor tab and Whisper Messages","Omni-Channel Supervisor tab and Whisper Messages","Incident Management tab and Whisper Messages"],"a":1,"x":["Core ask of the scenario:","New agents are learning to handle customer messages, and managers need to watch those conversations live.","Managers also need a way to quietly step in and help the new agent without the customer noticing.","The question asks: which feature combination supports both live monitoring and silent coaching?","Example: it's like a driving instructor watching a learner drive and whispering directions through a headset, without the passenger hearing.","The correct answer is Omni-Channel Supervisor tab and Whisper Messages.","Why This Is Correct","The Omni-Channel Supervisor tab lets managers view agents' live messaging sessions in real time, so they can check that responses are professional and accurate.","Whisper Messages let the manager send a message that only the agent sees, meaning the manager can step in and guide the new agent without the customer ever knowing.","Together, these two features cover both halves of the requirement: live visibility into the conversation and a private way to assist.","Why the Other Options Are Incorrect","Chat Supervisor tab and Whisper Messages: there is no standard Salesforce feature called \"Chat Supervisor tab\" — the correct, real feature name is Omni-Channel Supervisor.","Incident Management tab and Whisper Messages: Incident Management is used for tracking and resolving IT or operational incidents, not for monitoring live agent-customer chat sessions.","Reference:","Omni-Channel Supervisor – Salesforce Help"]},{"id":"E2-26","exam":2,"n":26,"q":"Sunrays Limited (SL) wants to increase the number of articles in its knowledge base while maintaining article quality. SL plans to allow all service agents to create articles. What should the consultant recommend to create a vetting workflow to reduce the number of low-quality articles?","o":["Approval process","Flow with notifications","Reports and dashboards"],"a":0,"x":["Core ask of the scenario:","All agents can now write new knowledge articles, but the company still wants to make sure the quality stays high.","They need a review step before a new article actually goes live, so low-quality ones get caught and fixed.","The question asks: what feature can act as that review/approval gate for new articles?","Example: it's like a manager reviewing and approving a blog post before it's published on the company website.","The correct answer is Approval process.","Why This Is Correct","An Approval Process lets an article move through defined review steps (such as a senior writer or SME reviewing it) before it is published and visible to everyone.","It can automatically route a newly created article to the right approver based on criteria like topic or author, creating a consistent vetting workflow.","If the article doesn't meet quality standards, the approver can reject it and send feedback back to the author, directly reducing low-quality published content.","Why the Other Options Are Incorrect","Flow with notifications: a flow can send a notification that an article was created, but it doesn't provide the structured, step-by-step approve/reject gate that a true vetting workflow needs.","Reports and dashboards: these only show information after the fact, like how many articles exist; they don't actually stop a low-quality article from being published in the first place.","Reference:","Approval Processes for Knowledge Articles – Salesforce Help"]},{"id":"E2-27","exam":2,"n":27,"q":"Sunrays Limited (SL) has a Service Cloud implementation with several channels. Executives want quick access to agent, team, and call center key performance indicators (KPIs). Service managers need to see data about their teams as well. How should the consultant display the data quickly?","o":["Use the Service Analytics prebuilt dashboards in CRM Analytics.","Migrate the data to a data lake and request a dashboard.","Create reports from Cases and display on a dashboard."],"a":0,"x":["Core ask of the scenario:","Executives and managers both want to see KPIs quickly, without a lot of setup time.","The word \"quickly\" is the key clue — the solution should already exist and be ready to use.","The question asks: what's the fastest way to show agent, team, and call center KPIs?","Example: it's like using a ready-made weather app instead of building your own weather tracking tool from scratch.","The correct answer is Use the Service Analytics prebuilt dashboards in CRM Analytics.","Why This Is Correct","Service Analytics comes with ready-made dashboards built specifically for Service Cloud KPIs like agent performance, team metrics, and call center stats.","Because these dashboards are prebuilt, the consultant can get executives and managers looking at meaningful data almost immediately, which directly matches the \"quickly\" requirement.","These dashboards also work across multiple channels, matching Sunrays Limited's setup with several service channels.","Why the Other Options Are Incorrect","Migrate the data to a data lake and request a dashboard: this is a slow, heavy infrastructure project — the opposite of a quick solution, and unnecessary when Salesforce already has this data.","Create reports from Cases and display on a dashboard: building custom reports and dashboards from scratch takes much more time and effort than using an existing, prebuilt analytics solution.","Reference:","Service Analytics – Salesforce Help"]},{"id":"E2-28","exam":2,"n":28,"q":"SQS Global Services (SGS) hired agents in an expansion of the contact center. Getting agents up to speed and fully productive is a priority. SGS implemented a standardized agent-customer dialog to assist agents. Which feature should a consultant integrate into the Service Console?","o":["In-App Guidance","Actions & Recommendations","Einstein Next Best Action"],"a":1,"x":["Core ask of the scenario:","New agents are joining a growing contact center and need to get productive fast.","The company already built a standard script (dialog) for agents to follow with customers.","The question asks: which console feature can surface that standardized dialog/next steps to agents while they work?","Example: it's like a GPS giving step-by-step directions during a drive, instead of memorizing the whole route beforehand.","The correct answer is Actions & Recommendations.","Why This Is Correct","The Actions & Recommendations component can display a configured set of guided steps or scripted talking points directly on the Service Console, right where agents are working.","This helps new agents follow the company's standardized dialog consistently, without needing to have everything memorized from training. Because it's built into the console itself, it speeds up ramp-up time for new hires by guiding them through the right next steps live during a call or case.","Why the Other Options Are Incorrect","In-App Guidance: this shows walkthroughs and prompts about how to use the Salesforce interface itself (like \"click here to create a case\"), not a scripted customer conversation flow.","Einstein Next Best Action: this uses AI-driven strategies to recommend offers or actions based on data patterns, which is a different purpose than following a fixed, standardized dialog script.","Reference:","Actions & Recommendations – Salesforce Help"]},{"id":"E2-29","exam":2,"n":29,"q":"Sunrays Limited (SL) is implementing Service Cloud. SL needs to reduce total case volume and the average amount of time spent by agents on cases. Which solution meets these requirements?","o":["Enable agent chat functionality for customers. Disable the ability to log a case from the Experience Cloud Site.","Publish Knowledge articles to the Experience Cloud site. Enable the attachment of articles upon case closure.","Use escalation rules to move cases into the correct status. Create reports to monitor service-level agreement (SLA) adherence."],"a":1,"x":["Core ask of the scenario:","The company wants two things at once: fewer total cases coming in, and less time spent by agents on each case.","The question asks: which single solution helps both — reduce case volume AND reduce time per case?","Example: it's like publishing a public FAQ page that both stops people from calling in as often, and gives agents a ready answer to attach when they do.","The correct answer is Publish Knowledge articles to the Experience Cloud site, and enable the attachment of articles upon case closure.","Why This Is Correct","Publishing Knowledge articles to a self-service Experience Cloud site lets customers find answers on their own, which directly reduces how many cases get created in the first place (lower case volume).","Enabling article attachment upon case closure means agents can quickly resolve a case by attaching the relevant article instead of typing a full custom response, cutting down the time spent per case.","Together, these two pieces attack both goals in the question at once, using one coordinated Knowledge strategy.","Why the Other Options Are Incorrect","Enable agent chat and disable logging a case from the site: blocking case logging could frustrate customers who genuinely need help, and live chat doesn't reduce case volume — it may just shift where the conversation happens.","Use escalation rules and create SLA reports: escalation rules and SLA reports help manage and monitor existing cases better, but they don't reduce how many cases come in or shorten how long each one takes to resolve.","Reference:","Knowledge in Experience Cloud – Salesforce Help"]},{"id":"E2-30","exam":2,"n":30,"q":"SQS Global Services (SGS) wants to notify support managers when a new case has been untouched for more than 2 business hours. Which approach should a consultant implement?","o":["Configure Case Escalation rules.","Establish Case Assignment Rules.","Create a Flow with a scheduled path."],"a":0,"x":["Core ask of the scenario:","A new case can sit untouched, and the company wants managers alerted if nobody acts on it within 2 business hours.","\"Business hours\" is an important detail — the timer should respect working hours, not run 24/7.","The question asks: what feature can watch case age and notify managers, using business-hour-aware timing?","Example: it's like a \"still unread after 2 working hours\" reminder for an email — it doesn't count the hours the office is closed.","The correct answer is Configure Case Escalation rules.","Why This Is Correct","Escalation Rules are built specifically to watch how long a case has gone without being acted on and trigger an action once a time threshold is crossed.","Escalation Rules can be tied to a Business Hours setting, so the \"2 business hours\" timer correctly pauses outside of working hours instead of counting around the clock.","Once the threshold is hit, the rule can automatically notify the support manager, which is exactly the outcome the company wants.","Why the Other Options Are Incorrect","Establish Case Assignment Rules: these only decide who a case is assigned to the moment it's created; they have no ongoing timer to detect a case sitting untouched later.","Create a Flow with a scheduled path: this could technically be built, but it takes more manual setup to replicate business-hours-aware timing that Escalation Rules already provide natively.","Reference:","Escalation Rules – Salesforce Help"]},{"id":"E2-31","exam":2,"n":31,"q":"A contact center manager wants to measure improvements to capacity planning operations after the implementation of a new workforce management system. Which metric should a consultant use to assess the success of the new workforce management system?","o":["Service rep utilization","Number of closed cases","Deflection rate"],"a":0,"x":["Core ask of the scenario:","The company set up a new workforce management system to plan staffing (capacity planning) better.","The manager wants a metric that shows whether this new system actually improved how well staffing matches workload.","The question asks: which metric best reflects \"capacity planning\" success?","Example: it's like checking whether a restaurant scheduled the right number of staff for a busy Friday night — not too few, not too many sitting idle.","The correct answer is Service rep utilization.","Why This Is Correct","Utilization measures how much of an agent's available working time is actually spent handling work, which is exactly what capacity planning is trying to optimize.","A good workforce management system should raise utilization closer to an ideal target — not too low (agents idle, wasted staffing cost) and not too high (agents overloaded, burnout risk).","Because this metric directly reflects how well staffing levels match incoming workload, it's the clearest way to measure capacity planning improvement.","Why the Other Options Are Incorrect","Number of closed cases: this measures overall throughput, but it doesn't tell you whether staffing levels were well planned — cases could still close with agents overworked or understaffed.","Deflection rate: this measures how many customers found answers through self-service instead of contacting an agent, which relates to Knowledge or bots, not to workforce staffing and capacity planning.","Reference:","Workforce Engagement Management – Salesforce Help"]},{"id":"E2-32","exam":2,"n":32,"q":"Sunrays Limited (SL) wants to explore having a full Incident Management, Swarming, and Change Management process to provide a foundation for its auditing and governance needs. SL also wants interactive recommendations for every department during this process. Besides implementing Incident Management and Service Cloud for Slack, what should a consultant recommend for the full solution?","o":["Implement Guidance for Success and Knowledge articles.","Implement flow Orchestration with Work Guides.","Implement a third-party app from AppExchange."],"a":1,"x":["Core ask of the scenario:","The company already has Incident Management and Service Cloud for Slack, and wants interactive, step-by-step recommendations for every team during an incident, change, or swarming process.","The question asks: what else should be added to complete this full, interactive process solution?","Example: it's like giving every team a guided checklist that reacts to what's happening, instead of just a static document to read.","The correct answer is Implement Flow Orchestration with Work Guides.","Why This Is Correct","Flow Orchestration lets a consultant design multi-step, multi-person processes (like incident response or change management) that span different teams and systems.","Work Guides give each person involved an interactive, step-by-step guided experience, showing exactly what to do next — this is the \"interactive recommendations for every department\" the scenario asks for.","Together, Orchestration and Work Guides create a structured, trackable process that supports auditing and governance, fitting the company's broader goals.","Why the Other Options Are Incorrect","Implement Guidance for Success and Knowledge articles: these provide helpful tips and static reference content, but they aren't interactive, step- by-step guided processes spanning multiple departments.","Implement a third-party app from AppExchange: this adds unnecessary cost and complexity when Salesforce's own native Flow Orchestration and Work Guides already solve this requirement directly.","Reference:","Flow Orchestration – Salesforce Help"]},{"id":"E2-33","exam":2,"n":33,"q":"At Sunrays Limited (SL), support agents need to verify that customers are eligible to receive support when they create the case. Where can a support agent verify that a customer is allowed to receive support?","o":["Actions","Milestones","Entitlements"],"a":2,"x":["Core ask of the scenario:","Not every customer is automatically eligible for support — some may have expired or limited support plans.","Agents need a place to check \"is this customer actually allowed to get help right now?\" when opening a case.","The question asks: where can an agent verify this eligibility?","Example: it's like a gym receptionist checking if a member's pass is still active before letting them in.","The correct answer is Entitlements.","Why This Is Correct","An Entitlement record defines what level of support a specific customer or account is eligible for, including whether their support window is still active.","When a case is created, the related Entitlement (often shown directly on the case) tells the agent whether this customer currently qualifies for support.","Entitlements can also be tied to Service Contracts and expiration dates, giving agents a clear, checkable source of truth for support eligibility.","Why the Other Options Are Incorrect","Actions: these are quick buttons (like \"Log a Call\" or \"Send Email\") used to perform tasks on a record; they don't store or show whether a customer is eligible for support.","Milestones: these track time-based steps within an entitlement process, such as First Response Time — they measure progress on a case, not whether the customer qualifies for support in the first place.","Reference:","Entitlement Management Overview – Salesforce Help"]},{"id":"E2-34","exam":2,"n":34,"q":"What is a common deflection technique to reduce the number of interactions for a contact center?","o":["Recommend articles during a call from a support agent.","Suggest articles for an Email-to-Case questions.","Recommend articles prior to a Chat session."],"a":2,"x":["Core ask of the scenario:","\"Deflection\" means stopping a customer interaction from happening at all, by solving the problem before an agent gets involved.","The question asks: what's a common way to deflect interactions before they even reach an agent?","Example: it's like showing someone a help article the moment they open a chat box, so they might not even need to send a message.","The correct answer is Recommend articles prior to a Chat session.","Why This Is Correct","Suggesting relevant Knowledge articles before a chat session even starts gives the customer a chance to solve their own issue without needing to talk to an agent at all.","This happens at the earliest possible moment — before an interaction is even opened — which is exactly what \"deflection\" means: preventing the interaction from happening in the first place.","If the article solves the issue, that's one less chat for an agent to handle, directly reducing the total number of interactions.","Why the Other Options Are Incorrect","Recommend articles during a call from a support agent: by this point, the interaction has already happened — a phone call is already in progress, so nothing was deflected.","Suggest articles for an Email-to-Case questions: this helps an agent respond to a case faster, but the case has already been created as an interaction; it reduces resolution time, not interaction volume.","Reference:","Case Deflection with Knowledge – Salesforce Help"]},{"id":"E2-35","exam":2,"n":35,"q":"SQS Global Services (SGS) often needs to seek assistance within its organization to resolve cases with its customers. Sometimes, SL needs partners to engage as well. SL wants a solution that is the most effective for case communication while documenting the conversation history. Which feature should the consultant recommend to meet the requirement?","o":["Use Slack for service for Case Swarming.","Use child Cases to interact with the partner.","Send Email Quick Action to loop in the stakeholders."],"a":0,"x":["Core ask of the scenario:","Sometimes solving a case needs help from inside the company, and sometimes even from outside partners.","The company wants one effective way to communicate on the case that also keeps a documented history of the conversation.","The question asks: which feature brings people together to discuss a case while automatically keeping a record?","Example: it's like pulling the right internal and external people into one group chat about an issue, with the whole conversation saved for later.","The correct answer is Use Slack for Service for Case Swarming.","Why This Is Correct","Case Swarming brings together the right internal experts (and even external partners) into a dedicated Slack channel tied directly to the case, so everyone can collaborate in one place.","Because it's integrated with Service Cloud, the conversation history in that Slack channel is linked back to the case record, meeting the \"documenting the conversation history\" requirement.","This is more effective than scattered emails, since it keeps all the back-and-forth discussion organized and traceable in one connected thread.","Why the Other Options Are Incorrect","Use child Cases to interact with the partner: child cases split work into separate records, but they aren't designed as a real-time conversation tool, and they don't naturally capture a running discussion history the way a swarm channel does.","Send Email Quick Action to loop in the stakeholders: email threads get messy fast with multiple people and partners, and they don't provide the same centralized, structured history Case Swarming does.","Reference:","Case Swarming – Salesforce Help"]},{"id":"E2-36","exam":2,"n":36,"q":"An organization has requested guidance on how to delete customers' personal data when they are no longer associated with the company to stay compliant with global data protection and privacy regulations. Which solution should the consultant recommend to meet the requirement?","o":["Search for all customer information in production and manually edit the fields of each record to scramble the data so that it is no longer searchable.","Search for all customer information across environments and deactivate accounts or Experience Cloud users associated with the contact.","Search and remove all customer information, including records and in unindexed free-text fields, and refresh sandboxes to ensure no data retention."],"a":2,"x":["Core ask of the scenario:","Privacy laws (like GDPR) require that a customer's personal data can be truly erased when requested, not just hidden.","Data can hide in more places than the obvious record fields — including free-text fields and copies in sandboxes.","The question asks: what's the thorough, compliant way to actually delete customer data everywhere it exists?","Example: it's like shredding a document instead of just blacking out some words — and making sure there's no backup copy sitting in another drawer.","The correct answer is Search and remove all customer information, including records and in unindexed free-text fields, and refresh sandboxes to ensure no data retention.","Why This Is Correct","True compliance means actually deleting the data, not just scrambling it or hiding it from view — regulations require real removal, not disguise. Personal data can be buried in unindexed free-text fields (like notes or descriptions) that a standard search might miss, so those need to be checked and cleared too.","Sandboxes often contain copies of production data, so refreshing them ensures no old copy of the deleted customer's data lingers in a non- production environment.","Why the Other Options Are Incorrect","Scramble the data so it's no longer searchable: this just obscures the data in place; the actual personal information still technically exists in the system, which doesn't satisfy a true \"right to be forgotten\" deletion requirement.","Deactivate accounts or Experience Cloud users: deactivating a login doesn't delete the underlying personal data stored in records — the information is still sitting in the database, which doesn't meet deletion requirements.","Reference:","Data Protection and Privacy – Salesforce Help"]},{"id":"E2-37","exam":2,"n":37,"q":"Sunrays Limited (SL)'s service agents frequently receive requests for order updates. All order information is managed by a separate cloud-based enterprise resource planning (ERP) system. Agents currently jump between applications to search for these details and have asked if this process can be improved. Which approach should the consultant recommend to streamline the process?","o":["Create a batch integration process that runs hourly to pull all order updates into Salesforce.","Use Salesforce Connect and External Objects to represent this information in Salesforce.","Create a dynamic action that launches the ERP system with a deep link to the order locator."],"a":1,"x":["Core ask of the scenario:","Order data actually lives in a separate ERP system, not in Salesforce.","Agents keep switching between two apps just to look up order info while helping a customer.","The question asks: what's the best way to show that external order data right inside Salesforce, without constantly switching screens?","Example: it's like a smart TV that shows your streaming app's content directly on its home screen, instead of you grabbing a separate remote and switching to that app every time.","The correct answer is Use Salesforce Connect and External Objects to represent this information in Salesforce.","Why This Is Correct","Salesforce Connect lets Salesforce display live data from an external system (like the ERP) as if it were a Salesforce object, without physically copying or storing that data.","Agents can see up-to-date order details directly on the case or account page in Salesforce, removing the need to jump between two different applications.","Because the data is read live from the ERP through an External Object, it's always current — there's no delay waiting for a scheduled sync.","Why the Other Options Are Incorrect","Create a batch integration that runs hourly: this copies data into Salesforce on a schedule, meaning agents could still see outdated order information for up to an hour, and it also adds ongoing storage and sync overhead.","Create a dynamic action with a deep link to the ERP system: this still requires the agent to leave Salesforce and open the ERP system separately, which doesn't actually solve the \"jumping between applications\" problem.","Reference:","Salesforce Connect – Salesforce Help"]},{"id":"E2-38","exam":2,"n":38,"q":"SQS Global Services wants to reduce the amount of time support agents spend creating cases. Case creation must scale up to 5,000 new cases per day, and allow attachments under 10 MB by the customer. Which feature should the consultant suggest?","o":["Email-to-Case.","On-Demand Email-to-Case.","Web-to-Case"],"a":1,"x":["Core ask of the scenario:","Agents are spending time manually creating cases from customer emails, and the company wants that automated.","It needs to handle a high volume (up to 5,000 new cases a day) and let customers attach files up to 10 MB.","The question asks: which feature automatically turns emails into cases at this scale, with attachment support?","Example: it's like an inbox that automatically files every incoming support email as a neat ticket, instead of someone copying each email into a new ticket by hand.","The correct answer is On-Demand Email-to-Case.","Why This Is Correct","On-Demand Email-to-Case automatically converts incoming emails into cases without an agent having to manually create them, directly reducing the time agents spend on case creation.","It's built to handle a high daily volume of incoming emails, comfortably supporting a scale like 5,000 cases per day.","It also supports email attachments, so a customer's attached file (under 10 MB) comes through and gets linked to the case automatically.","Why the Other Options Are Incorrect","Email-to-Case (the older/legacy version): this relies on an on-premises email agent polling a mailbox and has lower practical throughput and more setup overhead than the on-demand, cloud-based version.","Web-to-Case: this generates cases from a web form that customers fill in themselves, not from processing incoming emails, so it doesn't reduce the agent email-handling workload described here.","Reference:","On-Demand Email-to-Case – Salesforce Help"]},{"id":"E2-39","exam":2,"n":39,"q":"SQS uses Service Cloud and Slack. For difficult cases, service agents want to create a swarm in Slack to pull in experts from multiple SQS departments. What should the consultant recommend to an agent who wants to launch a Slack Swarm?","o":["Escalation rules.","Apex Trigger.","Quick Action."],"a":2,"x":["Core ask of the scenario:","A tricky case needs help from experts in several different departments.","The agent wants to start a Slack \"swarm\" — a group discussion — directly from the case, on demand.","The question asks: what should the agent actually click or use to start that swarm?","Example: it's like pressing a single \"Call for backup\" button on the case, instead of manually opening Slack and inviting people one by one.","The correct answer is Quick Action.","Why This Is Correct","Case Swarming is launched through a Quick Action placed on the case page, which lets an agent start a Slack swarm with one click, right from where they're already working.","This Quick Action automatically creates a dedicated Slack channel tied to the case and can pull in the right people from different departments. Because it's a simple button-based action, it's something any agent can trigger themselves whenever they hit a difficult case, with no extra setup needed each time.","Why the Other Options Are Incorrect","Escalation rules: these automatically reassign or alert someone based on a case sitting too long, but they aren't something an agent manually triggers on demand to start a swarm.","Apex Trigger: a trigger runs automatically in the background based on data changes; it's not an on-demand action an agent clicks to launch a swarm whenever they choose.","Reference:","Case Swarming – Salesforce Help"]},{"id":"E2-40","exam":2,"n":40,"q":"Sunrays Limited (SL) wants to implement several new Agentforce for Service capabilities. A Service Cloud Consultant must manage the following business requirements to identify which one can be fulfilled by using a standard topic; rather than requiring a custom topic and actions. Which use case could an out-of-the-box AI agent address with no changes to topics?","o":["Guiding a customer through the process of filing a warranty claim for a damaged shipping container and scheduling an on-site inspection.","Enabling a customer to check real-time stock levels for a specific container model across multiple distribution centers.","Answering a question about insurance policy and enabling the customer to open a new support ticket if they have a new issue."],"a":2,"x":["Core ask of the scenario:","Agentforce comes with some \"standard topics\" already built in, ready to use without any setup.","Other, more specific business needs require a custom topic with custom actions built just for that company.","The question asks: which of the three use cases can an out-of-the-box AI agent already handle, with zero changes needed?","Example: it's like a phone's built-in calculator app working right out of the box, while a specialized expense-tracking app needs to be custom built and added separately.","The correct answer is Answering a question about an insurance policy and enabling the customer to open a new support ticket if they have a new issue.","Why This Is Correct","This matches Agentforce's standard, out-of-the-box topics: answering general questions (often backed by Knowledge) and creating a case, both of which are already built in.","No custom action or special integration is needed — these are common, general-purpose service tasks that come ready to use from day one. Because it only uses capabilities every Service Cloud org already has, it requires no extra development work to enable.","Why the Other Options Are Incorrect","Guiding a warranty claim and scheduling an on-site inspection: this needs a custom process tailored to the company's specific warranty and scheduling system, which requires a custom topic and custom actions, not a standard one.","Checking real-time stock levels across multiple distribution centers: this requires connecting to the company's own specific inventory data source, which is a custom integration and action, not something built in by default.","Reference:","Agentforce Service Agent Standard Topics – Salesforce Help"]},{"id":"E2-41","exam":2,"n":41,"q":"Sunrays Limited (SL) provides customers with different service levels based on their service agreements. The head of customer service wants to use Service Cloud to track when cases have yet to reach certain stages and ensure that senior management is better informed accordingly. Which feature should a consultant recommend to address this requirement?","o":["Entitlements and Milestones","Reports and Dashboards","Service Contracts"],"a":0,"x":["Core ask of the scenario:","Different customers get different service levels based on their agreements.","Management wants to know, automatically, when a case hasn't reached certain key stages in time.","The question asks: what feature tracks these stage-by-stage deadlines and keeps senior management informed?","Example: it's like a delivery tracker that flags \"this package should have reached the warehouse by now but hasn't\" and alerts the manager.","The correct answer is Entitlements and Milestones.","Why This Is Correct","Entitlements define what level of support each customer's agreement promises, which fits the \"different service levels\" part of the requirement. Milestones are the specific time-based steps (like First Response or Resolution) within that entitlement process, and they can track whether a case has or hasn't reached a required stage in time.","Milestone actions can automatically notify senior management when a case is at risk of missing or has missed a stage, which is exactly the visibility the company wants.","Why the Other Options Are Incorrect","Reports and Dashboards: these can show historical or current data, but on their own they don't actively track stage-based deadlines per case or automatically notify people the moment a stage is missed.","Service Contracts: these define the overall terms of support a customer has purchased, but they don't track or alert on individual case-stage deadlines — that enforcement comes from Entitlements and Milestones.","Reference:","Entitlement Management Overview – Salesforce Help"]},{"id":"E2-42","exam":2,"n":42,"q":"Sunrays Limited (SL) is implementing Service Cloud Voice with Amazon Connect. The administrator created a new sandbox for testing. What should the administrator expect with regard to the new sandbox configurations?","o":["The AWS Account and contact centers are copied automatically when the sandbox is created, but voice call data is not.","A new AWS Account is automatically created, but the contact center and voice call data are not copied into the new sandbox.","The AWS Account, contact centers, and voice call data are copied automatically when the sandbox is created."],"a":1,"x":["Core ask of the scenario:","Service Cloud Voice connects to Amazon Connect (an AWS service), which lives outside of Salesforce itself.","When a new sandbox is created, some setup gets copied automatically and some doesn't.","The question asks: exactly what carries over automatically into the new sandbox, and what doesn't?","Example: it's like cloning a phone's apps but not its saved call history — some things copy over, some don't.","The correct answer is A new AWS Account is automatically created, but the contact center and voice call data are not copied into the new sandbox.","Why This Is Correct","When a sandbox is created for a Service Cloud Voice with Amazon Connect org, Salesforce automatically provisions a brand-new, separate AWS account for that sandbox.","However, the actual Contact Center configuration and any existing voice call data are tied to the original AWS account and are not automatically copied over.","This means the administrator has to manually reconfigure the Contact Center setup in the new sandbox, since it starts essentially from a clean AWS environment.","Why the Other Options Are Incorrect","The AWS Account and contact centers are copied, but voice call data is not: this is incorrect because the AWS account is actually newly created (not copied), and the contact center setup is not carried over either.","Everything (AWS Account, contact centers, and voice call data) is copied automatically: this is incorrect because a sandbox refresh does not replicate the external AWS contact center configuration or call recordings/data at all.","Reference:","Service Cloud Voice and Sandboxes – Salesforce Help"]},{"id":"E2-43","exam":2,"n":43,"q":"Sunrays Limited (SL) frequently receives complex customer issues that require retrieving information from several knowledge articles not tagged with individual fields. SL needs a service that can process this data and provide accurate, practical responses. What should the Service Cloud Consultant recommend?","o":["Agentforce for Service and Agentforce Data Library.","Einstein Bots and Article Answers feature.","Apex layer that fetches data in real-time from multiple data sources."],"a":0,"x":["Core ask of the scenario:","Some customer issues are complex and need answers pulled together from several knowledge articles, not just one neatly tagged field. The company needs a service that can read through this unstructured content and give accurate, usable answers.","The question asks: what should be recommended to handle this kind of multi-article, AI-driven knowledge retrieval?","Example: it's like asking a well-read librarian a tricky question — they read across several books to piece together one clear, accurate answer.","The correct answer is Agentforce for Service and Agentforce Data Library.","Why This Is Correct","Agentforce Data Library is designed to ground AI responses in large bodies of unstructured content, like Knowledge articles, even when that content isn't neatly tagged or broken into individual fields.","Agentforce for Service can then use that grounded data to generate accurate, practical responses for complex customer issues, pulling relevant information from across multiple sources.","Together, they handle exactly the kind of \"search and synthesize across many articles\" need described, rather than relying on a single structured data lookup.","Why the Other Options Are Incorrect","Einstein Bots and Article Answers feature: Einstein Bots are built for structured conversation flows, and Article Answers works well for single, well- tagged articles, but neither is designed to synthesize answers across many untagged articles the way a data library approach does. Apex layer that fetches data in real-time from multiple data sources: this is a heavy, custom-built, code-based solution — it would require significant development effort when Agentforce already provides a native way to ground responses in this kind of content.","Reference:","Agentforce Data Library – Salesforce Help"]},{"id":"E2-44","exam":2,"n":44,"q":"Sunrays Limited (SL) frequently works with distribution partners who have complex issues that need immediate attention. To solve the issues, Tier 2 support often needs to engage other teams within the organization. The team uses Slack to communicate internally. Which solution should the consultant recommend to meet the needs of the organization?","o":["Case escalation","Swarming","Omni-Channel routing"],"a":1,"x":["Core ask of the scenario:","Tricky partner issues often need Tier 2 support to pull in people from several other teams, fast.","The team already uses Slack internally, so the solution should fit naturally with that existing habit.","The question asks: what solution brings multiple teams together quickly on a complex issue, using Slack?","Example: it's like calling an emergency huddle in a group chat the moment a tough issue comes in, instead of emailing each team separately and waiting.","The correct answer is Swarming.","Why This Is Correct","Case Swarming is built to quickly bring together the right people from different teams into a dedicated Slack channel tied to the case. Since the organization already uses Slack internally, Swarming fits naturally into their existing workflow instead of introducing a new communication tool.","This matches the scenario exactly: Tier 2 support needing to pull in multiple other teams for complex, urgent partner issues, all in one connected conversation.","Why the Other Options Are Incorrect","Case escalation: this reassigns or alerts based on a case taking too long, but it doesn't actively pull together multiple teams into one live conversation to solve a complex issue.","Omni-Channel routing: this routes incoming work to a single available agent based on rules and skills; it doesn't bring multiple teams together to collaborate on one difficult case.","Reference:","Case Swarming – Salesforce Help"]},{"id":"E2-45","exam":2,"n":45,"q":"A consultant has been asked to advise Sunrays Limited (SL) on how to manage 5 years of case data so it is available to customers upon request. Which feature will help SL users archive and access the case information from an External Object?","o":["Salesforce Big Object.","Salesforce CaseHistory Object","Salesforce Connect"],"a":2,"x":["Core ask of the scenario:","5 years of old case data is piling up, and the company wants to keep it available to customers without cluttering live Salesforce storage. The question specifically says the data should be accessed from an \"External Object,\" meaning it lives outside Salesforce's own database.","The question asks: which feature connects to and displays that externally archived data inside Salesforce?","Example: it's like viewing old photos stored in a cloud drive right inside your photo app, without actually re-downloading and storing every photo on your phone.","The correct answer is Salesforce Connect.","Why This Is Correct","Salesforce Connect is specifically built to represent data that lives in an external system as an External Object inside Salesforce. This lets Sunrays Limited archive 5 years of older case data outside of core Salesforce storage, while still letting users view and search it as if it were a normal Salesforce object.","Because it's read live from the external source, there's no need to physically copy and store all that historical data inside Salesforce, which keeps storage costs down.","Why the Other Options Are Incorrect","Salesforce Big Object: Big Objects store very large volumes of data directly inside Salesforce, not in an external system — the question specifically asks about accessing data from an External Object, which is Salesforce Connect's role.","Salesforce CaseHistory Object: this standard object tracks field-level changes on cases for audit purposes; it isn't a mechanism for archiving and accessing externally stored historical case data.","Reference:","Salesforce Connect – Salesforce Help"]},{"id":"E2-46","exam":2,"n":46,"q":"Sunrays Limited (SL) is in the process of setting up Experience Cloud. SL needs to give customers access to their agreed upon response times via the portal. Which solution should a consultant recommend?","o":["Maintenance Plans","Milestones","Service Contracts"],"a":1,"x":["Core ask of the scenario:","Customers were promised specific response times, and now they should be able to see that info themselves on the self-service portal.","The question asks: which feature represents those agreed response times in a way that can be shown to the customer?","Example: it's like a delivery app showing the customer \"expected response by 3 PM\" right on their order screen.","The correct answer is Milestones.","Why This Is Correct","Milestones are the specific, time-based steps (like \"First Response Time\") defined within an Entitlement process — they're exactly what represents an agreed response time.","Milestone information can be exposed on an Experience Cloud site, letting customers see their case's response-time commitments directly in the portal.","Because Milestones already carry the actual time commitment data, they are the most direct and accurate way to show customers what was agreed.","Why the Other Options Are Incorrect","Maintenance Plans: these are used to schedule recurring maintenance work orders for assets, which is unrelated to showing a customer their support response-time commitments.","Service Contracts: these define the overall terms of the support agreement, but the specific, trackable response-time commitment itself is captured at the Milestone level, not directly on the contract.","Reference:","Entitlement Management and Milestones – Salesforce Help"]},{"id":"E2-47","exam":2,"n":47,"q":"Sunrays Limited (SL) is planning to provide different levels of support to customers in order to ensure its agents are working within the confines of the service-level agreements (SLAs). Which feature should the consultant consider?","o":["Case Management","Entitlements","Service Contracts"],"a":1,"x":["Core ask of the scenario:","Not every customer gets the same level of support — the company wants different support tiers that respect SLA promises.","The question asks: what feature helps set up and enforce these different support levels?","Example: it's like a store offering \"Gold,\" \"Silver,\" and \"Basic\" membership tiers, each with its own promised level of service.","The correct answer is Entitlements.","Why This Is Correct","Entitlements define exactly what level of support a specific account or contact is eligible for, which is the foundation for offering different support tiers.","They work together with Milestones to enforce SLA-related time commitments within each support level, keeping agents operating within the promised terms.","This gives the consultant a flexible, native way to configure multiple support levels without building anything custom.","Why the Other Options Are Incorrect","Case Management: this is the general process of tracking and resolving cases, but on its own it doesn't define or enforce different tiers of support eligibility.","Service Contracts: these record the overall terms a customer has purchased, but the actual eligibility and SLA enforcement for different support levels comes from Entitlements layered underneath.","Reference:","Entitlement Management Overview – Salesforce Help"]},{"id":"E2-48","exam":2,"n":48,"q":"Which approach should a Service Cloud Consultant use to ensure that Lightning Knowledge searches only display articles for a service rep’s product specialization?","o":["Use article record types to restrict access for service reps by page layout assignment.","Create a data category for each product specialization. Assign data categories using permission sets.","Configure a private sharing model for Knowledge. Grant access to service reps through manual or group- based sharing rules."],"a":1,"x":["Core ask of the scenario:","Different service reps specialize in different products, and their Knowledge search results should match their specialty.","The question asks: what's the right way to make article search results depend on a rep's product specialization?","Example: it's like a mechanic specializing in electric cars only seeing electric-car repair guides pop up in search, not gas-engine manuals.","The correct answer is Create a data category for each product specialization, and assign data categories using permission sets.","Why This Is Correct","Data categories are the native Salesforce Knowledge mechanism for classifying articles by topic, such as by product specialization. Assigning data category group visibility through permission sets lets a consultant control exactly which category of articles each rep's search results and views are limited to.","This is a clean, scalable, out-of-the-box approach — new reps just get the matching permission set, and their search automatically reflects their specialization.","Why the Other Options Are Incorrect","Use article record types to restrict access by page layout assignment: record types and page layouts control what fields and layout a user sees on an article, but they don't actually filter which articles show up in search results.","Configure a private sharing model with manual or group-based sharing rules: Knowledge articles aren't filtered by the standard sharing rule model the way other objects are; data categories are the purpose-built tool for this kind of content-based visibility.","Reference:","Data Categories – Salesforce Help"]},{"id":"E2-49","exam":2,"n":49,"q":"Sunrays Limited (SL) is implementing Service Cloud within its North America call center to validate key use cases, system capabilities, and integration patterns. The SL leadership team is concerned that the upcoming Salesforce Release schedule may impact the implementation project’s development efforts. What should a Service Cloud Consultant recommend that SL’s Salesforce Admin
