ntroduces unnecessary complexity, data silos, and integration overhead instead of enabling seamless collaboration.","Reference:","Case Teams – Salesforce Help"]},{"id":"E4-60","exam":4,"n":60,"q":"Cloud Kicks has regional support managers who each need to see case metrics and KPIs only for their own region, and new regions are added periodically as the business grows. What should a consultant recommend to meet this requirement in a scalable way?","o":["Build a separate static dashboard for every region and update them manually","Create a Dynamic Dashboard so each manager sees data filtered to their own region automatically","Give every regional manager System Administrator access to see all dashboards"],"a":1,"x":["Core ask of the scenario:","Regional managers should each see only their own region's metrics.","New regions are added over time.","Example: like one report page that shows each person only their own area.","So the question is: how do you provide region-specific dashboards in a scalable way?","Correct Answer: Create a Dynamic Dashboard so each manager sees data filtered to their own region automatically","Why This Is Correct","A Dynamic Dashboard runs using the viewing user's own record access, so each regional manager automatically sees only their region's data without needing separate dashboards.","This approach scales cleanly as new regions are added, since no additional dashboards need to be built or maintained.","Why the Other Options Are Incorrect","Option A is incorrect: Building and manually maintaining a separate static dashboard per region is not scalable and creates ongoing administrative overhead.","Option C is incorrect: Granting System Administrator access is a major security risk and gives managers far more access than needed just to view regional metrics.","Reference:","Dynamic Dashboards – Salesforce Help"]},{"id":"E4-61","exam":4,"n":61,"q":"Cloud Kicks implements a workforce management system to forecast staffing needs and schedule service reps across shifts. What metric should a consultant recommend Cloud Kicks track to measure the success of the workforce management system?","o":["Service rep utilization","Total marketing spend","Number of products sold"],"a":0,"x":["Core ask of the scenario:","The company uses a workforce management system to plan staffing and schedules.","It wants a metric to show whether it works.","Example: like checking how well staff time is used compared to the work available.","So the question is: which metric measures the success of workforce management?","Correct Answer: Service rep utilization","Why This Is Correct","Service rep utilization measures how effectively scheduled staff time is used relative to actual workload, which is the core purpose of a workforce management system.","Tracking utilization helps Cloud Kicks validate that forecasting and scheduling are balancing staffing levels with case volume and reducing over- or under-staffing.","Why the Other Options Are Incorrect","Option B is incorrect: Marketing spend is unrelated to workforce scheduling or staffing efficiency in a service organization.","Option C is incorrect: Number of products sold is a sales metric, not a measure of service staffing or scheduling effectiveness.","Reference:","Workforce Engagement – Salesforce Help"]},{"id":"E4-62","exam":4,"n":62,"q":"Cloud Kicks relies on the standard Case Age field for reporting, but the field is not calculating correctly for their reporting needs because closed cases stop aging while management wants to measure total elapsed time regardless of status. What should a consultant recommend?","o":["Create a custom formula field to calculate the case age based on creation date and current or closed date","Ask agents to manually update the Case Age field before closing a case","Remove the Case Age field from all page layouts and reports"],"a":0,"x":["Core ask of the scenario:","The standard Case Age field stops counting when a case is closed.","Management wants total elapsed time regardless of status.","Example: like a stopwatch that keeps running even after the case closes.","So the question is: how do you calculate the age the way management needs it?","Correct Answer: Create a custom formula field to calculate the case age based on creation date and current or closed date","Why This Is Correct","A custom formula field can be built to always calculate elapsed time using CreatedDate compared to either the current date or the ClosedDate, giving management the total elapsed time metric they need regardless of status.","This approach is declarative, reportable, and doesn't rely on the standard Case Age behavior, which stops incrementing once a case is closed.","Why the Other Options Are Incorrect","Option B is incorrect: Manual updates are unreliable, inconsistent, and not scalable for accurate reporting.","Option C is incorrect: Removing the field entirely eliminates a data point rather than fixing the calculation to meet the actual reporting requirement.","Reference:","Build Formula Fields – Salesforce Help"]},{"id":"E4-63","exam":4,"n":63,"q":"A telecommunications company is planning a rollout of Agentforce to automate portions of its customer support process, and stakeholders have raised various concerns about the initiative before it begins. What should a consultant recommend to address these concerns proactively?","o":["Skip stakeholder concerns and proceed directly to a full production rollout","Conduct a risk register focusing on technical challenges, user adoption barriers, and impact on existing workflows while engaging key stakeholders early","Only involve the IT department in rollout planning and exclude business stakeholders"],"a":1,"x":["Core ask of the scenario:","A telecom company is rolling out Agentforce and stakeholders have concerns.","The consultant wants to address them before starting.","Example: like writing down risks and plans before building a bridge.","So the question is: how should concerns be handled proactively?","Correct Answer: Conduct a risk register focusing on technical challenges, user adoption barriers, and impact on existing workflows while engaging key stakeholders early","Why This Is Correct","A structured risk register captures technical, adoption, and workflow risks up front, giving the project team a clear view of what needs mitigation before rollout.","Engaging key stakeholders early builds buy-in and surfaces concerns proactively, reducing resistance and rework later in the Agentforce rollout.","Why the Other Options Are Incorrect","Option A is incorrect: Skipping stakeholder concerns and going straight to full production is a high-risk approach that ignores change management best practices.","Option C is incorrect: Excluding business stakeholders removes critical input on workflow impact and user adoption, both of which are essential for a successful rollout.","Reference:","Design a Successful Agentforce Implementation – Trailhead"]},{"id":"E4-64","exam":4,"n":64,"q":"Cloud Kicks adopts a Knowledge-Centered Support methodology across its service organization, encouraging agents to create and improve articles as they resolve cases. What benefit should a consultant highlight as a primary outcome of this KCS approach?","o":["Increased number of required approval steps for every article","A fixed article count target that must never change","Reduced issue resolution time as reusable knowledge accumulates and improves"],"a":2,"x":["Core ask of the scenario:","The company is adopting Knowledge-Centered Support (KCS).","Agents create and improve articles while solving cases.","Example: like writing down a recipe the first time so the next cook is faster.","So the question is: what is the main benefit of KCS?","Correct Answer: Reduced issue resolution time as reusable knowledge accumulates and improves","Why This Is Correct","KCS methodology captures knowledge at the point of resolution, building a growing library of reusable, continuously improved articles that agents can quickly apply to similar future cases.","This directly reduces resolution time over time since agents spend less time re-solving previously encountered issues from scratch.","Why the Other Options Are Incorrect","Option A is incorrect: KCS emphasizes a lightweight, collaborative improvement process rather than adding heavy approval overhead to every article.","Option B is incorrect: KCS is not about hitting a fixed article count; it's about capturing and refining useful knowledge as needed, which naturally grows and evolves over time.","Reference:","Knowledge-Centered Support – Salesforce Help"]},{"id":"E4-65","exam":4,"n":65,"q":"Cloud Kicks wants to explore integrating its Service Cloud org with Jira so that engineering can track defects raised from customer cases, and is evaluating AppExchange options before building a custom integration. What should a consultant recommend Cloud Kicks explore first?","o":["An AppExchange package for Incident Management and a package for Jira Connection","A fully custom Apex integration built entirely from scratch with no AppExchange research Exit Quiz Submit Quiz Powered By","Manually re-entering case details into Jira for every defect"],"a":0,"x":["Core ask of the scenario:","The company wants engineering to track defects raised from customer cases in Jira.","It wants to check AppExchange before building a custom integration.","Example: like looking in an app store before building your own app.","So the question is: what should the consultant explore first?","Correct Answer: An AppExchange package for Incident Management and a package for Jira Connection","Why This Is Correct","Salesforce Incident Management and dedicated Jira Connector packages on AppExchange are purpose-built to link Service Cloud cases with engineering defect tracking, reducing the need for custom development.","Evaluating existing AppExchange solutions first follows sound consulting practice of leveraging proven tools before investing in custom-built integrations.","Why the Other Options Are Incorrect","Option B is incorrect: Jumping straight to a fully custom integration without evaluating existing AppExchange options increases cost, development time, and long-term maintenance burden.","Option C is incorrect: Manual re-entry is inefficient, error-prone, and does not scale as case and defect volume grows.","Reference:","Jira Connector Apps – Salesforce AppExchange"]}];
const EXAMS = [1,2,3,4];
const BYID = Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));
const byExam = e => QUESTIONS.filter(q=>q.exam===e);
const LETTERS = ['A','B','C','D','E','F'];
const KEY = 'sfsim_v1';

/* ---------- storage ---------- */
function freshStore(){return {q:{},attempts:[],blocks:{},settings:{pass:67,minPerQ:1.75},active:null}}
let S;
try{ S = JSON.parse(localStorage.getItem(KEY)) || freshStore(); }catch(e){ S = freshStore(); }
S = Object.assign(freshStore(), S); S.settings = Object.assign(freshStore().settings, S.settings||{});
let STORAGE_OK=true; try{localStorage.setItem('sfsim_t','1');localStorage.removeItem('sfsim_t')}catch(e){STORAGE_OK=false}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function qStat(id){ return S.q[id] || null; }
function qState(id){ const s=S.q[id]; return !s ? 'new' : (s.last==='ok' ? 'ok' : 'ko'); }
function record(id, ok){
  const s = S.q[id] || {seen:0,ok:0,ko:0};
  s.seen++; ok ? s.ok++ : s.ko++; s.last = ok?'ok':'ko'; s.ts = Date.now();
  S.q[id] = s;
}
function examProgress(e){
  const qs = byExam(e); let ok=0,ko=0;
  qs.forEach(q=>{const st=qState(q.id); if(st==='ok')ok++; else if(st==='ko')ko++;});
  return {total:qs.length, ok, ko, seen:ok+ko, nw:qs.length-ok-ko};
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
function fmtTime(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0'); }
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function blocksOf(e){ const qs=byExam(e), out=[]; for(let i=0;i<qs.length;i+=10) out.push({key:`E${e}-B${i/10+1}`, idx:i/10+1, from:i+1, to:Math.min(i+10,qs.length), ids:qs.slice(i,i+10).map(q=>q.id)}); return out; }
function explHTML(q){
  return q.x.map(p=>{
    if(/^(Core ask of the scenario:?|Why This Is Correct:?|Why the Other Options Are Incorrect:?|Reference:?)$/.test(p)) return `<p class="h">${esc(p.replace(/:$/,''))}</p>`;
    if(/^(Correct Answer:|The correct answer is)/.test(p)) return `<p class="ca">${esc(p)}</p>`;
    if(/Salesforce (Help|Developers|Trailhead)|Trailhead$/.test(p) && p.length<120) return `<p class="ref">${esc(p)}</p>`;
    return `<p>${esc(p)}</p>`;
  }).join('');
}
function setTitle(t){ $('#title').textContent = t; document.title = t + ' · Simulador'; }

/* ---------- theme ---------- */
(function(){ let t=null; try{t=localStorage.getItem('sfsim_theme')}catch(e){} if(t) document.documentElement.dataset.theme=t; })();
$('#themeBtn').onclick=()=>{
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nx = cur==='dark'?'light':'dark'; document.documentElement.dataset.theme=nx; try{localStorage.setItem('sfsim_theme',nx)}catch(e){}
};

/* ---------- routing ---------- */
let view = {name:'home'};
let homeTab = 'full';
function go(v){ view = v; stopTick(); closeOverlay(); render(); window.scrollTo(0,0); }
function render(){
  const r = {home:renderHome, setup:renderSetup, exam:renderExam, results:renderResults, history:renderHistory, question:renderQuestion}[view.name];
  r();
}

/* ---------- HOME ---------- */
function renderHome(){
  setTitle('Simulador Consultant');
  const tot = QUESTIONS.length; let ok=0,ko=0; QUESTIONS.forEach(q=>{const s=qState(q.id); if(s==='ok')ok++; else if(s==='ko')ko++;});
  const act = S.active && !S.active.finished ? S.active : null;
  let h = STORAGE_OK ? '' : `<div class="card" style="border-color:var(--warn);background:var(--warn-soft);margin-bottom:12px"><b>⚠ Este navegador no permite guardar datos</b><div class="small">Tu progreso se perderá al cerrar. Ábrelo en Chrome, Edge o Firefox.</div></div>`;
  if(act){
    const answered = Object.keys(act.answers).length;
    h += `<div class="card" style="border-color:var(--brand);margin-bottom:6px"><div class="row"><div class="sp"><span class="pill br">En curso</span>
      <h3 style="margin-top:6px">${esc(act.title)}</h3><div class="muted small">${act.mode==='real'?'Modo real':'Modo práctica'} · ${answered}/${act.ids.length} respondidas</div></div>
      <button class="btn pri" onclick="resume()">Continuar</button><button class="btn sm ghost danger" onclick="discardActive()">Descartar</button></div></div>`;
  }
  h += `<div class="card"><div class="row"><div class="sp"><div class="muted small">Progreso global</div><div class="stat">${pct(ok+ko,tot)}% <span class="muted" style="font-size:15px;font-weight:500">vistas · ${ok+ko}/${tot}</span></div></div>
     <button class="btn sm" onclick="go({name:'history'})">Histórico →</button></div>
     <div class="bar" style="margin-top:12px"><i class="ok" style="width:${ok*100/tot}%"></i><i class="ko" style="width:${ko*100/tot}%"></i></div>
     <div class="row small muted" style="margin-top:8px"><span><b style="color:var(--ok)">${ok}</b> acertadas</span><span><b style="color:var(--ko)">${ko}</b> falladas</span><span><b>${tot-ok-ko}</b> nuevas</span></div></div>`;

  h += `<h2>Elige modo</h2><div class="seg" role="tablist">
    ${[['full','Examen completo'],['block','Bloques de 10'],['custom','Personalizado']].map(([k,l])=>`<button class="${homeTab===k?'on':''}" onclick="homeTab='${k}';renderHome()">${l}</button>`).join('')}
  </div><div style="margin-top:14px">`;

  if(homeTab==='full'){
    h += `<div class="grid g2">` + EXAMS.map(e=>{
      const p=examProgress(e); const best = bestAttempt('full','E'+e);
      return `<button class="card examcard" onclick="go({name:'setup',kind:'full',exam:${e}})">
        <div class="row"><h3 class="sp">Examen ${e}</h3><span class="pill">${p.total} preguntas</span></div>
        <div class="bar" style="margin:10px 0 8px"><i class="ok" style="width:${p.ok*100/p.total}%"></i><i class="ko" style="width:${p.ko*100/p.total}%"></i></div>
        <div class="small muted">${p.seen}/${p.total} vistas · <span style="color:var(--ok)">${p.ok} ✓</span> · <span style="color:var(--ko)">${p.ko} ✗</span>${best!=null?` · mejor: <b>${best}%</b>`:''}</div>
      </button>`;}).join('') + `</div>`;
  }
  if(homeTab==='block'){
    h += `<p class="muted small" style="margin-top:0">Siempre las mismas 10 preguntas, en orden. Verde = superado (≥ ${S.settings.pass}%), ámbar = intentado.</p>`;
    h += EXAMS.map(e=>`<div class="card" style="margin-bottom:12px"><h3>Examen ${e}</h3><div class="blocks">`+
      blocksOf(e).map(b=>{ const best=S.blocks[b.key]; const cls = best==null?'':(best>=S.settings.pass?'done':'part');
        return `<button class="blk ${cls}" onclick="go({name:'setup',kind:'block',exam:${e},block:${b.idx}})"><b>${b.from}–${b.to}</b><span>${best==null?'—':'mejor '+best+'%'}</span></button>`;}).join('')+
      `</div></div>`).join('');
  }
  if(homeTab==='custom'){ h += customForm(); }
  h += `</div>`;

  h += `<h2>Ajustes</h2><div class="card"><div class="grid g2 st">
     <label class="field"><span>Nota de aprobado (%)</span><input type="number" min="1" max="100" value="${S.settings.pass}" onchange="S.settings.pass=Math.min(100,Math.max(1,+this.value||67));save()"></label>
     <label class="field"><span>Minutos por pregunta (modo real)</span><input type="number" min="0.5" max="10" step="0.05" value="${S.settings.minPerQ}" onchange="S.settings.minPerQ=Math.max(0.25,+this.value||1.75);save()"></label>
   </div><p class="small muted" style="margin:10px 0 0">Examen oficial: 60 preguntas en 105 min (1,75 min/pregunta). El progreso se guarda en este navegador; usa exportar/importar para pasarlo a otro dispositivo.</p>
   <div class="row" style="margin-top:12px"><button class="btn sm" onclick="exportData()">Exportar progreso</button><button class="btn sm" onclick="importData()">Importar progreso</button><span class="sp"></span><button class="btn sm danger" onclick="resetAll()">Borrar todo</button></div></div>`;
  $('#app').innerHTML = h;
  if(homeTab==='custom') updateCustomCount();
}
function bestAttempt(kind,key){ const a=S.attempts.filter(x=>x.kind===kind&&x.key===key); return a.length?Math.max(...a.map(x=>x.pct)):null; }

let CF = {src:'all', nw:true, ko:true, ok:false, flagged:false, n:20, order:'rand'};
function customPool(){
  let pool = CF.src==='all' ? QUESTIONS : byExam(+CF.src);
  return pool.filter(q=>{ const s=qState(q.id); return (CF.nw&&s==='new')||(CF.ko&&s==='ko')||(CF.ok&&s==='ok'); });
}
function customForm(){
  return `<div class="card"><div class="grid g2 st">
    <label class="field"><span>Origen</span><select onchange="CF.src=this.value;updateCustomCount()">
      <option value="all" ${CF.src==='all'?'selected':''}>Todos los exámenes</option>${EXAMS.map(e=>`<option value="${e}" ${CF.src==e?'selected':''}>Examen ${e}</option>`).join('')}</select></label>
    <label class="field"><span>Nº de preguntas</span><input type="number" id="cfN" min="1" value="${CF.n}" oninput="CF.n=+this.value;updateCustomCount()"></label>
  </div>
  <div class="field" style="margin-top:14px"><span>Incluir preguntas…</span>
    <div class="grid g4">
      <label class="chk"><input type="checkbox" ${CF.nw?'checked':''} onchange="CF.nw=this.checked;updateCustomCount()">Nuevas</label>
      <label class="chk"><input type="checkbox" ${CF.ko?'checked':''} onchange="CF.ko=this.checked;updateCustomCount()">Falladas</label>
      <label class="chk"><input type="checkbox" ${CF.ok?'checked':''} onchange="CF.ok=this.checked;updateCustomCount()">Acertadas</label>
    </div></div>
  <div class="field" style="margin-top:14px"><span>Orden</span><div class="seg">
    <button class="${CF.order==='rand'?'on':''}" onclick="CF.order='rand';renderHome()">Aleatorio</button>
    <button class="${CF.order==='seq'?'on':''}" onclick="CF.order='seq';renderHome()">Por orden</button></div></div>
  <div class="row" style="margin-top:16px"><span class="muted small sp" id="cfInfo"></span>
    <button class="btn pri" id="cfGo" onclick="startCustomSetup()">Continuar</button></div></div>
  <div class="row" style="margin-top:12px">
    <button class="btn sm" onclick="Object.assign(CF,{nw:false,ko:true,ok:false,n:999});startCustomSetup()">⚡ Repasar todas las falladas</button>
    <button class="btn sm" onclick="Object.assign(CF,{src:'all',nw:true,ko:true,ok:true,n:60,order:'rand'});startCustomSetup()">⚡ Simulacro 60 aleatorias</button>
  </div>`;
}
function updateCustomCount(){
  const avail = customPool().length; const n = Math.min(Math.max(1,CF.n||1), avail);
  const info = $('#cfInfo'); if(!info) return;
  info.textContent = avail ? `${avail} disponibles con estos filtros · se usarán ${n}` : 'No hay preguntas con estos filtros';
  $('#cfGo').disabled = !avail;
}
function startCustomSetup(){
  const pool = customPool(); if(!pool.length){ toast('No hay preguntas con esos filtros'); return; }
  const n = Math.min(Math.max(1,CF.n||1), pool.length);
  const ids = (CF.order==='rand'?shuffle(pool):pool).slice(0,n).map(q=>q.id);
  const parts=[]; if(CF.nw)parts.push('nuevas'); if(CF.ko)parts.push('falladas'); if(CF.ok)parts.push('acertadas');
  go({name:'setup',kind:'custom',ids,title:`Personalizado · ${n} preg. (${CF.src==='all'?'todos':'Ex. '+CF.src}, ${parts.join('/')})`});
}

/* ---------- SETUP (choose real/practice) ---------- */
function renderSetup(){
  let ids,title,key;
  if(view.kind==='full'){ ids=byExam(view.exam).map(q=>q.id); title=`Examen ${view.exam} completo`; key='E'+view.exam; }
  else if(view.kind==='block'){ const b=blocksOf(view.exam)[view.block-1]; ids=b.ids; title=`Examen ${view.exam} · preguntas ${b.from}–${b.to}`; key=b.key; }
  else { ids=view.ids; title=view.title; key='custom'; }
  view.ids=ids; view.title=title; view.key=key;
  const mins = Math.ceil(ids.length*S.settings.minPerQ);
  setTitle(title);
  let ok=0,ko=0; ids.forEach(id=>{const s=qState(id); if(s==='ok')ok++; else if(s==='ko')ko++;});
  $('#app').innerHTML = `<button class="btn sm ghost" onclick="go({name:'home'})">← Volver</button>
  <h2 style="margin-top:10px">${esc(title)}</h2>
  <div class="card"><div class="row small muted"><span>${ids.length} preguntas</span>·<span style="color:var(--ok)">${ok} acertadas</span>·<span style="color:var(--ko)">${ko} falladas</span>·<span>${ids.length-ok-ko} nuevas</span></div></div>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><h3>⏱ Modo real</h3><p class="muted small">Simulador del examen oficial: cronómetro de <b>${fmtTime(mins*60)}</b>, sin ver respuestas hasta el final. Puedes marcar preguntas para revisar, saltarlas y volver. Nota de corte ${S.settings.pass}%.</p>
      <button class="btn pri" style="width:100%" onclick="startSession('real')">Empezar en modo real</button></div>
    <div class="card"><h3>📖 Modo práctica</h3><p class="muted small">Ves si aciertas y la explicación completa justo después de responder cada pregunta. Sin límite de tiempo.</p>
      <button class="btn" style="width:100%" onclick="startSession('practice')">Empezar en modo práctica</button></div>
  </div>`;
}
function startSession(mode){
  if(S.active && !S.active.finished && !confirm('Hay un examen en curso. ¿Descartarlo y empezar uno nuevo?')) return;
  const now=Date.now();
  S.active = {kind:view.kind, key:view.key, title:view.title, mode, ids:view.ids.slice(), answers:{}, flags:{}, revealed:{}, cur:0,
    start:now, duration: mode==='real'? Math.ceil(view.ids.length*S.settings.minPerQ)*60 : 0, endAt: mode==='real'? now+Math.ceil(view.ids.length*S.settings.minPerQ)*60000 : 0, finished:false};
  save(); go({name:'exam'});
}
function resume(){ go({name:'exam'}); }
function discardActive(){ if(confirm('¿Descartar el examen en curso? No se guardará el resultado.')){ S.active=null; save(); renderHome(); } }

/* ---------- EXAM ---------- */
let tick=null;
function stopTick(){ if(tick){clearInterval(tick); tick=null;} }
function renderExam(){
  const A = S.active; if(!A){ go({name:'home'}); return; }
  setTitle(A.title);
  const id = A.ids[A.cur], q = BYID[id], sel = A.answers[id];
  const revealed = A.mode==='practice' && A.revealed[id];
  const answered = Object.keys(A.answers).length;
  let h = `<div class="qhead">
    <span class="pill ${A.mode==='real'?'br':''}">${A.mode==='real'?'Modo real':'Práctica'}</span>
    <b>Pregunta ${A.cur+1} <span class="muted">/ ${A.ids.length}</span></b>
    <span class="sp"></span>
    ${A.mode==='real'?`<span class="timer" id="timer">--:--</span>`:`<span class="timer" id="timer" title="Tiempo transcurrido">--:--</span>`}
  </div>
  <div class="bar" style="margin-bottom:16px"><i class="ok" style="width:${answered*100/A.ids.length}%;background:var(--brand)"></i></div>
  <div class="small muted">Examen ${q.exam} · Q${q.n}${A.flags[id]?' · <span style="color:var(--warn)">⚑ marcada para revisar</span>':''}</div>
  <div class="qtext">${esc(q.q)}</div>
  <div class="opts">` + q.o.map((o,i)=>{
      let cls=''; if(revealed){ if(i===q.a)cls='right'; else if(i===sel)cls='wrong'; } else if(sel===i) cls='sel';
      return `<button class="opt ${cls}" ${revealed?'disabled':''} onclick="pick(${i})"><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></button>`;
    }).join('') + `</div>`;
  if(A.mode==='practice'){
    if(revealed){
      const ok = sel===q.a;
      h += `<div class="verdict ${ok?'ok':'ko'}">${ok?'✓ ¡Correcto!':'✗ Incorrecto — la respuesta correcta es '+LETTERS[q.a]}</div><div class="expl">${explHTML(q)}</div>`;
    } else if(sel!=null){
      h += `<div class="row" style="margin-top:14px"><button class="btn pri" onclick="checkAnswer()">Comprobar respuesta</button></div>`;
    }
  }
  $('#app').innerHTML = h;
  const last = A.cur===A.ids.length-1;
  let nav = `<div class="navbar"><div class="in">
    <button class="btn" onclick="move(-1)" ${A.cur===0?'disabled':''} aria-label="Anterior">←</button>
    <button class="btn flag ${A.flags[id]?'on':''}" onclick="toggleFlag()" title="Marcar para revisar">⚑<span class="small">Revisar</span></button>
    <button class="btn" onclick="openGrid()">☰ <span class="small">${answered}/${A.ids.length}</span></button>
    ${last ? `<button class="btn pri" onclick="trySubmit()">Terminar</button>` : `<button class="btn pri" onclick="move(1)" aria-label="Siguiente">→</button>`}
  </div></div>`;
  $('#app').insertAdjacentHTML('beforeend', nav);
  startTick();
}
function startTick(){
  stopTick();
  const upd=()=>{
    const A=S.active, t=$('#timer'); if(!A||!t) return;
    if(A.mode==='real'){
      const left=(A.endAt-Date.now())/1000; t.textContent='⏱ '+fmtTime(left); t.classList.toggle('low', left<300);
      if(left<=0){ stopTick(); toast('Se acabó el tiempo'); finish(); }
    } else t.textContent=fmtTime((Date.now()-A.start)/1000);
  };
  upd(); tick=setInterval(upd,1000);
}
function pick(i){
  const A=S.active, id=A.ids[A.cur]; if(A.mode==='practice' && A.revealed[id]) return;
  A.answers[id]=i; save();
  if(A.mode==='practice'){ checkAnswer(); } else renderExam();
}
function checkAnswer(){
  const A=S.active, id=A.ids[A.cur]; if(A.answers[id]==null||A.revealed[id]) return;
  A.revealed[id]=true; record(id, A.answers[id]===BYID[id].a); save(); renderExam();
}
function move(d){ const A=S.active; A.cur=Math.min(A.ids.length-1,Math.max(0,A.cur+d)); save(); renderExam(); window.scrollTo(0,0); }
function jump(i){ S.active.cur=i; save(); closeOverlay(); renderExam(); window.scrollTo(0,0); }
function toggleFlag(){ const A=S.active,id=A.ids[A.cur]; if(A.flags[id]) delete A.flags[id]; else A.flags[id]=1; save(); renderExam(); }
function openGrid(){
  const A=S.active, answered=Object.keys(A.answers).length, flagged=Object.keys(A.flags).length;
  const filt = view.gridFilter||'all';
  const idxs = A.ids.map((id,i)=>i).filter(i=>{const id=A.ids[i]; return filt==='all'||(filt==='un'&&A.answers[id]==null)||(filt==='fl'&&A.flags[id]);});
  $('#overlay').innerHTML = `<div class="drawer" onclick="if(event.target===this)closeOverlay()"><div class="panel">
    <div class="row"><h3 class="sp">Navegación</h3><button class="btn sm ghost" onclick="closeOverlay()">✕</button></div>
    <div class="tabs" style="margin-top:8px">
      <button class="${filt==='all'?'on':''}" onclick="view.gridFilter='all';openGrid()">Todas (${A.ids.length})</button>
      <button class="${filt==='un'?'on':''}" onclick="view.gridFilter='un';openGrid()">Sin responder (${A.ids.length-answered})</button>
      <button class="${filt==='fl'?'on':''}" onclick="view.gridFilter='fl';openGrid()">Marcadas (${flagged})</button></div>
    <div class="legend"><span><i style="background:var(--brand-soft);border-color:var(--brand)"></i>Respondida</span><span><i></i>Sin responder</span><span><i style="background:var(--warn);border-color:var(--warn);border-radius:50%"></i>Marcada</span></div>
    <div class="qgrid">${idxs.map(i=>{const id=A.ids[i]; let c=[]; if(A.mode==='practice'&&A.revealed[id]) c.push(A.answers[id]===BYID[id].a?'r-ok':'r-ko'); else if(A.answers[id]!=null)c.push('ans'); if(A.flags[id])c.push('flg'); if(i===A.cur)c.push('cur');
      return `<button class="${c.join(' ')}" onclick="jump(${i})">${i+1}</button>`;}).join('') || '<span class="muted small">Ninguna</span>'}</div>
    <div class="row" style="margin-top:18px"><span class="sp"></span><button class="btn pri" onclick="trySubmit()">Terminar examen</button></div>
  </div></div>`;
}
function closeOverlay(){ $('#overlay').innerHTML=''; }
function trySubmit(){
  const A=S.active, un=A.ids.filter(id=>A.answers[id]==null).length, fl=Object.keys(A.flags).length;
  const pending = A.mode==='practice' ? A.ids.filter(id=>!A.revealed[id]).length : un;
  let msg = '';
  if(pending) msg += `<p>Tienes <b>${pending}</b> pregunta${pending>1?'s':''} sin ${A.mode==='practice'?'comprobar':'responder'} (contarán como falladas en la nota).</p>`;
  if(fl) msg += `<p>Tienes <b>${fl}</b> pregunta${fl>1?'s':''} marcada${fl>1?'s':''} para revisar.</p>`;
  if(!msg) msg = '<p>Has respondido todas las preguntas.</p>';
  $('#overlay').innerHTML = `<div class="modal"><div class="card"><h3>¿Terminar el examen?</h3>${msg}
    <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" onclick="closeOverlay()">Seguir</button><button class="btn pri" onclick="finish()">Terminar y corregir</button></div></div></div>`;
}
function finish(){
  const A=S.active; if(!A||A.finished) return;
  stopTick(); closeOverlay();
  let correct=0;
  A.ids.forEach(id=>{
    const ans=A.answers[id], ok = ans===BYID[id].a; if(ok) correct++;
    if(A.mode==='real' && ans!=null) record(id, ok);
    if(A.mode==='practice' && ans!=null && !A.revealed[id]){ record(id, ok); A.revealed[id]=true; }
  });
  const p = pct(correct, A.ids.length);
  const secs = Math.round((Math.min(Date.now(), A.endAt||Infinity) - A.start)/1000);
  const att = {ts:Date.now(), kind:A.kind, key:A.key, title:A.title, mode:A.mode, total:A.ids.length, correct, pct:p, secs,
    answered:Object.keys(A.answers).length, ids:A.ids, answers:A.answers, flags:A.flags};
  S.attempts.unshift(att); if(S.attempts.length>200) S.attempts.length=200;
  if(A.kind==='block'){ S.blocks[A.key] = Math.max(S.blocks[A.key]??0, p); }
  A.finished=true; S.active=null; save();
  go({name:'results', att:0, filt:'all'});
}

/* ---------- RESULTS ---------- */
function renderResults(){
  const R = S.attempts[view.att]; if(!R){ go({name:'home'}); return; }
  setTitle('Resultado');
  const pass = R.pct>=S.settings.pass;
  const wrong = R.ids.filter(id=>R.answers[id]!=null && R.answers[id]!==BYID[id].a), un = R.ids.filter(id=>R.answers[id]==null);
  const fl = R.ids.filter(id=>R.flags&&R.flags[id]);
  const f = view.filt||'all';
  const list = {all:R.ids, ko:wrong, un, fl, ok:R.ids.filter(id=>R.answers[id]===BYID[id].a)}[f];
  let h = `<button class="btn sm ghost" onclick="go({name:'home'})">← Inicio</button>
  <div class="card" style="text-align:center;margin-top:10px">
    <div class="muted small">${esc(R.title)} · ${R.mode==='real'?'Modo real':'Práctica'} · ${fmtDate(R.ts)}</div>
    <div class="big ${pass?'res-pass':'res-fail'}" style="margin:14px 0 6px">${R.pct}%</div>
    <div style="font-weight:700" class="${pass?'res-pass':'res-fail'}">${pass?'APROBADO':'SUSPENSO'} <span class="muted" style="font-weight:500">(corte ${S.settings.pass}%)</span></div>
    <div class="row" style="justify-content:center;margin-top:12px;gap:16px" class="small">
      <span><b style="color:var(--ok)">${R.correct}</b> correctas</span><span><b style="color:var(--ko)">${wrong.length}</b> incorrectas</span><span><b>${un.length}</b> sin responder</span><span>⏱ ${fmtTime(R.secs)}</span></div>
    <div class="row" style="justify-content:center;margin-top:14px">
      ${wrong.length+un.length?`<button class="btn sm" onclick="retryIds(${view.att})">Repetir falladas (${wrong.length+un.length})</button>`:''}
      <button class="btn sm" onclick="retryAll(${view.att})">Repetir este examen</button></div>
  </div>
  <h2>Revisión</h2>
  <div class="tabs">${[['all','Todas',R.ids.length],['ko','Incorrectas',wrong.length],['un','Sin responder',un.length],['fl','Marcadas',fl.length],['ok','Correctas',R.correct]].map(([k,l,n])=>`<button class="${f===k?'on':''}" onclick="view.filt='${k}';renderResults()">${l} (${n})</button>`).join('')}</div>
  <div class="list">`;
  h += list.map(id=>{
    const q=BYID[id], a=R.answers[id], ok=a===q.a, open = view.open===id;
    return `<div class="card" style="padding:12px 14px">
      <button class="li" style="border:0;padding:0;background:none" onclick="view.open=${open?'null':`'${id}'`};renderResults()">
        <span class="dot ${a==null?'':(ok?'ok':'ko')}"></span><span class="n">#${R.ids.indexOf(id)+1}</span><span class="t">${esc(q.q)}</span><span class="muted">${open?'▴':'▾'}</span></button>
      ${open?`<div style="margin-top:12px"><div class="qtext" style="font-size:16px">${esc(q.q)}</div><div class="opts">${q.o.map((o,i)=>`<div class="opt ${i===q.a?'right':(i===a?'wrong':'')}"><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></div>`).join('')}</div>
        ${a==null?'<div class="verdict ko">Sin responder</div>':''}<div class="expl">${explHTML(q)}</div></div>`:''}
    </div>`;}).join('') || '<p class="muted">Nada que mostrar.</p>';
  h += `</div>`;
  $('#app').innerHTML = h;
}
function retryIds(i){ const R=S.attempts[i]; const ids=R.ids.filter(id=>R.answers[id]!==BYID[id].a); go({name:'setup',kind:'custom',ids,title:`Repaso falladas · ${R.title}`}); }
function retryAll(i){ const R=S.attempts[i]; if(R.kind==='full') go({name:'setup',kind:'full',exam:+R.key.slice(1)}); else if(R.kind==='block'){ const m=R.key.match(/E(\d)-B(\d+)/); go({name:'setup',kind:'block',exam:+m[1],block:+m[2]}); } else go({name:'setup',kind:'custom',ids:R.ids.slice(),title:R.title}); }

/* ---------- HISTORY ---------- */
let HF = {exam:'all', st:'all'};
function renderHistory(){
  setTitle('Histórico');
  let h = `<button class="btn sm ghost" onclick="go({name:'home'})">← Inicio</button><h2 style="margin-top:10px">Progreso por examen</h2><div class="grid g2">`;
  h += EXAMS.map(e=>{const p=examProgress(e); const att=S.attempts.filter(a=>a.key.startsWith('E'+e)).length;
    return `<div class="card"><div class="row"><h3 class="sp">Examen ${e}</h3><b>${pct(p.seen,p.total)}%</b></div>
      <div class="bar" style="margin:10px 0"><i class="ok" style="width:${p.ok*100/p.total}%"></i><i class="ko" style="width:${p.ko*100/p.total}%"></i></div>
      <div class="grid g4 small" style="gap:6px;text-align:center">
        <div><div class="stat" style="font-size:19px">${p.seen}</div><span class="muted">vistas</span></div>
        <div><div class="stat" style="font-size:19px;color:var(--ok)">${p.ok}</div><span class="muted">acertadas</span></div>
        <div><div class="stat" style="font-size:19px;color:var(--ko)">${p.ko}</div><span class="muted">falladas</span></div>
        <div><div class="stat" style="font-size:19px">${p.nw}</div><span class="muted">nuevas</span></div></div>
      <div class="small muted" style="margin-top:8px">Acierto sobre vistas: <b>${pct(p.ok,p.seen)}%</b> · ${att} intento${att===1?'':'s'}</div></div>`;}).join('');
  h += `</div><h2>Intentos</h2>`;
  if(!S.attempts.length) h += `<div class="card muted">Aún no has terminado ningún examen.</div>`;
  else h += `<div class="card" style="padding:6px 10px;overflow-x:auto"><table class="hist"><tr><th>Fecha</th><th>Examen</th><th>Nota</th><th></th></tr>`+
    S.attempts.slice(0,60).map((a,i)=>`<tr><td class="small muted" style="white-space:nowrap">${fmtDate(a.ts)}</td><td>${esc(a.title)}<div class="small muted">${a.mode==='real'?'Real':'Práctica'} · ${a.correct}/${a.total} · ${fmtTime(a.secs)}</div></td>
      <td><span class="pill ${a.pct>=S.settings.pass?'ok':'ko'}">${a.pct}%</span></td><td><button class="btn sm" onclick="go({name:'results',att:${i},filt:'all'})">Ver</button></td></tr>`).join('')+`</table></div>`;

  h += `<h2>Preguntas</h2><div class="row" style="margin-bottom:10px"><select style="width:auto" onchange="HF.exam=this.value;renderHistory()">
    <option value="all">Todos los exámenes</option>${EXAMS.map(e=>`<option value="${e}" ${HF.exam==e?'selected':''}>Examen ${e}</option>`).join('')}</select></div>`;
  const pool = HF.exam==='all'?QUESTIONS:byExam(+HF.exam);
  const cnt = {all:pool.length, ok:0, ko:0, new:0}; pool.forEach(q=>cnt[qState(q.id)]++);
  h += `<div class="tabs">${[['all','Todas'],['ok','Acertadas'],['ko','Falladas'],['new','Sin contestar']].map(([k,l])=>`<button class="${HF.st===k?'on':''}" onclick="HF.st='${k}';renderHistory()">${l} (${cnt[k]})</button>`).join('')}</div><div class="list">`;
  h += pool.filter(q=>HF.st==='all'||qState(q.id)===HF.st).map(q=>{const s=qStat(q.id), st=qState(q.id);
    return `<button class="li" onclick="go({name:'question',id:'${q.id}'})"><span class="dot ${st==='new'?'':st}"></span><span class="n">E${q.exam}·${q.n}</span><span class="t">${esc(q.q)}</span>${s?`<span class="small muted" style="white-space:nowrap">${s.ok}✓ ${s.ko}✗</span>`:''}</button>`;}).join('') || '<p class="muted">Nada que mostrar.</p>';
  h += `</div>`;
  $('#app').innerHTML = h;
}
function renderQuestion(){
  const q=BYID[view.id], s=qStat(q.id); setTitle(`Examen ${q.exam} · Q${q.n}`);
  $('#app').innerHTML = `<button class="btn sm ghost" onclick="go({name:'history'})">← Histórico</button>
   <div class="card" style="margin-top:10px"><div class="row small muted"><span>Examen ${q.exam} · Pregunta ${q.n}</span><span class="sp"></span>
   ${s?`<span class="pill ${s.last==='ok'?'ok':'ko'}">Última: ${s.last==='ok'?'acertada':'fallada'}</span><span>${s.seen} vez/veces · ${s.ok}✓ ${s.ko}✗</span>`:'<span class="pill">Sin contestar</span>'}</div>
   <div class="qtext" style="margin-top:12px">${esc(q.q)}</div>
   <div class="opts">${q.o.map((o,i)=>`<div class="opt ${i===q.a?'right':''}"><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></div>`).join('')}</div>
   <div class="expl">${explHTML(q)}</div></div>`;
}

/* ---------- data mgmt ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify({...S, active:null})],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='progreso-simulador-sf.json'; document.body.appendChild(a); a.click(); a.remove();
}
function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.q||!d.attempts) throw 0; S=Object.assign(freshStore(),d); save(); toast('Progreso importado'); renderHome(); }catch(e){ toast('Archivo no válido'); } }; r.readAsText(f); };
  inp.click();
}
function resetAll(){ if(confirm('¿Borrar TODO el progreso e histórico? No se puede deshacer.')){ S=freshStore(); save(); renderHome(); } }
function toast(t){ const d=document.createElement('div'); d.textContent=t; d.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2)'; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(view.name!=='exam'||$('#overlay').innerHTML||e.target.tagName==='INPUT') return;
  const k=e.key.toLowerCase();
  const map={'1':0,'2':1,'3':2,'a':0,'b':1,'c':2};
  if(k in map && map[k]<BYID[S.active.ids[S.active.cur]].o.length) pick(map[k]);
  else if(k==='arrowright') move(1); else if(k==='arrowleft') move(-1);
  else if(k==='f') toggleFlag(); else if(k==='enter' && S.active.mode==='practice') { if(S.active.revealed[S.active.ids[S.active.cur]]) move(1); }
});

render();

/* ---------- offline (solo cuando se sirve por http/https) ---------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
</script>
