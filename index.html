<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Simulador SF">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Simulador Salesforce Consultant</title>
<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#eef2f8; --text:#16202e; --muted:#5b6778; --line:#d9e0ea;
  --brand:#0b5cab; --brand-ink:#ffffff; --brand-soft:#e3eefb;
  --ok:#1b7f4b; --ok-soft:#e1f4ea; --ko:#c23934; --ko-soft:#fbe6e5; --warn:#b26b00; --warn-soft:#fdf1dc;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131b; --surface:#161d28; --surface-2:#1d2633; --text:#e6ebf2; --muted:#9aa6b8; --line:#2a3546;
    --brand:#4c9bf0; --brand-ink:#08111d; --brand-soft:#16304f;
    --ok:#47c483; --ok-soft:#163626; --ko:#f0716b; --ko-soft:#3f1d1d; --warn:#f0b04c; --warn-soft:#3b2d14;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#161d28; --surface-2:#1d2633; --text:#e6ebf2; --muted:#9aa6b8; --line:#2a3546;
  --brand:#4c9bf0; --brand-ink:#08111d; --brand-soft:#16304f;
  --ok:#47c483; --ok-soft:#163626; --ko:#f0716b; --ko-soft:#3f1d1d; --warn:#f0b04c; --warn-soft:#3b2d14;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 96px}
header.top{position:sticky;top:0;padding-top:env(safe-area-inset-top);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:26px 0 10px;font-weight:650}
h3{margin:0 0 4px;font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.g2.st{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--ko)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px;}
.seg button{flex:1;border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);min-height:38px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)} .bar .ko{background:var(--ko)}
.stat{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:650;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.ko{background:var(--ko-soft);color:var(--ko)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.br{background:var(--brand-soft);color:var(--brand)}
.examcard{cursor:pointer;text-align:left;width:100%}
.examcard:hover{border-color:var(--brand)}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px}
.blk{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;text-align:center;min-height:58px}
.blk b{display:block;font-size:14px}
.blk span{font-size:12px;color:var(--muted)}
.blk.done{border-color:var(--ok);background:var(--ok-soft)}
.blk.part{border-color:var(--warn);background:var(--warn-soft)}
label.chk{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px;cursor:pointer}
label.chk input{width:18px;height:18px;accent-color:var(--brand)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13.5px;font-weight:600;color:var(--muted)}
input[type=number],select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface);min-height:44px;width:100%}
/* exam */
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:5px 10px;border-radius:9px;background:var(--surface-2)}
.timer.low{background:var(--ko-soft);color:var(--ko)}
.qtext{font-size:17.5px;line-height:1.55;margin:4px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .k{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ko);background:var(--ko-soft)}
.opt.wrong .k{background:var(--ko);border-color:var(--ko);color:#fff}
.opt:disabled{cursor:default;opacity:1}
.expl{margin-top:16px;border-left:3px solid var(--brand);background:var(--surface-2);border-radius:0 12px 12px 0;padding:12px 14px;font-size:15px}
.expl p{margin:0 0 8px}
.expl .h{font-weight:700;margin-top:12px;color:var(--brand)}
.expl .h:first-child{margin-top:0}
.expl .ca{font-weight:650;color:var(--ok)}
.expl .ref{font-style:italic;color:var(--muted)}
.verdict{display:flex;align-items:center;gap:8px;font-weight:700;margin-top:14px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--ko)}
.navbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:15;padding-bottom:env(safe-area-inset-bottom)}
.navbar .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center}
.navbar .btn{flex:1}
.navbar .btn.flag.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.qgrid button{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:40px;font-weight:600;font-size:14px;position:relative}
.qgrid button.ans{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.qgrid button.cur{outline:2px solid var(--text);outline-offset:1px}
.qgrid button.flg::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.qgrid button.r-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qgrid button.r-ko{background:var(--ko-soft);border-color:var(--ko);color:var(--ko)}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.drawer .panel{background:var(--surface);width:100%;max-width:860px;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:8px 0 14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid var(--line)}
.big{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.res-pass{color:var(--ok)} .res-fail{color:var(--ko)}
.list{display:grid;gap:8px}
.li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;width:100%}
.li .n{flex:none;font-weight:700;font-size:13px;color:var(--muted);min-width:46px}
.li .t{flex:1;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--line)}
.dot.ok{background:var(--ok)} .dot.ko{background:var(--ko)}
table.hist{width:100%;border-collapse:collapse;font-size:14px}
table.hist td,table.hist th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.hist th{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600;min-height:36px}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal .card{max-width:440px;width:100%}
.hide{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="logo">SF</div>
  <h1 id="title">Simulador Consultant</h1>
  <button class="btn sm ghost" id="themeBtn" title="Tema" aria-label="Cambiar tema">◐</button>
</div></header>
<main class="wrap" id="app"></main>
<div id="overlay"></div>

<script>
const QUESTIONS = [{"id":"E1-1","exam":1,"n":1,"q":"Support supervisors at Cloud Kicks want to view key performance indicators (KPIs) and see graphs and data about their company's Service Cloud Voice contact centers. How can they track call volume, average handle time, average speed to answer, and more metrics?","o":["Create a custom dashboard with reports on cases and service rep work.","Install a Service Cloud Reports package from the AppExchange.","Use the Service CRM Analytics app."],"a":2,"x":["Core ask of the scenario:","Supervisors run a phone support team (Service Cloud Voice) and want to see call numbers on a screen.","They need ready-made charts for things like how many calls came in, how long each call lasted, and how fast calls were picked up.","Example: it is like a car dashboard that already shows speed and fuel, so you do not have to build the gauges yourself.","So the question is: which Salesforce option gives these call KPIs with the least work?","Correct Answer: Use the Service CRM Analytics app.","The Service CRM Analytics app is a prebuilt CRM Analytics application made specifically for Service Cloud Voice contact centers. It ships as a managed package with dashboards and lenses that are already built, so supervisors don't have to design any reports or data models themselves.","It automatically tracks the exact metrics supervisors need, including call volume, average handle time, and average speed to answer, by pulling straight from Service Cloud Voice call data. That means the KPIs are accurate and consistent across the whole team from day one. Because it's a native Salesforce app rather than a custom build, it can be installed and configured quickly, and it stays aligned with future Service Cloud Voice enhancements without ongoing custom maintenance.","Why the Other Options Are Incorrect:","Option A is incorrect: Building a custom dashboard from case and work reports takes significant manual effort, and voice-specific metrics like average speed to answer are not readily available from standard case reports.","Option B is incorrect: There is no standard AppExchange package called \"Service Cloud Reports\"; the prebuilt reporting solution for Service Cloud Voice is the Service CRM Analytics app.","Reference:","Service Analytics App Dashboards and Datasets – Salesforce Help"]},{"id":"E1-2","exam":1,"n":2,"q":"Cloud Kicks (CK) uses Sales Dialer and one-click calling to initiate phone calls to customers. CK has recently received complaints from customers who have set their communication preferences to email only or text only. What is the most efficient solution the consultant should use to meet the requirements?","o":["Set the Contact Do Not Call field value to True.","Remove the phone number from the page layout.","Use Dynamic Forms to hide the phone number."],"a":0,"x":["Core ask of the scenario:","Some customers said they only want email or text, but reps still call them using the click-to-call buttons.","The company needs a simple way to stop calls to these customers.","Example: it is like a 'Do Not Disturb' sign on a hotel door that every staff member automatically respects.","So the question is: what is the easiest setting that blocks calls for those people?","Correct Answer: Set the Contact Do Not Call field value to True.","Setting the Do Not Call field to True on the Contact record is a native, declarative setting that Sales Dialer and one-click calling both automatically respect. As soon as it's set, the system itself will refuse to place outbound calls to that contact.","It solves the problem at the data level rather than the UI level, so it works no matter which page layout, app, or device the rep is using to place the call. There's nothing for a rep to remember or manually check.","It's also fully reversible and auditable: if a customer later changes their preference back to allowing calls, an admin or rep can simply flip the field again, and the change is tracked like any other field update.","Why the Other Options Are Incorrect:","Option B is incorrect: Removing the phone number from the page layout hides it for everyone including reps who legitimately need to see it, and does not actually stop Sales Dialer or one-click calling from dialing the number stored in the field.","Option C is incorrect: Dynamic Forms can hide a field visually, but it does not prevent Sales Dialer or one-click calling from placing a call using that number.","Reference:","Sales Dialer – Salesforce Help"]},{"id":"E1-3","exam":1,"n":3,"q":"A company is planning for the migration of an existing external knowledge base into Salesforce Knowledge. Which set of factors should be considered when selecting the articles to migrate?","o":["Original creation date and total number of article views in the last year","Last modified date and terms searched frequently in the last year","Last modified date and total number of article views in the last year"],"a":2,"x":["Core ask of the scenario:","The company is moving its old help articles into Salesforce Knowledge, and moving everything would waste time.","They need to decide which articles are worth moving.","Example: when moving house, you keep the things you still use and are in good shape, and you leave the old junk behind.","So the question is: which two facts help pick articles that are fresh and actually used?","Correct Answer: Last modified date and total number of article views in the last year","Why This Is Correct","The last modified date tells the team whether an article reflects current, accurate information. Articles that haven't been touched in years are far more likely to be outdated, even if the underlying product or process has since changed.","The total number of views in the last year tells the team whether customers are actually relying on that content. High-traffic articles are worth prioritizing for migration, while rarely viewed ones may not be worth the migration effort.","Together, these two factors let the company focus migration work on content that is both accurate and actively valuable, rather than wasting time recreating stale or unused articles in the new system.","Why the Other Options Are Incorrect","Option A is incorrect: Original creation date says nothing about whether an article is still accurate, since old articles can still be actively maintained.","Option B is incorrect: Search terms are useful for content gaps, but they don't tell you whether an existing article itself is worth migrating.","Reference:","Lightning Knowledge Migration Tool Features and Considerations – Salesforce Help"]},{"id":"E1-4","exam":1,"n":4,"q":"Universal Containers has implemented a call-based response system. The call wait time has become too long and customer service is being affected. Management would like to find a way to reduce customers' wait times and enable service reps to handle more inquiries at a time. Which feature should a consultant recommend?","o":["Case auto-response rule","Salesforce Messaging","Einstein Service Replies"],"a":1,"x":["Core ask of the scenario:","Customers are waiting too long on the phone, and each rep can only talk to one caller at a time.","Management wants shorter waits and reps who can help more people at once.","Example: texting lets you chat with several friends together, while a phone call only allows one person at a time.","So the question is: which feature moves customers off hold and lets reps handle several conversations?","Correct Answer: Salesforce Messaging","Why This Is Correct","Salesforce Messaging moves conversations off the voice queue entirely and into asynchronous text threads. Customers no longer have to wait on hold, because they can send a message and continue with their day while waiting for a reply.","Because messaging is asynchronous, a single rep can manage several conversations in parallel rather than being tied up on one phone call at a time. This directly increases how many inquiries the team can handle simultaneously.","It also reduces overall call volume hitting the phone queue in the first place, which shortens wait times for customers who still do call in, compounding the benefit across the whole contact center.","Why the Other Options Are Incorrect","Option A is incorrect: An auto-response rule only sends an automatic message on a case; it doesn't reduce call wait times or let one rep handle more inquiries simultaneously.","Option C is incorrect: Einstein Service Replies is not a real standalone Service Cloud feature for this purpose.","Reference:","Salesforce Messaging – Salesforce Help"]},{"id":"E1-5","exam":1,"n":5,"q":"Cloud Kicks has a Service Cloud implementation with several channels. Executives want quick access to service rep, team, and call center key performance indicators (KPIs). Service managers need to see data about their teams as well. How should the Service Cloud Consultant display the data quickly?","o":["Migrate the data to a data lake and request a dashboard.","Use the Service Analytics prebuilt dashboards in CRM Analytics.","Create reports from Cases and display on a dashboard."],"a":1,"x":["Core ask of the scenario:","Executives and managers want to quickly see how reps, teams and the call center are doing.","Each person should see the right level of detail: executives the big picture, managers their own team.","Example: it is like a ready-made scoreboard instead of drawing one from scratch.","So the question is: which option gives these KPIs fastest with the least building?","Correct Answer: Use the Service Analytics prebuilt dashboards in CRM Analytics.","Why This Is Correct","The Service Analytics prebuilt dashboards in CRM Analytics come ready-made with rep-level, team-level, and call-center-level views, so executives and managers get exactly the layered visibility they're asking for without any custom build work.","Because it's prebuilt, it can typically be deployed in a matter of days rather than the weeks or months a fully custom analytics solution would take, meeting the \"quickly\" requirement in the question directly.","It's also natively connected to live Service Cloud data, so the KPIs stay current automatically as new cases, calls, and work items are created, without requiring anyone to build or maintain a separate data pipeline.","Why the Other Options Are Incorrect","Option A is incorrect: Migrating data to a data lake is a heavy, slow custom-build approach when a prebuilt solution already exists.","Option C is incorrect: Building reports and dashboards from Cases from scratch is slower and more effort than using the prebuilt Service Analytics app.","Reference:","Service Analytics App Dashboards and Datasets – Salesforce Help"]},{"id":"E1-6","exam":1,"n":6,"q":"Cloud Kicks has hired a Service Cloud Consultant to build out its reports. The consultant has created a Case History report to track the history of standard and custom fields on cases and solutions where field histories are set up for tracking. What should the consultant keep in mind when working on this report type?","o":["The Data Type and New Value fields are available for viewing only.","The User and New Value fields are available for viewing only.","The Old Value and New Value fields are available for viewing only."],"a":2,"x":["Core ask of the scenario:","The consultant built a Case History report that tracks changes to case fields.","This report type has special rules about which columns you can work with.","Example: it is like a security-camera log: you can read what was there before and after, but you cannot rewrite the footage.","So the question is: which fields in this report can only be viewed, not edited?","Correct Answer: The Old Value and New Value fields are available for viewing only.","Why This Is Correct","On a Case History (field history tracking) report, Salesforce exposes only the Old Value and New Value fields for viewing, because history tracking is a generic mechanism designed to work across many different standard and custom fields.","Because the underlying History object has to store changes from fields of many different data types in a uniform way, Salesforce intentionally limits which columns are exposed on the report so the data stays consistent and readable.","The consultant needs to plan the report layout around this limitation, for example by adding the Field Name column alongside Old Value and New Value so the report is still meaningful to end users.","Why the Other Options Are Incorrect","Option A is incorrect: Data Type is not one of the fields exposed on a history report.","Option B is incorrect: User is shown on history reports, but New Value alone omits Old Value, which is also available; the actual restricted pair is Old Value and New Value.","Reference:","Track History for Cases – Salesforce Help"]},{"id":"E1-7","exam":1,"n":7,"q":"Universal Containers wants to set a custom field on the messaging session based on the URL from which the conversation originated. What should a consultant recommend to meet the requirement?","o":["Use a Flow.","Use a macro.","Use an Einstein Bot."],"a":0,"x":["Core ask of the scenario:","A company wants a custom field on each messaging chat filled in using the web page the customer started the chat from.","This is an automatic data-copy job that runs when the chat starts.","Example: like a receptionist who writes down which door you entered through, without being asked.","So the question is: which Salesforce tool can do that automation?","Correct Answer: Use a Flow.","Why This Is Correct","A Flow can be triggered when a messaging session is created, read the originating URL that's already captured in session data, and write it into a custom field automatically without any human involvement.","Flows give the consultant full declarative control over the logic, including any conditional handling (for example, parsing or validating the URL) before it's saved, all without writing Apex code.","Because it's record-triggered, it runs reliably every time a new messaging session is created, ensuring the custom field is populated consistently across every conversation rather than depending on manual entry.","Why the Other Options Are Incorrect","Option B is incorrect: A macro runs a fixed sequence of UI actions a rep triggers manually; it isn't meant to automatically capture and set a value like a source URL on session creation.","Option C is incorrect: An Einstein Bot is built for a conversational flow with the customer, not for silently populating a system field based on the originating URL.","Reference:","Create a Record-Triggered Flow – Salesforce Help"]},{"id":"E1-8","exam":1,"n":8,"q":"Cloud Tech Support is preparing to deploy Service Cloud with new features including Case Escalation Rules and a Knowledge Base. Their current support staff is accustomed to email-only case management. The company wants minimal downtime and a high adoption rate for the new solution. What should the Service Cloud Consultant recommend to prepare the support reps for the transition?","o":["Assign power users to configure the system and handle questions post-launch without a formal enablement plan.","Deliver a combination of hands-on training and Trailhead-based learning aligned to business processes before deployment.","Develop just-in-time video tutorials and provide access after go-live so reps can learn as they use the system."],"a":1,"x":["Core ask of the scenario:","Support reps are used to working only in email and will switch to a new system with Knowledge and escalation rules.","The company wants almost no downtime and wants reps to actually use the system.","Example: like teaching someone a new phone with a hands-on class before they swap their old one.","So the question is: what is the best way to prepare reps before go-live?","Correct Answer: Deliver a combination of hands-on training and Trailhead-based learning aligned to business processes before deployment.","Why This Is Correct","Combining hands-on training with Trailhead-based self-paced learning gives reps two complementary ways to build confidence: guided, instructor-led practice and flexible, on-demand modules they can revisit as needed.","Delivering this training before go-live and mapping it to the team's actual business processes ensures reps already understand the new tools in the context of their real day-to-day work, not just in the abstract.","This approach directly minimizes downtime and drives adoption, because reps are already comfortable navigating case escalation and the Knowledge base the moment the new system goes live, rather than learning on the fly with live customers.","Why the Other Options Are Incorrect","Option A is incorrect: Relying on power users without a formal enablement plan leaves most reps unprepared and increases the risk of a rocky go-live.","Option C is incorrect: Waiting until after go-live to provide training material means reps are learning the system while already trying to serve live customers, which hurts both adoption and service quality.","Reference:","Service Cloud Trails – Trailhead"]},{"id":"E1-9","exam":1,"n":9,"q":"Universal Containers wants service managers to see a real-time dashboard to understand the current state of their service teams. The managers should be able to see summary metrics such as Agent Capacity Status, Average and Longest Wait Times, and any Raised Flags. Which Omni Supervisor element(s) should the Service Cloud Consultant recommend for this purpose?","o":["The Wallboard tab","The Assigned Work tab and Work Summary view subtab","The Service Reps tab and All Agents subtab"],"a":0,"x":["Core ask of the scenario:","Managers want one live screen showing how their service team is doing right now.","They want a summary of capacity, wait times and warning flags.","Example: like the big departures board at an airport showing everything at a glance.","So the question is: which Omni Supervisor element gives this overview?","Correct Answer: The Wallboard tab","Why This Is Correct","The Wallboard tab in Omni Supervisor is purpose-built as a real-time, at-a-glance summary view, showing team-wide metrics like Agent Capacity Status, Average and Longest Wait Times, and any Raised Flags in one place.","Because it's designed for quick visual scanning rather than deep per-record detail, it's exactly the kind of dashboard a manager can glance at throughout the day to gauge overall team health without digging into individual work items.","It also supports actionable elements, so a manager who spots a problem (like a spike in wait time) can drill in or take action directly from the same view.","Why the Other Options Are Incorrect","Option B is incorrect: The Assigned Work tab and Work Summary view focus on individual work items in progress, not team-wide summary KPIs.","Option C is incorrect: The Service Reps tab and All Agents subtab show per-agent detail, not the consolidated team summary metrics the manager wants.","Reference:","Wallboard Tab Fields – Salesforce Help"]},{"id":"E1-10","exam":1,"n":10,"q":"The support team at Cloud Kicks would like to implement a messaging tool to provide deflection for common questions, gather customer experience feedback, and match feedback to service organizational goals. What should the Service Cloud Consultant recommend to meet the requirement?","o":["A contact support form for feedback and the Case Deflection component in Experience Cloud","An enhanced Einstein Bot with Feedback Collection and Generative Knowledge Answers","A conversation component with survey options and Recommended Articles in the console"],"a":1,"x":["Core ask of the scenario:","The support team wants a messaging tool that answers common questions, collects feedback, and links that feedback to company goals. This is a mix of self-service answers and survey-style feedback.","Example: like a smart virtual helper at a store entrance that answers simple questions and asks how your visit was.","So the question is: which solution covers deflection plus feedback?","Correct Answer: An enhanced Einstein Bot with Feedback Collection and Generative Knowledge Answers","Why This Is Correct","An enhanced Einstein Bot with Feedback Collection can automatically ask customers structured feedback questions at the right point in the conversation, tying responses back to organizational service goals for reporting.","Adding Generative Knowledge Answers lets the same bot deflect common questions by generating accurate responses grounded in the knowledge base, so customers get instant answers without waiting for a rep.","Delivering both capabilities through one messaging tool means Cloud Kicks gets deflection and feedback collection in a single, consistent customer touchpoint instead of stitching together multiple disconnected components.","Why the Other Options Are Incorrect","Option A is incorrect: A contact support form paired with the Case Deflection component addresses deflection but doesn't collect structured feedback tied to organizational goals.","Option C is incorrect: A conversation component with surveys and Recommended Articles doesn't provide the automated deflection an enhanced bot with generative answers does.","Reference:","Answer Questions with Generative Knowledge Answers – Salesforce Help"]},{"id":"E1-11","exam":1,"n":11,"q":"Cloud Kicks (CK) has several hundred knowledge articles that span dozens of topics and cover a wide range of products, help articles, and troubleshooting ideas. The admin at CK is going to organize the knowledge articles into data categories. What should the admin keep in mind when organizing articles?","o":["There can be up to 10,000 data categories per data category group.","Data category hierarchy can have up to 10 levels.","Articles can have up to eight data categories per data category group."],"a":2,"x":["Core ask of the scenario:","The admin is sorting hundreds of Knowledge articles into data categories, like folders.","Salesforce has limits on how many categories and levels you can use.","Example: like labeling boxes when packing: there is a maximum number of labels allowed per box.","So the question is: which limit about data categories is true?","Correct Answer: Articles can have up to eight data categories per data category group.","Why This Is Correct","Salesforce Knowledge allows an article to be tagged with up to eight data categories per data category group, so with hundreds of articles across many topics and products, the admin needs to plan category assignments within that limit.","Understanding this limit up front helps the admin design a clean, well-structured category taxonomy from the start, rather than discovering the ceiling partway through tagging hundreds of articles.","It also affects how articles can be filtered and searched later, since an article's discoverability across products and topics depends on which of those up to eight categories per group it's assigned to.","Why the Other Options Are Incorrect","Option A is incorrect: The limit on data categories per group is much lower than 10,000.","Option B is incorrect: The data category hierarchy actually supports up to 5 levels, not 10.","Reference:","Work with Data Categories – Salesforce Help"]},{"id":"E1-12","exam":1,"n":12,"q":"A manager would like information on which Knowledge articles are used most often by service reps. The contact center has a Knowledge Centered Service process that service reps follow. Which report should a consultant use to identify the Knowledge articles that are used most often?","o":["Number of Knowledge articles attached to Cases","Knowledge articles with the highest ratings","Knowledge articles with the most revisions"],"a":0,"x":["Core ask of the scenario:","A manager wants to know which help articles reps use the most.","The team follows Knowledge-Centered Service, where reps attach articles to cases they solve.","Example: like checking which library books are borrowed most often.","So the question is: which report shows the most-used articles?","Correct Answer: Number of Knowledge articles attached to Cases","Why This Is Correct","A report on the number of Knowledge articles attached to Cases directly measures actual usage, since it counts how often reps chose to link a specific article while resolving a real customer issue.","Because the contact center follows a Knowledge-Centered Service process, attaching articles to cases is already part of the reps' normal workflow, so this report reflects genuine day-to-day usage rather than a separate or artificial metric.","This gives the manager a ranked, data-driven view of which articles are truly earning their keep, which can then inform decisions about promoting, updating, or retiring specific content.","Why the Other Options Are Incorrect","Option B is incorrect: Article ratings reflect customer or peer opinion of quality, not how often reps are actually using the article to resolve cases.","Option C is incorrect: Revision count reflects how often an article is edited, not how often it's used by reps.","Reference:","Use Custom Report Types to Report on Support Activity – Salesforce Help"]},{"id":"E1-13","exam":1,"n":13,"q":"Universal Containers is considering additional channels for its customers to communicate directly with customer support reps. Currently, customers are able to open support tickets through social media, web chat, phone, and SMS.In addition to Digital Engagement, what should a consultant recommend to meet the requirement?","o":["Inbox","Email-to-Case","AppExchange"],"a":1,"x":["Core ask of the scenario:","The company already lets customers reach support by social media, web chat, phone and text.","It wants one more channel on top of Digital Engagement.","Example: like a shop that already has a website, phone and WhatsApp and now adds a plain email address.","So the question is: which extra channel should be added?","Correct Answer: Email-to-Case","Why This Is Correct","Email-to-Case adds a channel that isn't already covered by the existing Digital Engagement channels (social, web chat, SMS), giving customers a familiar way to open a support ticket straight from their inbox.","It requires no separate app or account for the customer to use, since sending an email is already something every customer knows how to do, which lowers the barrier to reaching support.","It also automatically creates a structured Case record from the inbound email, so reps get a properly tracked ticket instead of an unstructured message that has to be manually converted.","Why the Other Options Are Incorrect","Option A is incorrect: Inbox is a Sales Cloud productivity tool for reps' email, not an additional customer-facing support channel.","Option C is incorrect: AppExchange is a marketplace, not a channel in itself.","Reference:","Set Up Email-to-Case – Salesforce Help"]},{"id":"E1-14","exam":1,"n":14,"q":"In which of the following scenarios should a consultant use a Screen Flow?","o":["Transfer a call to another support rep within the Service Console.","Redirect a support rep to a Knowledge article during case creation.","Provide decision-based troubleshooting steps for support reps."],"a":2,"x":["Core ask of the scenario:","A Screen Flow is a guided set of screens that a person clicks through.","You need to pick the situation where that kind of guided screen is the right tool.","Example: like a phone script with Yes/No steps that tells a rep what to try next.","So the question is: in which scenario does a Screen Flow fit best?","Correct Answer: Provide decision-based troubleshooting steps for support reps.","Why This Is Correct","A Screen Flow is designed to walk a user through a guided, multi-step interface where each screen can branch based on previous answers, which is exactly the shape of decision-based troubleshooting.","Because it's interactive, a Screen Flow can ask the rep a diagnostic question, then dynamically present only the next relevant troubleshooting step based on the answer, rather than showing every possible step at once.","This keeps even newer or less experienced reps on a consistent, guided troubleshooting path, improving both resolution accuracy and speed compared to relying on reps to remember steps from memory or documentation.","Why the Other Options Are Incorrect","Option A is incorrect: Transferring a call is a telephony action handled through Service Cloud Voice/Omni-Channel controls, not a Screen Flow.","Option B is incorrect: Redirecting to a Knowledge article during case creation is better handled with the Knowledge component or article recommendations, not a guided Screen Flow.","Reference:","Get a Basic Screen Flow Ready for Users – Salesforce Help"]},{"id":"E1-15","exam":1,"n":15,"q":"Universal Containers wants to automate the process of case creation. While conducting a business process review, the consultant learned that customers sometimes upload digital pictures of the problem. Which solution should a consultant recommend?","o":["AppExchange package","Web-to-Case","Email-to-Case"],"a":1,"x":["Core ask of the scenario:","The company wants cases created automatically, and customers sometimes need to send pictures of their problem.","The solution must accept file uploads when the customer submits a request.","Example: like an online complaint form with an Upload Photo button.","So the question is: which case-creation method supports that?","Correct Answer: Web-to-Case","Why This Is Correct","Web-to-Case forms can be configured to accept file uploads directly on the submission form, so customers can attach digital pictures of the problem the moment they submit the case.","Because the case and its attachment are created together automatically from the form submission, there's no manual step for a rep to go find and attach a picture that was sent separately.","This automates the entire intake process the consultant was asked to streamline, capturing both the case details and supporting visual evidence in one single, structured action.","Why the Other Options Are Incorrect","Option A is incorrect: There's no need for a third-party AppExchange package when Web-to-Case natively supports file attachments on the form.","Option C is incorrect: Email-to-Case can technically pick up image attachments from an email, but it doesn't automate the case-creation-with-picture workflow as directly or reliably as a purpose-built Web-to-Case form.","Reference:","Turn On and Customize Web-to-Case – Salesforce Help"]},{"id":"E1-16","exam":1,"n":16,"q":"Universal Containers (UC) wants to report on how many customers with Service Contracts have specific entitlements to determine if UC's support offerings should be adjusted. Which feature should the consultant recommend?","o":["Build a custom report type.","Build a dashboard.","Build a joined report."],"a":0,"x":["Core ask of the scenario:","The company wants to count customers who have service contracts and certain entitlements.","The standard reports do not link these records in the way needed.","Example: like making a custom spreadsheet view that joins two lists together.","So the question is: which feature lets you report on that relationship?","Correct Answer: Build a custom report type.","Why This Is Correct","A custom report type lets the consultant define a relationship that joins Service Contracts, Contract Line Items, and Entitlements together, which isn't available as a standard report type out of the box.","This gives UC a reusable reporting foundation: once built, anyone can create multiple reports off the same custom report type to slice the entitlement data by product, region, or any other angle needed.","It's also the only option of the three that can actually establish the underlying object relationship needed; a dashboard or joined report can only visualize or combine data that's already reportable.","Why the Other Options Are Incorrect","Option B is incorrect: A dashboard only visualizes data from an existing report; it can't create the underlying cross-object relationship needed here.","Option C is incorrect: A joined report combines several report blocks side by side, but it can't establish the parent-child relationship between Service Contracts and Entitlements the way a custom report type can.","Reference:","Create a Custom Report Type in the Enhanced Custom Report Type Builder – Salesforce Help"]},{"id":"E1-17","exam":1,"n":17,"q":"Cloud Kicks (CK) uses Service Cloud to manage its customer support, and its inventory and order data is stored in Snowflake. CK's customers use support to ask about their orders and request replacement items. CK wants to avoid duplicating this data in Salesforce but still provide real-time, actionable insights for support reps. What should the Service Cloud Consultant recommend so that support reps will have a comprehensive view of their customers' order history?","o":["Use an Apex integration to pull order data from Snowflake via API each time a case is opened.","Use MuleSoft to extract order data from Snowflake and store it in a custom object in Salesforce for support reps to reference.","Use Data Cloud to connect to Snowflake, and unify order data with CRM data."],"a":2,"x":["Core ask of the scenario:","Order data lives in Snowflake, and the company does not want to copy it into Salesforce.","Reps still need a full, real-time view of a customer's order history.","Example: like looking at a friend's photos through a shared window instead of making copies.","So the question is: which approach connects Snowflake data without duplicating it?","Correct Answer: Use Data Cloud to connect to Snowflake, and unify order data with CRM data.","Why This Is Correct","Data Cloud connects directly to Snowflake and can unify order data with CRM data in place, without physically copying and storing a duplicate set of records inside Salesforce.","This gives support reps a real-time, comprehensive view of order history the moment a case is opened, since Data Cloud keeps the unified profile current rather than relying on a stale or periodically-synced copy.","It also avoids the storage costs, sync maintenance, and data-duplication risk that come with physically copying Snowflake data into Salesforce, which directly matches CK's stated goal of avoiding duplication.","Why the Other Options Are Incorrect","Option A is incorrect: A custom Apex integration that calls out every time a case opens adds latency, complexity, and ongoing maintenance overhead compared to a native Data Cloud connection.","Option B is incorrect: Using MuleSoft to copy the data into a custom Salesforce object is exactly the data duplication CK wants to avoid.","Reference:","Share Data with Snowflake – Salesforce Help"]},{"id":"E1-18","exam":1,"n":18,"q":"Universal Containers (UC) wants its Agentforce Service Agent to provide accurate and trustworthy responses to customer inquiries by leveraging their vast repository of internal knowledge articles, which includes both structured fields and unstructured text. How can a Service Cloud Consultant design for the accuracy and trustworthiness of the AI agent's responses using this company's data?","o":["Map specific fields from Knowledge articles to predefined questions.","Use Agentforce Data Library with Knowledge to ground the AI agent.","Use the LLM's global Knowledge data set to restructure UC's data."],"a":1,"x":["Core ask of the scenario:","The company wants its AI agent to give accurate, trustworthy answers.","Its answers should come from the company's own Knowledge articles, not guesswork.","Example: like a student who answers using the textbook, not memory.","So the question is: how do you ground the AI agent in company articles?","Correct Answer: Use Agentforce Data Library with Knowledge to ground the AI agent.","Why This Is Correct","Agentforce Data Library with Knowledge is the mechanism specifically designed to ground an AI agent's answers in an organization's own Knowledge content, both structured fields and unstructured article text.","By grounding responses in UC's actual, curated knowledge base rather than the model's general training data, the agent's answers stay accurate, current, and specific to UC's products and processes.","This approach scales naturally as the knowledge base grows or changes, since the agent continues drawing from the same governed source of truth instead of relying on brittle, manually maintained field mappings.","Why the Other Options Are Incorrect","Option A is incorrect: Manually mapping specific fields to predefined questions doesn't scale to a large, varied knowledge base and misses unstructured text.","Option C is incorrect: Using the LLM's generic global data set instead of UC's own Knowledge would produce answers that aren't grounded in UC's actual, trustworthy content.","Reference:","Agentforce Data Library – Salesforce Help"]},{"id":"E1-19","exam":1,"n":19,"q":"A large retail company wants to optimize its customer service operations by using AI to analyze conversation transcripts across all service channels. The goal is to extract common contact reasons, predict customer sentiment, and deliver personalized recommendations to service reps during live interactions. Which solution should a Service Cloud Consultant use to meet these requirements?","o":["Use Einstein Article Recommendations to suggest knowledge articles based on historical case topics, and enable Chat Transcripts for service rep review.","Use Data Cloud to unify transcript metadata, loyalty, and service data to generate calculated insights and sentiment-based recommendations for service reps and supervisors.","Enable Omni-Channel and use Service Analytics dashboards to monitor volume and service rep activity across channels in real time."],"a":1,"x":["Core ask of the scenario:","A retailer wants AI to study conversation transcripts from all channels.","It wants common reasons for contact, customer mood, and tips for reps while they are chatting.","Example: like a coach who listens to all calls and suggests what to say next.","So the question is: which solution combines these data sources into insights?","Correct Answer: Use Data Cloud to unify transcript metadata, loyalty, and service data to generate calculated insights and sentiment-based recommendations for service reps and supervisors.","Why This Is Correct","Data Cloud can unify transcript data, loyalty data, and service data from every channel into a single customer profile, which is the foundation needed to extract patterns like common contact reasons across the whole business.","Once that data is unified, Data Cloud can generate calculated insights and sentiment-based recommendations that are delivered to reps and supervisors during live interactions, exactly meeting the real-time personalization requirement.","Because the analysis spans every channel rather than just one, the resulting contact-reason and sentiment insights are far more complete and reliable than anything a single-channel tool could produce.","Why the Other Options Are Incorrect","Option A is incorrect: Einstein Article Recommendations only surfaces knowledge articles; it doesn't extract contact reasons or predict sentiment across channels.","Option C is incorrect: Omni-Channel and Service Analytics dashboards show volume and activity, but they don't analyze transcripts to extract contact reasons or predict sentiment.","Reference:","About Salesforce Data Cloud – Salesforce Help"]},{"id":"E1-20","exam":1,"n":20,"q":"Cloud Kicks asked a Service Cloud Consultant to help it determine its customer retention rate. Which numbers does the consultant need to calculate an accurate rate?","o":["Customers at the start of a given period, customers at the end of that period, and new customers acquired during that period","Customers at the start of a given period, customers at the end of that period, and old customers who returned during that period","Customers at the start of a given period, customers at the end of that period, and customers lost during that period"],"a":0,"x":["Core ask of the scenario:","The company wants to work out its customer retention rate, meaning how many customers it keeps.","The formula needs the right counts from a period of time.","Example: if you start the year with 100 customers and end with 90 after adding 10 new ones, you kept 80 of the original 100.","So the question is: which numbers do you need for the formula?","Correct Answer: Customers at the start of a given period, customers at the end of that period, and new customers acquired during that period","Why This Is Correct","Customer retention rate is calculated as ((customers at end ? new customers acquired) ÷ customers at start) × 100, so mathematically the formula only requires three inputs: the start count, the end count, and new customers acquired.","The new customers acquired figure has to be subtracted out of the ending count specifically so the formula measures retention of the original customer base, not growth from newly won customers.","Without excluding new customers this way, the rate could look artificially high just because sales brought in new business, even if existing customers were actually churning.","Why the Other Options Are Incorrect","Option B is incorrect: Returning customers aren't part of the standard retention rate formula.","Option C is incorrect: Customers lost isn't one of the three inputs to the standard retention formula, which instead relies on new customers acquired.","Reference:","Track Service Metrics – Salesforce Help"]},{"id":"E1-21","exam":1,"n":21,"q":"Universal Containers (UC) is preparing to implement Service Cloud and wants to onboard its global support team. UC is gathering feedback from the support team about how they will use Service Cloud. Requirements gathering sessions have resulted in a large set of deliverables. What should a consultant recommend as the next step?","o":["Identify and prioritize the requirements for the minimum viable product.","Prioritize the requirements based on requests from the regions.","Prioritize the requirements based on the stakeholder who submitted them."],"a":0,"x":["Core ask of the scenario:","Many requirements were collected from the global support team.","There is too much to build at once, so the team must decide what to do next.","Example: like packing for a trip: first choose the must-haves for the first suitcase.","So the question is: what is the best next step for sorting the requirements?","Correct Answer: Identify and prioritize the requirements for the minimum viable product.","Why This Is Correct","After a large requirements-gathering exercise produces a big list of deliverables, the next responsible step is to identify and prioritize requirements for a minimum viable product (MVP) rather than trying to build everything at once.","Focusing on an MVP lets the team deliver real value to the global support team quickly, gather feedback from actual usage, and then iterate, which reduces the risk of a long, unfocused build cycle.","This approach also keeps the project scoped and manageable, since trying to satisfy every requirement from every region and stakeholder simultaneously would likely delay the whole rollout.","Why the Other Options Are Incorrect","Option B is incorrect: Prioritizing purely by which region asked for a feature ignores overall business value and can lead to an unfocused rollout.","Option C is incorrect: Prioritizing by who submitted the requirement rather than its actual value doesn't produce a sound, business-driven MVP.","Reference:","Track Service Metrics – Salesforce Help"]},{"id":"E1-22","exam":1,"n":22,"q":"Cloud Kicks provides support to customers in email, social, and chat channels. Managers want to find a way to improve service rep efficiency. A recent study found service reps spend a lot of time searching for articles, manually copying text from the article, and pasting it into responses. What should a consultant recommend as a solution?","o":["Configure Lightning Knowledge component and related list actions.","Set up quick text options in the utility bar to add article links.","Configure Lightning Knowledge component to auto attach article PDF."],"a":0,"x":["Core ask of the scenario:","Reps waste time searching for articles and copy-pasting text into replies.","The company wants a quicker way to use articles inside the case.","Example: like having a Send button on a recipe instead of retyping it.","So the question is: which Knowledge setup removes the manual copy-paste?","Correct Answer: Configure Lightning Knowledge component and related list actions.","Why This Is Correct","Configuring the Lightning Knowledge component with related list actions, such as an \"Insert\" or \"Email\" action, lets a rep push article text directly into their response with a single click.","This eliminates the exact pain point described in the scenario: instead of manually copying text out of an article and pasting it into a reply, the rep triggers an action that does it automatically and consistently.","It also reduces the risk of copy-paste errors, like missing formatting or grabbing an outdated excerpt, since the action inserts the current, approved article content directly.","Why the Other Options Are Incorrect","Option B is incorrect: Quick text with article links still requires the customer to click through to read the article rather than getting the answer directly in the reply.","Option C is incorrect: Auto-attaching an article PDF doesn't stop reps from manually copying text; it just adds an attachment.","Reference:","Set Up Knowledge Component Actions – Salesforce Help"]},{"id":"E1-23","exam":1,"n":23,"q":"Universal Containers wants Salesforce to suggest Knowledge articles to service reps based on information about the case. Which solution should a consultant recommend?","o":["Add the Knowledge related list to the case page layout.","Add the Knowledge component on the case Lightning record page.","Add the Knowledge object to global search objects."],"a":1,"x":["Core ask of the scenario:","The company wants Salesforce to suggest helpful articles automatically based on what is in the case.","Reps should not need to search from scratch.","Example: like a streaming service that suggests shows based on what you watched.","So the question is: where do you add the feature that shows suggested articles?","Correct Answer: Add the Knowledge component on the case Lightning record page.","Why This Is Correct","Adding the Knowledge component to the case Lightning record page automatically analyzes the case's details, like subject and description, and surfaces relevant suggested articles without the rep having to search manually.","Because the suggestions appear proactively as soon as the rep opens the case, it saves time compared to a rep having to think of search terms and run a manual query themselves.","It keeps the recommendation logic tied directly to the specific case's content, so the suggestions stay relevant even as the rep works different cases throughout the day.","Why the Other Options Are Incorrect","Option A is incorrect: The Knowledge related list just shows already-attached articles; it doesn't proactively suggest new ones based on the case.","Option C is incorrect: Adding Knowledge to global search objects only helps when a rep manually searches; it doesn't proactively suggest articles for the specific case.","Reference:","Knowledge Lightning Component – Salesforce Help"]},{"id":"E1-24","exam":1,"n":24,"q":"The Universal Containers product development team uses Service Cloud. UC has recently added its billing support team to its existing Service Cloud implementation. Upon reviewing the billing and product team's case lifecycles, the following statuses were documented: Billing support team: New, Under Review, In Progress, Blocked, Closed. Product development team: New, Under Review, In Progress, Closed. How should a consultant configure Service Cloud to provide each team with the correct case lifecycle?","o":["Create a Path widget to visualize each team's lifecycle.","Use Support Processes for each team's lifecycle.","Use dynamic forms to hide unnecessary options for each team's lifecycle."],"a":1,"x":["Core ask of the scenario:","Two teams use the same case object but have different status steps (the billing team has an extra Blocked step).","Each team must see only its own steps.","Example: like two restaurants sharing one kitchen but using different menus.","So the question is: which setting gives each team its own case statuses?","Correct Answer: Use Support Processes for each team's lifecycle.","Why This Is Correct","Support Processes let each record type use its own defined subset and order of Status field values, so the billing team can have their five-status lifecycle (including Blocked) while the product team keeps their simpler four-status lifecycle.","Because the process is tied to record type, each team automatically sees only the statuses relevant to their own workflow when they update a case, without any risk of accidentally selecting a status meant for the other team.","This is also easy to maintain going forward: if either team's lifecycle changes, the admin can update just that team's support process without touching the other team's configuration.","Why the Other Options Are Incorrect","Option A is incorrect: A Path widget just visualizes an existing set of statuses; it can't give two teams two different sets of picklist values.","Option C is incorrect: Dynamic forms control which fields display, not which Status picklist values are available for a case.","Reference:","Set Up a Support Process – Salesforce Help"]},{"id":"E1-25","exam":1,"n":25,"q":"Cloud Kicks uses Omni-Channel to route cases to service reps based on location. At times, certain locations are over capacity while other locations have available capacity. Managers would like the ability to respond to these situations. What should a consultant recommend as a solution?","o":["Use Omni-Channel Skills-Based Routing to expedite case resolution.","Configure an Overflow Assignee in Omni-Channel Routing.","Use Omni Supervisor to change reps' queues."],"a":1,"x":["Core ask of the scenario:","Cases are routed by location, so some offices are overloaded while others are free.","Managers want a way to react when this happens.","Example: like a busy supermarket checkout sending extra shoppers to a quiet lane.","So the question is: which Omni-Channel setting handles the overflow?","Correct Answer: Configure an Overflow Assignee in Omni-Channel Routing.","Why This Is Correct","Configuring an Overflow Assignee in the Omni-Channel routing configuration lets Cloud Kicks define where excess work should automatically go when a location's queue is over capacity.","As soon as a rep or queue at capacity would otherwise leave a case unassigned, the system automatically reroutes it to the designated overflow queue or rep with available capacity, without any manual monitoring.","This keeps response times consistent across locations, since customers aren't stuck waiting behind a backlog at one site just because that site happens to be busier at that moment.","Why the Other Options Are Incorrect","Option A is incorrect: Skills-Based Routing matches cases to reps by skill, but it doesn't specifically solve the location-capacity imbalance being described.","Option C is incorrect: Manually using Omni Supervisor to move reps between queues is a reactive, manual workaround rather than an automated capacity-balancing solution.","Reference:","Set Up Omni-Channel Routing – Salesforce Help"]},{"id":"E1-26","exam":1,"n":26,"q":"What is a common deflection technique to reduce the number of interactions for a contact center?","o":["Recommend articles prior to a Chat session.","Suggest articles for an Email-to-Case question.","Recommend articles during a call from a support rep."],"a":0,"x":["Core ask of the scenario:","Deflection means solving a customer's problem before they need to talk to a person.","The question asks for a common technique to reduce live interactions.","Example: like a website showing helpful answers before you press the Chat button.","So the question is: where should articles be shown so customers help themselves first?","Correct Answer: Recommend articles prior to a Chat session.","Why This Is Correct","Recommending articles before a Chat session even starts gives the customer a chance to self-serve the answer right on the spot, meaning the live chat interaction may never need to happen at all.","This is the textbook definition of deflection: preventing an interaction from occurring in the first place, rather than making an interaction that has already started go faster.","By contrast, suggesting content after an email case exists or during a live call happens too late to actually deflect, since the interaction (and the resource cost of handling it) has already begun.","Why the Other Options Are Incorrect","Option B is incorrect: Suggesting articles on an Email-to-Case question happens after the case (and the interaction) already exists, so it doesn't deflect the interaction itself.","Option C is incorrect: Recommending articles during a live call happens after the interaction has already started, so it doesn't prevent or deflect it.","Reference:","Case Deflection – Salesforce Help"]},{"id":"E1-27","exam":1,"n":27,"q":"Universal Containers wants service managers to see a real-time dashboard to understand the current state of their service teams. The managers should be able to see which service reps are online, their current presence status, how long they've been logged in, and their capacity utilization for both primary and interruptible work. Which Omni Supervisor element(s) should the Service Cloud Consultant recommend for this purpose?","o":["The Service Reps tab and All Agents subtab","The Wallboard tab with actionable items","The Assigned Work tab and Work Summary view"],"a":0,"x":["Core ask of the scenario:","Managers want to see which reps are online, their status, how long they have been logged in, and how busy they are.","This is a per-person view of the team, not just an overall summary.","Example: like a staff roster showing who is at their desk and how full their plate is.","So the question is: which Omni Supervisor element shows rep-by-rep details?","Correct Answer: The Service Reps tab and All Agents subtab","Why This Is Correct","The Service Reps tab and All Agents subtab in Omni Supervisor list every individual rep along with their real-time presence status, exactly what's needed to see who is online right now.","That same view also shows how long each rep has been logged in and their current capacity utilization, broken out separately for primary and interruptible work, matching every detail the managers asked for.","Because it's a live, per-rep view rather than a team-wide summary, managers can drill into any individual rep's status directly from this tab if they need to follow up.","Why the Other Options Are Incorrect","Option B is incorrect: The Wallboard tab shows team-wide summary metrics, not per-rep presence status and login duration.","Option C is incorrect: The Assigned Work tab and Work Summary view focus on work items, not individual rep presence and capacity details.","Reference:","Service Reps Tab – Salesforce Help"]},{"id":"E1-28","exam":1,"n":28,"q":"In the build phase of a Service Cloud implementation for Universal Containers, which activity should a consultant prioritize to ensure the system aligns with the client's business processes and requirements?","o":["Configure, develop, and test the application in a sandbox environment.","Migrate data to the sandbox environment and verify successful migration.","Develop training materials after configuring the application to prepare for user adoption."],"a":0,"x":["Core ask of the scenario:","The build phase is when the system is actually set up and tested.","The consultant must pick the activity that keeps the build matching what the business needs.","Example: like building a house on a practice site before moving in.","So the question is: what should be done first and most carefully during the build phase?","Correct Answer: Configure, develop, and test the application in a sandbox environment.","Why This Is Correct","During the build phase, the priority is to configure, develop, and test the application in a sandbox environment, since this is where the solution is actually shaped to match business processes before anyone relies on it.","Testing in a sandbox first lets the team catch configuration issues, edge cases, and process misalignments early, while changes are still cheap and safe to make, rather than discovering problems in production.","This activity has to come before things like training material development or production rollout, because you can't meaningfully train users or migrate live data against a solution that hasn't been built and validated yet.","Why the Other Options Are Incorrect","Option B is incorrect: Data migration validation is important but is a data-readiness task, not the core build-phase activity of configuring and testing the solution itself.","Option C is incorrect: Developing training materials is a pre-go-live enablement activity that typically follows, not precedes, having a configured and tested solution.","Reference:","Track Service Metrics – Salesforce Help"]},{"id":"E1-29","exam":1,"n":29,"q":"Universal Containers would like to set up Salesforce to automatically route cases to the appropriate service reps based on the following criteria: Cases are generated via email, web form, or Experience site. Service reps should be able to handle three cases at a time. Service reps should be able to choose whether to accept new cases. The service rep's manager should have insight into the rep's workload. Which tool should the administrator use to route cases based on the support team's requirements?","o":["Omni-Channel routing","Case assignment rules","Record-triggered Flow"],"a":0,"x":["Core ask of the scenario:","Cases come in from email, web forms and the Experience site.","Each rep can handle three cases at once, can accept or decline work, and managers can see workloads.","Example: like a restaurant host seating guests only at tables with free seats.","So the question is: which routing tool supports capacity and accept/decline?","Correct Answer: Omni-Channel routing","Why This Is Correct","Omni-Channel routing natively supports per-rep capacity limits, so it can be configured to cap each rep at exactly three cases at a time, straight out of the box.","It also supports push-based routing where reps can accept or decline incoming work depending on configuration, and it gives managers real- time visibility into workload through Omni Supervisor, covering every stated requirement in one native tool.","Because all of this is declarative configuration rather than custom code, it's faster to build and easier to maintain than trying to replicate the same behavior with rules or a custom flow.","Why the Other Options Are Incorrect","Option B is incorrect: Case assignment rules can route based on criteria, but they don't manage per-rep capacity or let reps choose whether to accept a case.","Option C is incorrect: A record-triggered Flow could technically be built to assign cases, but it would require custom logic to replicate capacity limits and accept/decline behavior that Omni-Channel already provides natively.","Reference:","Omni-Channel Routing Model Options – Salesforce Help"]},{"id":"E1-30","exam":1,"n":30,"q":"Support reps at Cloud Kicks handle three unique types of customer issues. Support rep turnover is high, so there are many inexperienced reps on the front lines. Management would like a way for all reps to gather information relevant to the specific issue in a user-friendly interface and ensure Einstein Next Best Action is displayed. Following best practices, how should the admin configure Service Cloud to meet these requirements?","o":["Use the Actions & Recommendations component to launch flows.","Create a Lightning record page for each record type.","Define page layouts, record types, and support processes."],"a":0,"x":["Core ask of the scenario:","Many new reps handle three kinds of issues and need guidance to collect the right information.","Management also wants Einstein Next Best Action to appear for them.","Example: like a GPS giving step-by-step directions to a new driver.","So the question is: which configuration gives reps guided steps and recommendations?","Correct Answer: Use the Actions & Recommendations component to launch flows.","Why This Is Correct","The Actions & Recommendations component is specifically built to surface Einstein Next Best Action recommendations directly on the record page, satisfying the requirement to ensure recommendations are displayed.","It can also launch guided flows right from the component, so even a brand-new or inexperienced rep can follow a consistent, structured path to gather the information relevant to whichever of the three issue types they're handling.","Because it's a single reusable component, it gives every rep, regardless of experience level, the exact same user-friendly interface and recommendation engine, which directly addresses the high-turnover concern in the scenario.","Why the Other Options Are Incorrect","Option B is incorrect: Building a separate Lightning record page per record type adds ongoing maintenance overhead without specifically surfacing Next Best Action recommendations.","Option C is incorrect: Page layouts, record types, and support processes control what fields and statuses reps see, but they don't display Einstein Next Best Action recommendations.","Reference:","Einstein Next Best Action – Salesforce Help"]},{"id":"E1-31","exam":1,"n":31,"q":"The contact center at Universal Containers wants to reduce case volume and resolution time within Service Cloud. Which solution should a Service Cloud Consultant recommend?","o":["Use the Article Auto-Response flow.","Embed the Agentforce Service Agent in the Service Console.","Implement a Knowledge base for customers and internal users."],"a":2,"x":["Core ask of the scenario:","The contact center wants fewer cases and faster solutions.","The best fix helps customers and reps find answers on their own.","Example: like a good FAQ page that stops people from calling at all.","So the question is: which solution reduces case volume and resolution time?","Correct Answer: Implement a Knowledge base for customers and internal users.","Why This Is Correct","Implementing a Knowledge base for both customers and internal users reduces case volume because customers can find answers themselves before ever opening a case, directly addressing the volume goal.","It also reduces resolution time, because when a case is opened anyway, reps have fast access to the same vetted, searchable answers instead of researching the issue from scratch each time.","Because it serves both audiences from a single content source, the knowledge base creates a compounding benefit: content improved for internal use also helps customers, and vice versa, without maintaining two separate systems.","Why the Other Options Are Incorrect","Option A is incorrect: There is no standard \"Article Auto-Response flow\" feature by that name.","Option B is incorrect: Embedding an Agentforce Service Agent can help with case deflection, but on its own it doesn't give internal reps the faster resolution benefit that a shared Knowledge base provides.","Reference:","Salesforce Knowledge – Salesforce Help"]},{"id":"E1-32","exam":1,"n":32,"q":"Cloud Kicks provides regular and special support to customers. When a special case is created, a dedicated account manager needs Read-Only access and a support specialist needs Read and Write access. Which feature will provide the required level of access?","o":["View All for Case","Case teams","Manager groups"],"a":1,"x":["Core ask of the scenario:","On special cases, an account manager needs read-only access and a support specialist needs edit access.","Access must be granted for individual cases, not across all cases.","Example: like giving two specific people different keys to one room only.","So the question is: which feature grants per-case access with different permission levels?","Correct Answer: Case teams","Why This Is Correct","Case Teams let the consultant add specific named users to one individual case and assign each of them a distinct role with its own access level, exactly matching the two-tier access this scenario calls for.","The dedicated account manager can be added with a Read-Only case team role, while the support specialist is added with a Read/Write role, giving each person precisely the access they need and nothing more.","Because this is configured per case rather than org-wide, it works well for special cases specifically, without granting broader access to every case in the system.","Why the Other Options Are Incorrect","Option A is incorrect: \"View All\" on Cases grants broad object-level access to every case, not a targeted Read-Only vs Read/Write split for two specific users on one case.","Option C is incorrect: \"Manager groups\" is not a standard Salesforce sharing feature for this scenario.","Reference:","What's a Case Team? – Salesforce Help"]},{"id":"E1-33","exam":1,"n":33,"q":"Universal Containers wants to move articles from an old database to its new Salesforce Knowledge system. Many of the how-to articles include images that need to be transferred. What should a consultant consider when moving these images into Salesforce Knowledge?","o":["Add images to an HTML file.","Change all images to JPEG files.","Ensure each image is less than 25 MB."],"a":2,"x":["Core ask of the scenario:","Old how-to articles contain pictures that must be moved into Salesforce Knowledge.","Salesforce has rules about image size and format.","Example: like uploading photos to a website that only accepts files up to a certain size.","So the question is: what should the consultant keep in mind about images during the move?","Correct Answer: Ensure each image is less than 25 MB.","Why This Is Correct","Salesforce Knowledge rich text fields have a defined maximum image size, so before migrating how-to articles, the consultant needs to check that every embedded image falls under that limit or the upload will fail.","Ensuring images are appropriately sized up front also keeps articles loading quickly for end users, since oversized images can slow down or break the article viewing experience.","Planning for this constraint early lets the team batch-resize any oversized images before migration, avoiding a slow, error-prone process of discovering failures one article at a time during the actual move.","Why the Other Options Are Incorrect","Option A is incorrect: Wrapping images in an HTML file isn't how images are embedded in a Knowledge rich text field.","Option B is incorrect: There's no requirement that every image be converted specifically to JPEG; the real constraint that matters during migration is file size.","Reference:","Rich Text Area Field Considerations – Salesforce Help"]},{"id":"E1-34","exam":1,"n":34,"q":"A growing retail company wants to modernize its legacy on-premises contact center, which is costly, hard to scale, and lacks support for new digital channels. The company wants to reduce overhead, scale easily during seasonal spikes, and give service reps real-time customer insights. What should a Service Cloud Consultant recommend?","o":["Build a custom Experience Cloud solution and integrate with external telephony providers using APIs.","Deploy Salesforce Contact Center with Amazon Connect to unify voice, chat, and case management in the cloud with real-time insights.","Extend legacy systems using Omni-Channel, Live Agent, and a third-party CTI to add new digital channels over time."],"a":1,"x":["Core ask
